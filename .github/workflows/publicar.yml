name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Pruebas de permisos de la comunidad contra el proyecto Supabase de PRUEBAS.
  # Si fallan, no se publica. Sin los secretos (p. ej. en un fork) se omite con un aviso.
  # Cada paso recibe solo los secretos que necesita (los de instalación de dependencias, ninguno) y no se usa
  # ningún token de la API de gestión: serviría también sobre el proyecto real.
  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PRUEBA_REF: ${{ secrets.SUPABASE_PRUEBA_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Avisar si faltan los secretos
        if: env.SUPABASE_PRUEBA_REF == ''
        run: |
          echo "::warning::Sin secretos de Supabase: se omiten las pruebas de permisos."
      - uses: actions/setup-node@v4
        if: env.SUPABASE_PRUEBA_REF != ''
        with:
          node-version: 24
          cache: npm
      - if: env.SUPABASE_PRUEBA_REF != ''
        run: npm ci
      - name: Aplicar migraciones al proyecto de pruebas
        if: env.SUPABASE_PRUEBA_REF != ''
        env:
          SUPABASE_PRUEBA_DB_PASSWORD: ${{ secrets.SUPABASE_PRUEBA_DB_PASSWORD }}
          SUPABASE_PRUEBA_POOLER_HOST: aws-0-us-east-1.pooler.supabase.com
        run: bash scripts/supabase/aplicar.sh prueba
      - name: Pruebas del cargador de catálogos
        if: env.SUPABASE_PRUEBA_REF != ''
        run: |
          pip install pyyaml pytest
          python3 -m pytest scripts/supabase -q
      - name: Sincronizar los medicamentos
        if: env.SUPABASE_PRUEBA_REF != ''
        env:
          SUPABASE_PRUEBA_URL: ${{ secrets.SUPABASE_PRUEBA_URL }}
          SUPABASE_PRUEBA_SERVICE_KEY: ${{ secrets.SUPABASE_PRUEBA_SERVICE_KEY }}
        run: python3 scripts/supabase/cargar_catalogos.py --destino prueba --solo-medicamentos
      - name: Pruebas de permisos
        if: env.SUPABASE_PRUEBA_REF != ''
        env:
          SUPABASE_PRUEBA_URL: ${{ secrets.SUPABASE_PRUEBA_URL }}
          SUPABASE_PRUEBA_ANON_KEY: ${{ secrets.SUPABASE_PRUEBA_ANON_KEY }}
          SUPABASE_PRUEBA_SERVICE_KEY: ${{ secrets.SUPABASE_PRUEBA_SERVICE_KEY }}
        run: npm run test:supabase

  publicar:
    needs: [construir, supabase]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
