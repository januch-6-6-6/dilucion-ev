contraindicaciones:
- Queratitis por herpes simple; vaccinia, varicela y otras infecciones víricas de córnea o conjuntiva.
- Infecciones fúngicas o micobacterianas del ojo; infecciones agudas no tratadas.
- Extracción simple de un cuerpo extraño de la córnea (CIMA).
