- validezAbiertoDias: 28
  texto: 4 semanas tras la primera apertura.
  fuente:
    ref: CIMA-TOP-BRIMONIDINA-BRINZOLAMIDA-114933001
    detalle: '6.3: 4 semanas tras la primera apertura del envase'
administracion:
  texto: Agitar bien antes de usar. Tras instilar, cerrar suavemente los ojos u ocluir el conducto nasolagrimal para reducir
    la absorción sistémica. Ocluir 2 minutos. Espaciar al menos 5 minutos de otros colirios; las pomadas al final. No tocar
    el ojo con la punta del frasco.
  fuente:
    ref: CIMA-TOP-BRIMONIDINA-BRINZOLAMIDA-114933001
    detalle: 4.2 Forma de administración
contraindicaciones:
- Hipersensibilidad a las sulfonamidas (CIMA).
- En tratamiento con IMAO o con antidepresivos que afectan la transmisión noradrenérgica (tricíclicos, mianserina) (CIMA).
- Insuficiencia renal grave (ClCr <30 ml/min) o acidosis hiperclorémica (CIMA).
- Neonatos y niños menores de 2 años (CIMA).
alertas:
- Simbrinza es 10 mg/ml + 2 mg/ml; el registro chileno no indica concentración en el nombre.
- Precaución en insuficiencia hepática (CIMA).
