    detalle: '6.3: desechar 4 semanas después de la primera apertura; 6.4 por debajo de 25ºC'
administracion:
  texto: Lavarse las manos. Tras instilar, ocluir el conducto nasolagrimal 2–3 minutos para reducir la absorción sistémica.
    Espaciar al menos 5 minutos de otros colirios; las pomadas al final. No tocar el ojo con la punta del frasco.
  fuente:
    ref: CIMA-TOP-ATROPINA-39474
    detalle: 4.2 Forma de administración
contraindicaciones:
- Glaucoma primario o predisposición a glaucoma de ángulo estrecho (CIMA).
- Niños con síndrome de Down, parálisis espástica o lesión cerebral (CIMA).
- Atropina 1 % en menores de 3 años (CIMA).
- Menores de 12 años con reacción grave previa a atropina; lactancia (CIMA).
alertas:
- 'Riesgo de efectos adversos sistémicos graves en niños: usar la dosis eficaz más baja (CIMA).'
- 'Ancianos: más riesgo de glaucoma no diagnosticado y de reacciones psicóticas (CIMA).'
