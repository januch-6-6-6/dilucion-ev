    detalle: '6.3: 4 semanas después de la primera apertura'
administracion:
  texto: Agitar bien antes de usar. Tras instilar, cerrar suavemente los ojos u ocluir el conducto nasolagrimal para reducir
    la absorción sistémica. Espaciar al menos 5 minutos de otros colirios; las pomadas al final. No tocar el ojo con la punta
    del frasco.
  fuente:
    ref: CIMA-TOP-BRINZOLAMIDA-TIMOLOL-08482001
    detalle: 4.2 Forma de administración
contraindicaciones:
- Hipersensibilidad a otros betabloqueantes o a sulfonamidas (CIMA).
- Asma bronquial o antecedente de asma, EPOC grave (CIMA).
- Bradicardia sinusal, síndrome del seno enfermo, bloqueo sinoauricular o AV de 2.º–3.er grado sin marcapasos (CIMA).
- Insuficiencia cardiaca manifiesta o shock cardiogénico (CIMA).
- Rinitis alérgica grave, acidosis hiperclorémica, insuficiencia renal grave (CIMA).
alertas:
- Azarga es 10 mg/ml + 5 mg/ml; los registros chilenos no indican concentración en el nombre.
