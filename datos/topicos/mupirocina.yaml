- indicacion: Descolonización de Staphylococcus aureus nasal
  poblacion: pediatrico
  texto: Igual que en adultos; en lactantes, aplicar con una tórula
  vecesAlDia: 3
  porSitio: fosa
  estatus: autorizada
  fuente:
    ref: CIMA-TOP-MUPIROCINA-59531
