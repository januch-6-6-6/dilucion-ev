    ref: CIMA-TOP-PILOCARPINA-10955
    detalle: '6.3: desechar 4 semanas después de la primera apertura'
administracion:
  texto: Tras instilar, cerrar suavemente los ojos u ocluir el conducto nasolagrimal para reducir la absorción sistémica.
    Ocluir o cerrar 2 minutos. Espaciar al menos 5 minutos de otros colirios; las pomadas al final. No tocar el ojo con la
    punta del frasco.
  fuente:
    ref: CIMA-TOP-PILOCARPINA-10955
    detalle: 4.2 Forma de administración
contraindicaciones:
