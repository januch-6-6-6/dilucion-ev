dosis:
- indicacion: Rinitis alérgica estacional o perenne
  poblacion: adulto
  texto: 2 pulverizaciones en cada fosa 1 vez al día (200 mcg); mantención 1 por fosa; máximo 4 por fosa al día
  cantidad: 2
  unidad: pulverizacion
  vecesAlDia: 1
  porSitio: fosa
  estatus: autorizada
  condicion: Adultos y desde 12 años
  fuente:
    ref: CIMA-TOP-MOMETASONA-61905
    detalle: '4.2.1: adultos y niños de 12 años y mayores, dos pulverizaciones en cada orificio nasal una vez al día'
  tambien:
  - ref: PEDIAMECUM-TOP-MOMETASONA
    detalle: 'Adolescentes ≥12 años: dos aplicaciones (50 µg/dosis) en cada fosa nasal, una vez al día (200 µg/día)'
- indicacion: Poliposis nasal
  poblacion: adulto
  texto: 2 pulverizaciones en cada fosa 1 vez al día; si no hay control a las 5–6 semanas, 2 por fosa 2 veces al día
  cantidad: 2
  unidad: pulverizacion
  vecesAlDia: 1
  porSitio: fosa
  estatus: autorizada
  fuente:
    ref: CIMA-TOP-MOMETASONA-61905
    detalle: 4.2.1 Poliposis nasal
- indicacion: Rinitis alérgica
  poblacion: pediatrico
