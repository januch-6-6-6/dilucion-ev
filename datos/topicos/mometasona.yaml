administracion:
  texto: Cebar la bomba antes del primer uso. Dirigir hacia la pared lateral de la nariz, no hacia el tabique.
  fuente:
    ref: PEDIAMECUM-TOP-MOMETASONA
    detalle: Se debe administrar hacia el lateral de la cavidad nasal (no hacia el septo)
contraindicaciones:
- Infección localizada no tratada de la mucosa nasal (p. ej., herpes simple) (CIMA).
- Cirugía o traumatismo nasal reciente, hasta que cicatrice (CIMA).
