administracion:
  texto: Ocluir el conducto nasolagrimal al menos 2 minutos o cerrar suavemente los ojos. La midriasis completa tarda 30–60
    minutos. Espaciar al menos 5 minutos de otros colirios; las pomadas al final. No tocar el ojo con la punta del frasco.
  fuente:
    ref: CIMA-TOP-FENILEFRINA-34185
    detalle: 4.2 Forma de administración (válida para la vía, no para la dosis)
contraindicaciones:
- Ángulo estrecho anatómico o glaucoma de ángulo estrecho (CIMA, 10 %).
- Hipertensión grave; cardiopatía orgánica, aneurismas (CIMA, 10 %).
alertas:
- 'Sin pauta de adulto para 2,5 %: la ficha CIMA es de 10 % (cuatro veces más concentrada); su pauta y su contraindicación
  en menores de 12 años y ancianos son de esa concentración.'
- Los niños pueden ser especialmente sensibles a la fenilefrina (CIMA).
