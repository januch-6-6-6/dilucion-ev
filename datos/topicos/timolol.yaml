  motivo: Solo transitorio en glaucoma congénito o juvenil, con historia y examen previos; observar 1–2 h tras la primera
    dosis, sobre todo a neonatos (CIMA, Pediamécum).
conservacion:
- validezAbiertoDias: 28
  texto: 'Tras la primera apertura: un mes (la calculadora usa 28 días). Bajo 25 °C, protegido de la luz.'
  fuente:
