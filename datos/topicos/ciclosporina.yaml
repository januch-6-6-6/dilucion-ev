dosis:
- indicacion: Queratitis grave en ojo seco que no mejora con lágrimas artificiales
  poblacion: adulto
  texto: 1 gota en el ojo afectado 1 vez al día, al acostarse; reevaluar al menos cada 6 meses
  cantidad: 1
  unidad: gota
  vecesAlDia: 1
  porSitio: ojo
  estatus: autorizada
  condicion: La ficha es de una emulsión de 1 mg/ml (Ikervis); en Chile, 0,1 % es solución (Modusik-A)
  presentaciones:
  - ojo-solucion-0-1
  fuente:
    ref: CIMA-TOP-CICLOSPORINA-115990001
    detalle: '4.2: una gota una vez al día en el (los) ojo(s) afectados a la hora de acostarse'
- indicacion: Ojo seco (queratoconjuntivitis seca)
  poblacion: pediatrico
  texto: 1 gota en cada ojo cada 12 horas
  cantidad: 1
  unidad: gota
  vecesAlDia: 2
  porSitio: ojo
  estatus: off_label
  condicion: Adolescentes mayores de 16 años
  presentaciones:
  - ojo-emulsion-0-05
