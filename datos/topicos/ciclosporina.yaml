    detalle: 'Sequedad ocular en la queratoconjuntivitis seca en adolescentes >16 años: emulsión al 0,05%: 1 gota en cada
      ojo/12 horas'
sinPauta: null
pediatria:
  estado: con_dosis
  motivo: 'Ficha técnica (Ikervis): no apropiada en menores de 18 años. Pediamécum da pauta para mayores de 16 años con la
    emulsión 0,05 %.'
  edadMinima: 16 años (Pediamécum)
conservacion:
- texto: 'Unidosis (Ikervis): desechar inmediatamente después de usar; no congelar; bajo 25 °C.'
  fuente:
    ref: CIMA-TOP-CICLOSPORINA-115990001
    detalle: 6.4 Precauciones especiales de conservación
administracion:
  texto: Lavarse las manos; agitar suavemente el unidosis. Ocluir y cerrar los párpados 2 minutos. Separar al menos 15 minutos
    de otros colirios y aplicarla al final. Tratamiento iniciado por oftalmólogo.
  fuente:
    ref: CIMA-TOP-CICLOSPORINA-115990001
    detalle: 4.2 Forma de administración
contraindicaciones:
- Neoplasias oculares o perioculares, o afecciones preneoplásicas (CIMA).
- Infección ocular o periocular activa o sospechada (CIMA).
