sinPauta: null
pediatria:
  estado: contraindicada
  motivo: Contraindicada en menores de 2 años; no recomendada de 2 a 17 años (CIMA).
conservacion:
- validezAbiertoDias: 28
  texto: Usar dentro de 28 días tras abrir. Mantener en la caja (luz).
  fuente:
    ref: CIMA-TOP-BRIMONIDINA-TIMOLOL-67438
    detalle: '6.3: después de la primera apertura, usar en el transcurso de 28 días'
administracion:
  texto: Presionar el saco lagrimal o cerrar los ojos 2 minutos inmediatamente después de cada gota. Espaciar al menos 5 minutos
    de otros colirios; las pomadas al final. No tocar el ojo con la punta del frasco.
  fuente:
    ref: CIMA-TOP-BRIMONIDINA-TIMOLOL-67438
    detalle: 4.2.2 Forma de administración
contraindicaciones:
- Asma bronquial o antecedente de asma, EPOC grave (CIMA).
- Bradicardia sinusal, síndrome del seno enfermo, bloqueo sinoauricular o AV de 2.º–3.er grado sin marcapasos (CIMA).
- Insuficiencia cardiaca manifiesta o shock cardiogénico (CIMA).
- Neonatos y niños menores de 2 años (CIMA).
- En tratamiento con IMAO o con antidepresivos que afectan la transmisión noradrenérgica (tricíclicos, mianserina) (CIMA).
alertas:
