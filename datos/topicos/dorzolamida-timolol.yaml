conservacion:
- validezAbiertoDias: 28
  texto: Usar dentro de 28 días tras abrir. Proteger de la luz.
  fuente:
    ref: CIMA-TOP-DORZOLAMIDA-TIMOLOL-62535
    detalle: '6.3: una vez abierto, no superior a 28 días'
administracion:
  texto: Cerrar el ojo y oprimir el ángulo interno unos 2 minutos. Separar al menos 10 minutos de otros colirios.
  fuente:
    ref: CIMA-TOP-DORZOLAMIDA-TIMOLOL-62535
    detalle: 4.2.1 Método de administración
contraindicaciones:
- Asma bronquial o antecedente de asma, EPOC grave (CIMA).
- Bradicardia sinusal, síndrome del seno enfermo, bloqueo sinoauricular o AV de 2.º–3.er grado sin marcapasos (CIMA).
- Insuficiencia cardiaca manifiesta o shock cardiogénico (CIMA).
- Insuficiencia renal grave (ClCr <30 ml/min) o acidosis hiperclorémica (CIMA).
alertas:
