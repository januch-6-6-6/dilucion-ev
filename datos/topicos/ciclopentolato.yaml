pediatria:
  estado: con_dosis
  motivo: No recomendado en recién nacidos ni lactantes por riesgo sistémico grave (CIMA). Observar al niño 30 minutos.
conservacion:
- validezAbiertoDias: 28
  texto: Desechar 4 semanas después de abrir. No conservar sobre 25 °C.
  fuente:
    ref: CIMA-TOP-CICLOPENTOLATO-42117
    detalle: '6.3: desechar 4 semanas después de la primera apertura'
administracion:
  texto: Ocluir el conducto nasolagrimal al menos 2 minutos (sobre todo en niños). En neonatos y lactantes, no darles alimento
