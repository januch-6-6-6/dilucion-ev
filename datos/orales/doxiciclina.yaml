alertas:
- Esta ficha carga solo el uso oftalmológico del fármaco; no carga sus otras indicaciones. El uso en blefaritis y disfunción
  de glándulas de Meibomio no está en la ficha técnica.
- Contraindicada en el embarazo y en la lactancia; no se usa en menores de 8 años por riesgo de decoloración permanente de
  los dientes (CIMA 4.3 y 4.4; AAO PPP).
- Una revisión Cochrane concluye que no hay evidencia suficiente para sacar conclusiones sobre los antibióticos orales en
  la blefaritis crónica y que la doxiciclina puede dar más efectos adversos serios (Cochrane 2021).
- Los estudios con dosis subantimicrobianas usaron 40 mg al día o 20 mg dos veces al día (Cochrane 2021; IOVS 2011); esa presentación
  no está cargada aquí.
- La guía AAO la da una vez al día y la baja cuando hay mejoría; existe una presentación de liberación sostenida que reduce
  los efectos adversos (AAO PPP 2024).
- Fotosensibilidad, molestias digestivas, y rara vez seudotumor cerebral o síndrome de Stevens-Johnson; baja el efecto de
  anticonceptivos orales y potencia a la warfarina (AAO PPP 2024).
