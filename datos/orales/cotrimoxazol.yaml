alertas:
- Todas las cifras de esta ficha (dosis y presentaciones) están en mg de TRIMETOPRIMA; el sulfametoxazol es 5 veces más (1:5).
- 'Notación invertida entre fuentes: Pediamécum escribe primero el sulfametoxazol (p. ej. 800/160 mg) y la ficha técnica primero
  la trimetoprima (160/800 mg). Confirmar a qué componente se refiere cada cifra.'
- La pauta por peso no trae tope pediátrico en la fuente; como referencia, la dosis de adulto es 160 mg de trimetoprima cada
  12 h (CIMA). En profilaxis de Pneumocystis y de toxoplasmosis la ficha limita a 320 mg de trimetoprima/1600 mg de sulfametoxazol
  al día.
- Contraindicado en prematuros y niños a término menores de 6 semanas, porfiria aguda y con dofetilida (CIMA, 4.3).
- 'CIMA 4.4: "Existen algunos datos procedentes de estudios que pueden sugerir que Septrin no debería administrarse a niños
  menores de 3 meses".'
- Reacciones cutáneas graves (Stevens-Johnson, NET), discrasias sanguíneas y necrosis hepática descritas; hemograma mensual
  en tratamientos prolongados (CIMA, 4.4).
- Neumonía por Pneumocystis, toxoplasmosis, nocardiosis, brucelosis y melioidosis tienen pautas propias (CIMA, 4.2); no se
  cargan.
- 'No se usa la ficha de Balsoprim: lleva bromhexina, no es cotrimoxazol solo.'
