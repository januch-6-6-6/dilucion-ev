alertas:
- Esta ficha carga solo el uso oftalmológico del fármaco; no carga sus otras indicaciones. No carga malaria ni la toxoplasmosis
  congénita.
- 'Se usa siempre en combinación con un medicamento sinérgico: sulfadiazina o clindamicina (CIMA 4.2).'
- Deprime la médula ósea en el 25 a 50 % de los pacientes con dosis terapéuticas; el folinato de calcio (ácido folínico) reduce
  el riesgo, y el hemograma se hace semanal durante el tratamiento y 2 semanas después (CIMA 4.4).
- Evitar en el primer trimestre del embarazo; no se recomienda en la lactancia (CDC; CIMA 4.6).
- Con antecedentes de convulsiones evitar dosis de carga altas (CIMA 4.4).
- Una lesión ya cicatrizada no se trata (CDC).
