alertas:
- 'La claritromicina en comprimidos no ha sido estudiada en menores de 12 años (CIMA 67638): en niños usar la suspensión.
  Experiencia limitada en menores de 6 meses (CIMA 66388).'
- Contraindicada con astemizol, cisaprida, domperidona, pimozida, terfenadina, ticagrelor, ivabradina, ranolazina, ergotamínicos,
  midazolam oral, lovastatina o simvastatina y lomitapida, y con QT largo o hipopotasemia/hipomagnesemia; no debe usarse en
  pacientes que estén tomando colchicina (CIMA, 4.3).
- 'La ficha de la suspensión trae una tabla orientativa en ml por peso (25 mg/ml); no se carga: la dosis se calcula por kg.'
- 'Erradicación de H. pylori (adultos): 500 mg dos veces al día en terapia combinada (CIMA). Profilaxis de endocarditis: 15
  mg/kg en dosis única (Pediamécum, off-label). No se cargan.'
- 'Dos concentraciones de suspensión (25 y 50 mg/ml): confirmar la del frasco.'
