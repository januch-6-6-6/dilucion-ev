ajusteRenalHepatico:
  renal: 'Herpes simple con aclaramiento de creatinina <10 ml/min: 200 mg dos veces al día (cada 12 h). Varicela y zóster:
    10-25 ml/min, 800 mg tres veces al día (cada 8 h); <10 ml/min, 800 mg dos veces al día (cada 12 h).'
  fuente:
