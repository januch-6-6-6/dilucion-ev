alertas:
- 'Pediamécum: en pacientes inmunodeprimidos o con malabsorción, la dosis oral debe duplicarse respecto de la de inmunocompetentes.'
- No hay datos de herpes zóster en niños inmunocompetentes (CIMA 84468). La infección neonatal por herpes simple y la encefalitis
  se tratan por vía intravenosa.
- Mantener una hidratación adecuada, sobre todo con dosis altas, en ancianos y en insuficiencia renal (riesgo de reacciones
  neurológicas) (CIMA, 4.4).
- 'Inmunocomprometidos (Pediamécum, ≥2 años): 1000 mg/día en 3-5 dosis, máximo 80 mg/kg/día sin exceder 1 g/día; no se carga.'
- 'Suspensión: no diluir (CIMA 59226).'
