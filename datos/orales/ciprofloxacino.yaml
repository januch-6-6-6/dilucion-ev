alertas:
- 'Fluoroquinolona: riesgo de tendinitis y rotura de tendón, neuropatía, aneurisma y disección aórtica y regurgitación valvular;
  evitar si hubo reacciones graves previas a quinolonas (CIMA, 4.4).'
- No tomar con lácteos (leche, yogur) ni zumos enriquecidos en calcio (CIMA, 4.2.2).
- 'En niños solo indicaciones restringidas (ITU complicada, fibrosis quística, carbunco) y por médicos con experiencia; el
  resto de usos pediátricos es off-label (Pediamécum: otras infecciones 20-30 mg/kg/día en 2 dosis, máximo 1,5 g/día; no se
  cargan).'
- Contraindicado con tizanidina (CIMA, 4.3).
