discrepancias:
- campo: Dosis de adultos y >12 años (síndrome del colon irritable)
  valores:
  - fuente: PEDIAMECUM-TRIMEBUTINO
    valor: 300-400 mg/día de inicio y luego 200 mg/día (Pediamécum)
  - fuente: PEDIAMECUM-TRIMEBUTINO
    valor: 200 mg cada 8 h, es decir 600 mg/día, en la frase siguiente de la misma ficha (Pediamécum)
  mostrado: No se carga dosis de adulto
  motivo: Inconsistencia interna de la única fuente disponible; sin ficha técnica ni fuente chilena que la resuelva.
