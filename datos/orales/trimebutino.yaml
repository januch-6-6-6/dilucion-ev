ajusteRenalHepatico: null
alertas:
- 'Fuente única: solo Pediamécum; CIMA registra Polibutin pero sin ficha técnica descargable.'
- 'Sin dosis de adulto: Pediamécum da para >12 años 300-400 mg/día (bajando a 200 mg/día) y, a la vez, 200 mg cada 8 h; no
  se muestra hasta contrastar con otra fuente. El comprimido de 100 mg del arsenal queda sin pauta cargada.'
- Riesgo de aumento rápido de la temperatura corporal en niños en lugares muy cálidos; dosis elevadas pueden causar hiperexcitabilidad
  (Pediamécum).
