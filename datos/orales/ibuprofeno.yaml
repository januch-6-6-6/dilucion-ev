alertas:
- Ibuprofeno a dosis altas (2400 mg/día) se asocia a un pequeño aumento del riesgo de acontecimientos trombóticos arteriales;
  con ≤1200 mg/día no se ha visto ese aumento (CIMA 88314, 4.4).
- Contraindicado en insuficiencia renal o hepática grave, insuficiencia cardíaca grave (NYHA IV), hemorragia activa y tercer
  trimestre de embarazo (CIMA 88314, 4.3).
- Se aconseja evitar ibuprofeno en caso de varicela (CIMA 88314, 4.4).
- 'Los comprimidos y sobres de 400 mg no son para <40 kg ni <12 años (CIMA 88314 y 74559): en niños usar la suspensión, o
  el comprimido de 200 mg si la dosis lo permite, y calcular por peso.'
