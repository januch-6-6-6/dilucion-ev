alertas:
- 'Otitis media aguda: alternativa de dosis única de 30 mg/kg (máximo total 1500 mg); faringoamigdalitis: alternativa de 12
  mg/kg/día durante 5 días (CIMA 65601). No se cargan como pautas aparte.'
- Los sobres no sirven para niños de menos de 16 kg; en ellos usar la suspensión en frasco (CIMA 65601).
- No establecida en menores de 6 meses (CIMA 65601).
- 'Uretritis/cervicitis por Chlamydia y chancroide: 1000 mg en dosis única (adultos, CIMA). No se carga.'
- 'Riesgo de prolongación del QT y torsade de pointes: precaución con QT largo, alteraciones electrolíticas, bradicardia y
  otros fármacos que prolongan el QT (CIMA, 4.4).'
