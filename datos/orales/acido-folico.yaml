discrepancias:
- campo: Dosis en estados carenciales (adultos vs niños)
  valores:
  - fuente: CIMA-ACIDO-FOLICO
    valor: 'Adultos: 5-15 mg/día (comprimidos de 5 mg)'
  - fuente: PEDIAMECUM-ACIDO-FOLICO
