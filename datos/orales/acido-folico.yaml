ajusteRenalHepatico: null
alertas:
- 'No usar la presentación de 5 mg para dosis pediátricas: utilizar el comprimido de 1 mg del arsenal chileno de APS.'
- El ácido fólico puede enmascarar una anemia perniciosa por déficit de vitamina B12 (el daño neurológico puede progresar).
