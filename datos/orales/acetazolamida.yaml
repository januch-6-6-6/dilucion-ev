  comida: ayunas
  texto: Preferentemente en ayunas; si hay náuseas o vómitos se puede dar con leche o alimentos para mejorar la tolerancia
    digestiva.
  fuente:
    ref: CIMA-OFT-ACETAZOLAMIDA-24408
    detalle: '4.2 Forma de administración: "preferentemente en ayunas, aunque si aparecen náuseas o vómitos se puede administrar
      con leche o alimentos"'
ajusteRenalHepatico:
  renal: 'Se excreta por vía renal: con aclaramiento de creatinina < 60 ml/min puede ser necesario bajar la dosis; en insuficiencia
    renal moderada a severa, reducir la dosis a la mitad o pasar a una toma cada 12 horas (CIMA 4.2).'
  hepatico: Contraindicada en insuficiencia hepática grave; puede aumentar la hiperamonemia en pacientes con insuficiencia
    hepática (CIMA 4.3 y 4.4).
  fuente:
    ref: CIMA-OFT-ACETAZOLAMIDA-24408
    detalle: 4.2 Insuficiencia renal; 4.3 y 4.4 Insuficiencia hepática
alertas:
- Esta ficha carga solo el uso oftalmológico del fármaco; no carga sus otras indicaciones. No carga diurético, epilepsia ni
  mal de altura.
- 'Es una sulfonamida: las reacciones de hipersensibilidad pueden repetirse con cualquier derivado de sulfamidas (CIMA 4.4).'
- 'El uso prolongado está contraindicado en el glaucoma crónico de ángulo cerrado no congestivo: puede producirse cierre orgánico
  del ángulo (CIMA 4.3).'
- Contraindicada en insuficiencia hepática grave (CIMA 4.3).
- Más de 1 g al día no baja más la presión intraocular (CIMA; Deitz 2023).
- 'En niños los efectos adversos son frecuentes (más del 40 %: letargia, falta de apetito, acidosis metabólica; EyeWiki).'
