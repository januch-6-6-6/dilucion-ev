alertas:
- 'Neonatos a término: la misma dosis por kg cada 72 h (0-14 días) o cada 48 h (15-27 días), sin superar 12 mg/kg cada 72
  h o cada 48 h respectivamente (CIMA). No se cargan dosis neonatales.'
- 'Adolescentes de 12 a 17 años: según peso y desarrollo puberal, dosis de adulto o de niño; 100, 200 y 400 mg en adultos
  equivalen a 3, 6 y 12 mg/kg en niños (CIMA).'
- 'Dos concentraciones de suspensión (10 y 40 mg/ml): confirmar la del frasco.'
- Contraindicado con fármacos que prolongan el QT y se metabolizan por CYP3A4 (p. ej. cisaprida) y con terfenadina si se dan
  ≥400 mg/día (CIMA, 4.3).
- No usar para Tinea capitis (CIMA, 4.4).
- Candidiasis invasiva y meningitis criptocócica del adulto (carga 400-800 mg, luego 200-400 mg/día) tienen pautas propias;
  no se cargan.
