  renal: 'Insuficiencia renal leve: 25 mg al día; moderada: 25 mg en días alternos, siempre con potasio <5,0 mmol/l. Contraindicada
    en insuficiencia renal moderada a grave según 4.3. Ancianos: 25 mg al día o en días alternos.'
  fuente:
