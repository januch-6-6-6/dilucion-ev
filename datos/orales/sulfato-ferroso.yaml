administracion:
  comida: antes
  texto: Administrar con agua o zumo de cítricos (la vitamina C favorece la absorción), en ayunas, 1 hora antes o 3 horas
    después de las comidas. NUNCA administrar con leche, productos lácteos, té o café. Los comprimidos de liberación prolongada
    deben tragarse enteros sin masticar ni chupar.
  noTriturar: true
