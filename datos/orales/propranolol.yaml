administracion:
  comida: con_comida
  texto: 'Vía oral (CIMA 77174). Pediamécum: con comida; los comprimidos se tragan enteros con líquido, sin masticar. Hemangiol:
    con la jeringa oral del envase, durante o justo después de la alimentación del niño para evitar hipoglucemia; puede mezclarse
    con un poco de leche infantil o zumo (CIMA 114919001).'
  noTriturar: true
  fuente:
    ref: PEDIAMECUM-PROPRANOLOL
    detalle: 'Administración: "Por vía oral, debe administrarse con comida"; arritmias: "deben tragarse enteros con líquido
      y no deben masticar"'
ajusteRenalHepatico:
  renal: 'Insuficiencia renal significativa o hemodiálisis: precaución al iniciar y al elegir la dosis inicial.'
  hepatico: 'Hepatopatía grave (p. ej., cirrosis): dosis inicial baja, sin superar 20 mg tres veces al día, vigilando la respuesta.'
  fuente:
    ref: CIMA-PROPRANOLOL-77174
    detalle: 4.2 Insuficiencia hepática / renal
alertas:
- Hemangiol y la pauta de hipertensión infantil no traen tope en mg (solo mg/kg); como referencia, en adultos la hipertensión
  usa 160-320 mg/día (CIMA 77174). La ficha no declara un máximo diario de adulto que la calculadora pueda aplicar.
- 'No existe una pauta pediátrica única: la dosis depende de la indicación (arritmias, migraña, hemangioma, hipertensión).'
- 'Contraindicado en asma o broncoespasmo, bloqueo AV de 2.º-3.er grado, bradicardia intensa, hipotensión grave, shock cardiogénico
  y en pacientes propensos a hipoglucemia (CIMA 77174 y 114919001, 4.3). Hemangiol: no en lactantes <5 semanas.'
- 'No suspender bruscamente: reducir la dosis en 7-14 días (CIMA 77174).'
