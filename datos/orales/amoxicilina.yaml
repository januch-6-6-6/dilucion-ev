ajusteRenalHepatico:
  renal: 'Filtrado >30 ml/min: sin ajuste. 10-30 ml/min: adultos y niños ≥40 kg, máximo 500 mg dos veces al día; niños <40
    kg, 15 mg/kg dos veces al día (máximo 500 mg dos veces al día). <10 ml/min: adultos, máximo 500 mg/día; niños <40 kg,
    15 mg/kg en dosis única diaria (máximo 500 mg). Hemodiálisis (fila «Adultos y niños ≥40 kg» de la ficha): 15 mg/kg/día
    en dosis única, con una dosis adicional de 15 mg/kg antes y otra tras la sesión. Diálisis peritoneal: máximo 500 mg/día.'
  hepatico: Dosificar con precaución y monitorizar la función hepática a intervalos regulares.
  fuente:
    ref: CIMA-AMOXICILINA-62880
    detalle: 4.2 Insuficiencia renal (tabla por filtrado glomerular), hemodiálisis, diálisis peritoneal e insuficiencia hepática
alertas:
- Las pautas de 25-50 y 80-90 mg/kg/día no traen tope en mg en las fuentes. Pediamécum fija un máximo de 150 mg/kg/día (40
  mg/kg/día en menores de 2 meses, cada 12 h) y, para niños de más de 40 kg, una dosis oral máxima de 6 g/día. Como referencia,
  la dosis de adulto de CIMA es de 250-500 mg cada 8 h o de 750 mg a 1 g cada 12 h (hasta 1 g cada 8 h en infecciones graves).
- 'Cistitis aguda del adulto: 3 g dos veces al día durante un día; profilaxis de endocarditis: 2 g en dosis única (niños 50
  mg/kg) 30-60 minutos antes del procedimiento (CIMA 62880). No se cargan como pautas aparte.'
- 'Enfermedad de Lyme y fiebre tifoidea tienen pautas propias (CIMA: hasta 4 g/día en etapa temprana y 6 g/día en la tardía
  en adultos; niños 100 mg/kg/día en tres dosis en fiebre tifoidea); no se cargan.'
- 'Dos concentraciones de suspensión (50 y 100 mg/ml): confirmar la del frasco antes de calcular el volumen.'
- Evitar en sospecha de mononucleosis infecciosa (erupción morbiliforme) (CIMA, 4.4).
