alertas:
- 'La dosis de 500 mg no se puede dar con los comprimidos cargados (850 mg sin ranura declarada; 1000 mg de liberación prolongada):
  haría falta un comprimido de 500 mg.'
- 'El comprimido de liberación prolongada de 1000 mg del arsenal no tiene posología en ninguna fuente cargada: las pautas
  de 1 a 3 tomas son de la ficha de comprimidos de liberación inmediata y no se vinculan a él.'
- Contraindicada con TFG <30 ml/min, acidosis metabólica aguda, precoma diabético, situaciones agudas que alteren la función
