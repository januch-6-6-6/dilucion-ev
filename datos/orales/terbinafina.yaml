ajusteRenalHepatico:
  renal: No se recomienda en insuficiencia renal (no estudiada suficientemente); contraindicada en insuficiencia renal grave.
  hepatico: Contraindicada en insuficiencia hepática crónica o activa.
  fuente:
    ref: CIMA-TERBINAFINA
    detalle: 4.2 Uso en pacientes con insuficiencia hepática / renal; 4.3
alertas:
- 'Dosis pediátricas de 62,5, 125 y 187,5 mg: con el comprimido de 250 mg harían falta un cuarto, medio y tres cuartos de
  comprimido; ninguna ficha cargada dice que el comprimido se pueda partir y en España no hay forma líquida ni granulada (Pediamécum).'
- 'Hepatotoxicidad: pruebas de función hepática antes de empezar y controles periódicos (tras 4-6 semanas); suspender ante
  náuseas persistentes, anorexia, fatiga, vómitos, dolor en hipocondrio derecho, ictericia, orina oscura o heces claras (CIMA,
  4.4).'
- No es eficaz en pitiriasis versicolor ni en candidiasis cutánea (CIMA, 4.1).
