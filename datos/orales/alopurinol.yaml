administracion:
  comida: despues
  texto: Una vez al día después de las comidas; se tolera mejor tras la ingesta. Si la dosis supera 300 mg y hay intolerancia
    digestiva, repartir en varias tomas.
  fuente:
    ref: CIMA-ALOPURINOL
    detalle: 4.2 Frecuencia de la dosificación
ajusteRenalHepatico:
  renal: 'Iniciar con un máximo de 100 mg/día y aumentar solo si la respuesta no es satisfactoria. Insuficiencia renal grave:
    menos de 100 mg/día o 100 mg a intervalos mayores de un día. Diálisis 2-3 veces por semana: 300-400 mg inmediatamente
    después de cada sesión.'
  hepatico: En pacientes con alteración hepática se debe reducir la dosis; pruebas periódicas de función hepática al inicio
    del tratamiento.
  fuente:
    ref: CIMA-ALOPURINOL
    detalle: 4.2 Dosis recomendada en casos de insuficiencia renal / diálisis renal / insuficiencia hepática
alertas:
- 'Riesgo de error de unidad: las fuentes pediátricas dosifican en mg/m², mg/kg/día y mg fijos (Pediamécum).'
- Iniciar a dosis bajas para reducir el riesgo de reacciones adversas (CIMA, 4.2).
- Pediamécum describe además pautas por superficie corporal (50-100 mg/m²/dosis cada 8 h); no se cargan.
