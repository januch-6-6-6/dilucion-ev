administracion:
  comida: indiferente
  texto: 'Vía oral. Comprimidos con un vaso de líquido, preferentemente agua. Solución con la jeringa oral del envase (ficha
    de Antidol infantil). Pediamécum: las comidas ricas en carbohidratos pueden disminuir su absorción.'
  fuente:
    ref: CIMA-PARACETAMOL-85780
    detalle: '4.2 Forma de administración: comprimidos con un vaso de líquido, preferentemente agua'
ajusteRenalHepatico:
  renal: 'Antidol 1 g (CIMA): filtración glomerular 10-50 ml/min, 500 mg cada 6 h; <10 ml/min, 500 mg cada 8 h; la ficha añade
    «Debido a la dosis, este medicamento no está indicado para este grupo de pacientes» (comprimido de 1 g). Antidol infantil
    (CIMA): insuficiencia renal grave (aclaramiento de creatinina <10 ml/min), intervalo entre tomas de al menos 8 h.'
  hepatico: 'Antidol 1 g (CIMA): no se excederá de 2 g/24 horas y el intervalo mínimo entre dosis será de 8 horas. Antidol
    infantil (CIMA): reducir la dosis e incrementar el intervalo entre tomas. Ancianos (Antidol 1 g): reducir la dosis del
    adulto en un 25 %.'
  fuente:
    ref: CIMA-PARACETAMOL-85780
    detalle: '4.2 Pacientes con insuficiencia renal / hepática / uso en ancianos (la pauta pediátrica: ficha 83208)'
alertas:
- Máximo 60 mg/kg/día en niños (4 tomas de 15 mg/kg); no exceder aunque se sumen otros medicamentos con paracetamol (CIMA
  83208).
- Antidol infantil está indicado en niños de 3 a 32 kg; en menores de 2 años la dosis la establece el médico.
- 'Antidol 1 g: dosis <1 g por toma requieren otra presentación; no usar con otros medicamentos con paracetamol (máx. 3 g/día
  en total según CIMA).'
- Hepatotoxicidad descrita con dosis diarias <4 g en adultos; en alcohólicos crónicos no más de 2 g/día (CIMA).
