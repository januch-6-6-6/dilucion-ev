administracion:
  comida: indiferente
  texto: 'Vía oral. Comprimidos con un vaso de líquido, preferentemente agua. Solución con la jeringa oral del envase. Pediamécum:
    las comidas ricas en carbohidratos pueden disminuir su absorción.'
  fuente:
