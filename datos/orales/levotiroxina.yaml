administracion:
  comida: ayunas
  texto: 'Dosis única por la mañana en ayunas, media hora antes del desayuno, con un poco de líquido; en niños, disolver el
    comprimido en un poco de agua en el momento (CIMA). Guía MINSAL: en ayunas o 4 h después de comer, lejos de inhibidores
    de la bomba de protones y de suplementos de calcio o fierro.'
  fuente:
    ref: CIMA-LEVOTIROXINA
    detalle: 4.2.2 Forma de administración
ajusteRenalHepatico: null
alertas:
- 'Dosificar en microgramos (µg): 1 mg = 1000 µg. Las presentaciones cargadas son de 25, 50 y 100 µg.'
- 'Ninguna fuente declara partibles los comprimidos de 25, 50 o 100 µg: la dosis de 12,5 µg necesita confirmar la ranura del
  producto.'
- Iniciar con dosis bajas en ancianos, coronarios e hipotiroidismo grave o de larga evolución (CIMA). No iniciar en infarto
  agudo, miocarditis o pancarditis agudas; contraindicada en insuficiencia adrenal o hipofisaria y tirotoxicosis no tratadas
  (CIMA, 4.3).
- La sobredosificación puede disminuir la densidad mineral ósea y causar arritmias como fibrilación auricular (guía MINSAL).
