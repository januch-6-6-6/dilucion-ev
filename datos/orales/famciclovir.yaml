ajusteRenalHepatico:
  renal: Hay que ajustar la dosis según el aclaramiento de creatinina; en hemodiálisis dar la dosis justo después de la diálisis
    (CIMA 4.2, Tabla 1).
  hepatico: No hace falta ajustar en insuficiencia hepática leve o moderada; no hay datos en insuficiencia grave (CIMA 4.2).
  fuente:
    ref: CIMA-OFT-FAMCICLOVIR-60609
    detalle: 4.2 Pacientes con insuficiencia renal / hepática
alertas:
- Esta ficha carga solo el uso oftalmológico del fármaco; no carga sus otras indicaciones.
- 'No registrado en Chile: solo por importación o uso compasivo.'
- La guía MEEI/Harvard lo prefiere en mayores de 65 años (con o sin función renal reducida), porque aciclovir y valaciclovir
  dan más reacciones del sistema nervioso central en ancianos.
- Para la profilaxis la guía lo propone como alternativa extrapolada de los estudios de herpes genital; solo aciclovir y valaciclovir
  tienen estudio ocular que demuestre menos recurrencias (HEDS).
