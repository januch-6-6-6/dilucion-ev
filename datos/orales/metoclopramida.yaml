    detalle: 4.2 Forma de administración
ajusteRenalHepatico:
  renal: 'Enfermedad renal terminal (aclaramiento ≤15 ml/min): reducir la dosis diaria un 75 %; insuficiencia renal moderada
    a grave (15-60 ml/min): reducir un 50 %. Ancianos: considerar reducir la dosis.'
  hepatico: 'Insuficiencia hepática grave: reducir la dosis un 50 %.'
  fuente:
    ref: CIMA-METOCLOPRAMIDA-75665
    detalle: 4.2 Poblaciones especiales
alertas:
- 'Fuente de dosis única en la práctica: solo las fichas CIMA dan pauta oral; Pediamécum describe la vía intravenosa.'
- La pauta por kg no trae tope pediátrico en mg (solo 0,5 mg/kg/24 h); como referencia, el adulto tiene un máximo de 30 mg/día
  (CIMA) y la calculadora limita a ese tope.
- 'Los comprimidos no son adecuados para niños de menos de 30 kg y no permiten 2,5 o 5 mg (10 mg, sin ranura): en niños usar
  la solución (CIMA 75665).'
- Contraindicada en menores de 1 año (trastornos extrapiramidales), epilepsia, Parkinson, discinesia tardía previa, feocromocitoma,
  hemorragia, obstrucción o perforación digestiva y con levodopa (CIMA, 4.3).
