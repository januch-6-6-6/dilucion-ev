  motivo: 'Discrepancia de población: la ficha no establece su uso en <18 años.'
administracion:
  comida: indiferente
  texto: Con suficiente líquido. No es necesario tomarlo con comida, salvo en insuficiencia cardíaca congestiva, en la que
    debe tomarse con alimentos para reducir los efectos ortostáticos (CIMA).
  fuente:
    ref: CIMA-CARVEDILOL
    detalle: 4.2.2 Forma de administración
ajusteRenalHepatico:
  renal: No hay evidencia de que haga falta ajustar la dosis; vigilar la función renal con insuficiencia cardíaca y presión
    arterial baja.
  hepatico: Contraindicado en disfunción hepática clínicamente manifiesta.
  fuente:
    ref: CIMA-CARVEDILOL
    detalle: 4.2.1 Insuficiencia renal / Disfunción hepática
alertas:
- Contraindicado en disfunción hepática clínicamente manifiesta, asma bronquial, EPOC con broncoespasmo, insuficiencia cardíaca
  NYHA IV descompensada, bloqueo AV de 2.º-3.er grado, bradicardia grave (<50 lpm), shock cardiogénico e hipotensión grave
  (CIMA, 4.3).
- No suspender bruscamente; si se interrumpe más de una semana, reiniciar con 3,125 mg dos veces al día (CIMA).
