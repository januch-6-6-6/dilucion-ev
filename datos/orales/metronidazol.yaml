ajusteRenalHepatico:
  renal: 'Datos limitados; no indican necesidad de reducir la dosis. Hemodiálisis: programar la dosis después de la sesión
    en los días de diálisis. Diálisis peritoneal: sin ajuste.'
  hepatico: 'Insuficiencia hepática grave: reducir la dosis diaria total a una tercera parte y darla en una dosis única diaria.'
  fuente:
