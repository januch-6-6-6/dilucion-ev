    detalle: 4.2 Uso en pacientes con insuficiencia hepática / renal
alertas:
- 'La pauta de anaerobios en niños (7,5 mg/kg cada 8 h) no trae tope en la ficha; como referencia, la dosis de adulto es de
  250-500 mg cada 8 h (CIMA 62223; Flagyl: 500 mg cada 8 h).'
- 'Giardiasis, pautas de la ficha en dosis única diaria durante 3 días: 1-3 años 500 mg, 3-7 años 600-800 mg (Flagyl) o 750
  mg (Normon), 7-10 años 1000 mg, >10 años 2000 mg. Superan el máximo de 500 mg/día de la pauta de Pediamécum y no se cargan.'
- 'Tricomoniasis (adultos y niños >10 años: 2000 mg dosis única o 250 mg tres veces al día 7 días; <10 años: 40 mg/kg dosis
  única, máx. 2000 mg), vaginosis bacteriana, amebiasis del adulto (750 mg tres veces al día) y H. pylori tienen pautas propias
  (CIMA); no se cargan.'
- Evitar alcohol durante el tratamiento (efecto antabús). Contraindicado en el primer trimestre del embarazo (CIMA 62223,
  4.3).
- No superar 10 días de tratamiento salvo casos concretos con control clínico y analítico; vigilar neuropatía (CIMA 62223,
  4.4).
- 'Hepatotoxicidad grave en el síndrome de Cockayne: no usar salvo que no haya alternativa (CIMA, 4.4).'
- 'Flagyl suspensión contiene benzoato de metronidazol: 200 mg de benzoato equivalen a 125 mg de metronidazol base por 5 ml;
  las dosis se expresan en base (Pediamécum).'
