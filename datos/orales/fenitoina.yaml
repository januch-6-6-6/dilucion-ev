  estatus: autorizada
  condicion: 1000 mg divididos en 3 tomas (400 mg, 300 mg, 300 mg) a intervalos de 2 horas con monitorización clínica
  texto: 1000 mg divididos en 3 tomas (400 + 300 + 300 mg) cada 2 horas
  fuente:
