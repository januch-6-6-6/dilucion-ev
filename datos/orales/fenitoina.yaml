  min: 5
  max: 5
  tomasPorDia: 2
  intervaloH: 12
  topeDiario:
    valor: 300
    unidad: mg
  estatus: autorizada
  condicion: Dosis inicial 5 mg/kg/día en 2 o 3 tomas. Mantenimiento habitual 4-8 mg/kg/día hasta un máximo de 300 mg al día.
    Pediamécum señala que en niños mayores se puede usar 8-10 mg/kg/día
  texto: Inicio 5 mg/kg/día en 2-3 tomas; mantenimiento 4-8 mg/kg/día (máximo 300 mg/día)
  fuente:
    ref: PEDIAMECUM-FENITOINA
    detalle: '4.2 Población pediátrica y Pediamécum: dosis inicial recomendada 5 mg/kg/día en 2 o 3 tomas; mantenimiento 4-8
      mg/kg/día; máximo 300 mg/día'
pediatria:
  estado: con_dosis
discrepancias:
- campo: Dosis pediátrica de mantenimiento en niños mayores
  valores:
  - fuente: CIMA-FENITOINA
    valor: Mantenimiento 4-8 mg/kg/día, máximo 300 mg/día
  - fuente: PEDIAMECUM-FENITOINA
    valor: En niños más mayores se recomienda 8-10 mg/kg/día (máximo 300 mg/día)
  mostrado: 4-8 mg/kg/día
  motivo: Pediamécum amplía el mantenimiento en niños mayores hasta 8-10 mg/kg/día, lo que a pesos intermedios puede saturar
    la cinética no lineal de Michaelis-Menten. Se conserva la recomendación de 4-8 mg/kg/día con tope de 300 mg/día.
administracion:
  comida: antes
  texto: Tomar con al menos medio vaso de agua. Administrar preferentemente antes de las comidas; si produce molestias gastrointestinales
    se puede tomar durante o después de las comidas.
  fuente:
    ref: CIMA-FENITOINA
    detalle: '4.2 Forma de administración: "tomarse por lo menos medio vaso de agua ... antes de las comidas ... o durante
      o después de las comidas"'
ajusteRenalHepatico:
  renal: No requiere ajuste de dosis en insuficiencia renal; considerar monitoreo de fenitoína libre.
  hepatico: 'Metabolismo hepático saturable: ajustar individualmente según niveles plasmáticos y respuesta clínica.'
  fuente:
    ref: PEDIAMECUM-FENITOINA
    detalle: Insuficiencia renal o hepática (Pediamécum) y CIMA 4.2
alertas:
- 'Cinética no lineal (saturable): pequeños incrementos de dosis pueden provocar grandes aumentos en los niveles plasmáticos
  y toxicidad.'
- Cápsulas de 100 mg no son adecuadas para niños con peso inferior a 20 kg que requieran dosificación fraccionada fina.
