administracion:
  comida: ayunas
  texto: 'En ayunas: al menos 1 hora antes o 2 horas después de las comidas, con un vaso lleno de agua (250 ml) para reducir
    el riesgo de dolor esofágico; no acostarse inmediatamente después de tomarla.'
  fuente:
    ref: EMC-FLUCLOXACILINA
    detalle: 4.2 Method of administration
ajusteRenalHepatico:
  renal: 'En general no requiere reducción. Insuficiencia renal grave (aclaramiento de creatinina <10 ml/min): considerar
    reducir la dosis o alargar el intervalo; la dosis máxima recomendada en adultos es 1 g cada 8 a 12 horas. No se elimina
    significativamente por diálisis.'
  hepatico: No es necesario reducir la dosis (precaución por el riesgo de reacciones hepáticas).
  fuente:
    ref: EMC-FLUCLOXACILINA
    detalle: 4.2 Abnormal renal function / Hepatic impairment
alertas:
- 'Fuente única: solo la ficha técnica del Reino Unido (EMC); no hay ficha CIMA ni Pediamécum para contrastar.'
- 'La cápsula de 500 mg solo sirve para dosis de 500 mg: 62,5, 125 y 250 mg requieren la suspensión de 250 mg/5 ml del arsenal
  chileno (la ficha EMC es de la cápsula).'
- 'Osteomielitis y endocarditis: hasta 8 g diarios repartidos cada 6-8 horas (EMC); no se carga como pauta aparte.'
- Hepatitis e ictericia colestásica descritas, incluso hasta 2 meses después del tratamiento; precaución en disfunción hepática
  y en mayores de 50 años. Contraindicado con antecedente de ictericia por flucloxacilina (EMC, 4.3 y 4.4).
- 'Precaución con paracetamol: riesgo de acidosis metabólica con anión gap elevado (EMC, 4.4). Hipopotasemia con dosis altas.'
