ajusteRenalHepatico:
  renal: 'Pediamécum: no precisa ajuste; evitar en insuficiencia renal anúrica (la ficha CIMA la contraindica en anuria que
    no responde).'
  hepatico: 'Pediamécum: no precisa ajuste; vigilar estrechamente en cirróticos (hipopotasemia, depleción de volumen).'
  fuente:
    ref: PEDIAMECUM-FUROSEMIDA
    detalle: Insuficiencia renal / Insuficiencia hepática
alertas:
- Contraindicado en hipovolemia o deshidratación, anuria que no responde, hipopotasemia o hiponatremia graves, encefalopatía
  hepática (precoma o coma) y lactancia; posible sensibilidad cruzada con sulfonamidas (CIMA, 4.3).
