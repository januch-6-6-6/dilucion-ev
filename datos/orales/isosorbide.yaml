alertas:
- 'Fuente única: solo ficha técnica CIMA (mononitrato de isosorbida Normon); Pediamécum no tiene ficha y no hay ficha de dinitrato.'
- 'El comprimido de 10 mg del arsenal de APS no indica la sal (mononitrato o dinitrato de isosorbida): no se vincula a ninguna
  dosis de mononitrato; confirmar el producto antes de usarlo.'
- No usar con inhibidores de la 5-fosfodiesterasa (sildenafilo y similares); contraindicado en hipotensión pronunciada, shock,
  infarto agudo con presión de llenado baja, anemia marcada, traumatismo o hemorragia cerebral (CIMA, 4.3).
- Instaurar de forma gradual, sobre todo con diuréticos u otros antihipertensivos (CIMA).
