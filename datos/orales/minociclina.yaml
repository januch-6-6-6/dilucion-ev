alertas:
- Esta ficha carga solo el uso oftalmológico del fármaco; no carga sus otras indicaciones. El uso en blefaritis no está en
  la ficha técnica.
- Contraindicada en el embarazo, la lactancia y en menores de 8 años (CIMA 4.3 y 4.4).
- Puede manchar la piel, las uñas, la esclera, la conjuntiva, los dientes y el hueso (AAO PPP 2024).
- Una revisión Cochrane concluye que no hay evidencia suficiente sobre los antibióticos orales en la blefaritis crónica (Cochrane
  2021).
