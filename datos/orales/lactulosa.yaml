discrepancias:
- campo: Equivalencia g → ml en niños de 7 a 14 años
  valores:
  - fuente: CIMA-LACTULOSA
    valor: 10 g (correspondiente a 15 ml/día de solución oral) (CIMA, solución de 667 mg/ml)
  - fuente: PEDIAMECUM-LACTULOSA
    valor: 10 g/día (20 ml/día) (Pediamécum)
  mostrado: 10 g = 15 ml con la solución de 667 mg/ml (la calculadora convierte por concentración)
  motivo: 'Error de conversión en Pediamécum: con 667 mg/ml, 10 g son ≈15 ml, no 20 ml. No se copia ningún «ml» de las fichas.'
administracion:
  comida: indiferente
  texto: 'En una toma diaria o dividida en dos; si es única, siempre a la misma hora (p. ej., en el desayuno). Diluida o sin
    diluir; tragar de inmediato. Beber 1,5-2 litros de líquido al día (CIMA). Pediamécum: con zumo, leche o agua.'
  fuente:
    ref: CIMA-LACTULOSA
    detalle: 4.2 Forma de administración
ajusteRenalHepatico:
  renal: No es necesario ajustar la dosis (exposición sistémica insignificante).
  hepatico: No es necesario ajustar la dosis (exposición sistémica insignificante).
  fuente:
    ref: CIMA-LACTULOSA
    detalle: 4.2 Insuficiencia renal e insuficiencia hepática
alertas:
- Calcular siempre el volumen con la concentración del frasco; no copiar los ml de las fichas (Pediamécum equivoca 10 g =
  20 ml).
- 'El arsenal de APS lista lactulosa «Solución oral 65%» sin expresarla en mg/ml: no se carga como presentación; comprobar
  en la etiqueta la concentración real antes de usar la calculadora (la cargada es la de 667 mg/ml de CIMA).'
- Contraindicada en galactosemia y en obstrucción, perforación o riesgo de perforación digestiva (CIMA, 4.3).
- 'Encefalopatía portosistémica: seguridad y eficacia no establecidas en menores de 18 años (CIMA).'
