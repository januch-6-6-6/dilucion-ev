ajusteRenalHepatico:
  renal: La dosis se reduce según el aclaramiento de creatinina (Tabla 1 de la ficha); mantener buena hidratación; en hemodiálisis
    dar la dosis después de la sesión (CIMA 4.2).
  hepatico: No hace falta ajustar la dosis en cirrosis leve o moderada ni en cirrosis avanzada, según los estudios de la ficha
    (CIMA 4.2).
  fuente:
    ref: CIMA-OFT-VALACICLOVIR-61240
    detalle: 4.2 Insuficiencia renal / Insuficiencia hepática
alertas:
- Esta ficha carga solo el uso oftalmológico del fármaco; no carga sus otras indicaciones.
- El zóster oftálmico de un paciente inmunodeprimido se trata con aciclovir intravenoso, no con la vía oral (CIMA 4.4).
- 'Precaución en mayores de 65 años y en insuficiencia renal: los tres antivirales orales pueden dañar el riñón, y aciclovir
  y valaciclovir dan más reacciones del sistema nervioso en ancianos (guía MEEI/Harvard).'
- En el estudio HEDS agregar un antiviral oral de dosis alta al tópico en la queratitis epitelial no evitó la queratitis estromal
  posterior (guía MEEI/Harvard).
