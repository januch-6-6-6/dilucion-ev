dosis:
- indicacion: Dolor crónico intenso, comprimidos de liberación prolongada (adultos)
  poblacion: adulto
  regimen: fija
  unidad: mg
  min: 30
  max: 30
  tomasPorDia: 2
  intervaloH: 12
  estatus: autorizada
  condicion: Pacientes con dolor intenso no controlado con opioides más débiles; reducir la dosis inicial en debilitados o
    de poco peso
  texto: Empezar con 30 mg cada 12 horas, aumentando a 60 mg cada 12 horas si fuera necesario; incrementos posteriores del
    30-50 %
  fuente:
    ref: CIMA-MORFINA-57898
    detalle: '4.2: "normalmente deberá empezar con comprimidos de 30 mg cada 12 horas, aumentando a 60 mg cada 12 horas si
      fuera necesario"'
