administracion:
  comida: indiferente
  texto: Vía oral. Comprimidos de liberación prolongada cada 12 horas, enteros, sin romper, masticar ni triturar. La ficha
    no indica relación con las comidas.
  noTriturar: true
  fuente:
    ref: CIMA-MORFINA-57898
    detalle: 4.2 Posología y Forma de administración
ajusteRenalHepatico:
  renal: 'MST Continus: reducir la dosis en enfermedad renal crónica, como con todos los narcóticos; precaución con función
    renal gravemente alterada. Dropizol: la insuficiencia renal reduce y retrasa la eliminación (evitar o reducir la dosis).'
  hepatico: 'MST Continus: reducir la dosis en enfermedad hepática crónica; precaución con función hepática gravemente alterada.
    Dropizol: la morfina puede precipitar coma en insuficiencia hepática (evitar o reducir la dosis).'
  fuente:
    ref: CIMA-MORFINA-57898
    detalle: 4.4 (reducir la dosis en enfermedad renal y hepática crónica); Dropizol 83323, 4.2
alertas:
- 'Opioide de alto riesgo: confirmar concentración y forma (liberación prolongada cada 12 h vs. liberación normal cada 4 h)
  antes de calcular.'
- 'Los comprimidos de liberación prolongada se tragan enteros: rotos, masticados o triturados liberan rápidamente una dosis
  potencialmente letal (CIMA 57898).'
- 'Liberación prolongada: no en las primeras 24 h del postoperatorio; en niños no se recomienda para dolor postoperatorio
  (CIMA 57898).'
- 'Dropizol (CIMA, 10 mg/ml) está autorizado solo para la diarrea aguda del adulto (5-10 gotas 2-3 veces al día, dosis individual
  ≤1 ml y diaria ≤6 ml) y no se debe usar en <18 años: no es una pauta analgésica.'
- 'El arsenal chileno lista gotas orales de 20 mg/ml: el doble que Dropizol. Ninguna fuente cargada indica cuántas gotas tiene
  1 ml.'
- 'Ancianos (>65 años): puede ser aconsejable reducir la dosis (CIMA 57898).'
