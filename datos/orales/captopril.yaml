pediatria:
  estado: con_dosis
discrepancias:
- campo: Tope diario
  valores:
  - fuente: CIMA-CAPTOPRIL
    valor: '150 mg/día: dosis máxima diaria recomendada de la ficha (adultos)'
  - fuente: PEDIAMECUM-CAPTOPRIL
    valor: '450 mg/día: hipertensión en niños y adolescentes (otras publicaciones; en insuficiencia cardíaca, 150 mg/día)'
  mostrado: 150 mg/día como tope de adulto (la calculadora lo aplica también a las pautas pediátricas por peso)
  motivo: Regla del tope más bajo. La pauta pediátrica de Pediamécum conserva su propio máximo de 450 mg/día, pero la calculadora
    limita además al tope de adulto de la ficha.
- campo: Relación con las comidas
  valores:
  - fuente: CIMA-CAPTOPRIL
    valor: Antes, durante y después de las comidas (CIMA)
  - fuente: PEDIAMECUM-CAPTOPRIL
    valor: 'Una hora antes de las comidas o dos horas después: el alimento dificulta la absorción (Pediamécum)'
  mostrado: Se muestran ambas indicaciones
  motivo: La ficha técnica permite tomarlo con comida; Pediamécum recomienda separarlo de las comidas.
administracion:
  comida: indiferente
  texto: Captopril se puede tomar antes, durante y después de las comidas; los comprimidos ranurados se pueden fraccionar
    y las fracciones se guardan en lugar seco (CIMA). Pediamécum recomienda 1 h antes o 2 h después de comer.
  fuente:
    ref: CIMA-CAPTOPRIL
    detalle: 4.2 Forma de administración
ajusteRenalHepatico:
  renal: 'Dosis diaria según aclaramiento (ml/min/1,73 m²): >40, inicio 25-50 mg y máximo 150 mg; 21-40, inicio 25 y máximo
    100 mg; 10-20, inicio 12,5 y máximo 75 mg; <10, inicio 6,25 y máximo 37,5 mg. Ancianos: iniciar con 6,25 mg dos veces
    al día.'
  fuente:
    ref: CIMA-CAPTOPRIL
    detalle: 4.2 Insuficiencia renal (tabla) y personas de edad avanzada
alertas:
- Las pautas por kg de la ficha (0,30 y 0,15 mg/kg) no traen tope pediátrico en mg; como referencia, la dosis máxima diaria
  del adulto es 150 mg (CIMA) y la calculadora limita a ese tope.
- Contraindicado en el segundo y tercer trimestre del embarazo y con antecedente de angioedema por IECA (CIMA, 4.3).
