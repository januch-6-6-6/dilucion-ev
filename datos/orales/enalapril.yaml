alertas:
- 'La dosis de 2,5 mg (inicio en insuficiencia cardíaca y en niños de 20 a <50 kg) no se puede obtener con los comprimidos
  cargados (5, 10 y 20 mg, sin ranura declarada): haría falta medio comprimido de 5 mg partible o una presentación de 2,5
  mg.'
- Contraindicado en el segundo y tercer trimestre del embarazo, con antecedente de angioedema por IECA y en angioedema hereditario
  o idiopático; no combinar con sacubitrilo/valsartán (36 h de separación) (CIMA, 4.3).
- Riesgo de hipotensión sintomática tras la primera dosis si hay depleción de volumen (diuréticos, restricción de sal, diálisis,
  diarrea o vómitos) (CIMA, 4.4).
