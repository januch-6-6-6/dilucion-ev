  renal: 'Dosis inicial según aclaramiento de creatinina: 30-80 ml/min, 5-10 mg/día; 10-30 ml/min, 2,5 mg/día; ≤10 ml/min,
    2,5 mg los días de diálisis. En general, prolongar el intervalo y/o reducir la dosis. Ancianos: adecuar a la función renal.'
