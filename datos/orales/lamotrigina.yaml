administracion:
  comida: indiferente
  texto: Los comprimidos masticables/dispersables se pueden masticar, disolver en un pequeño volumen de agua (al menos suficiente
    para cubrir el comprimido) o tragarse enteros con agua. Si la dosis calculada no equivale a comprimidos enteros, redondear
    hacia abajo.
  fuente:
    ref: CIMA-LAMOTRIGINA
    detalle: 4.2 Forma de administración y posología general
ajusteRenalHepatico:
  renal: Usar con precaución; la acumulación del metabolito glucurónido es esperable en insuficiencia renal terminal.
  hepatico: Reducir las dosis inicial, de escalada y de mantenimiento aproximadamente en un 50 % en insuficiencia moderada
    (Child-Pugh B) y en un 75 % en insuficiencia grave (Child-Pugh C).
  fuente:
    ref: CIMA-LAMOTRIGINA
    detalle: 4.2 Insuficiencia hepática e Insuficiencia renal
alertas:
- 'Riesgo de erupción cutánea grave (síndrome de Stevens-Johnson / necrólisis epidérmica tóxica): respetar estrictamente la
  pauta lenta de escalada. Suspender al primer signo de exantema.'
- Si se interrumpe el tratamiento durante más de 5 semividas, reiniciar la escalada desde la dosis inicial.
