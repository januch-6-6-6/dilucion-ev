pediatria:
  estado: con_dosis
discrepancias:
- campo: Recién nacidos
  valores:
  - fuente: CIMA-NISTATINA
    valor: 'CIMA: recién nacidos y lactantes con bajo peso al nacer, 100.000 UI (1 ml) cada 6 horas'
  - fuente: PEDIAMECUM-NISTATINA
    valor: 'Pediamécum: neonatos a término 200.000 UI (2 ml) cada 6 horas; pretérmino 100.000 UI (1 ml) cada 6 horas'
  mostrado: No se cargan dosis neonatales (fuera del alcance de esta versión)
  motivo: Diferencia solo en el recién nacido a término; en lactantes, niños y adultos las fuentes coinciden.
administracion:
  comida: indiferente
  texto: Agitar bien. Puede tomarse sola, con agua o mezclada con un líquido o alimento blando no ácido (leche, miel, jalea).
    En candidiasis oral, mantenerla en la boca varios minutos antes de tragar.
  fuente:
    ref: CIMA-NISTATINA
    detalle: 4.2 Forma de administración
ajusteRenalHepatico: null
alertas:
- 'Dosis en unidades internacionales (UI): no se convierten a mg. 1 ml de suspensión = 100.000 UI.'
- 'Candidiasis oral: mantener la suspensión en la boca el mayor tiempo posible (varios minutos) antes de tragarla; en lactantes
  y niños pequeños, poner la mitad de la dosis en cada lado de la boca (CIMA).'
- Continuar al menos 48 horas después de que desaparezcan los síntomas; si empeora o persiste a los 14 días, reevaluar (CIMA).
- 'Pediamécum: no requiere ajuste en insuficiencia renal ni hepática (absorción sistémica despreciable).'
