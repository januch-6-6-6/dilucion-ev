    detalle: 'CONTRAINDICATIONS: "marked kidney or liver disease or dysfunction"'
alertas:
- Esta ficha carga solo el uso oftalmológico del fármaco; no carga sus otras indicaciones.
- 'No registrada en Chile: solo por importación o uso compasivo.'
- Contraindicada en enfermedad renal o hepática marcada, con sodio o potasio bajos y en acidosis hiperclorémica (etiqueta
  FDA).
- 'El uso prolongado está contraindicado en glaucoma de ángulo cerrado: puede cerrarse el ángulo aunque baje la presión (etiqueta
  FDA).'
- 'Es una sulfonamida: se han descrito reacciones graves (Stevens-Johnson, necrólisis epidérmica, discrasias sanguíneas) (etiqueta
  FDA).'
- Con aspirina en dosis altas hay riesgo de anorexia, taquipnea, letargo, coma y muerte (etiqueta FDA).
