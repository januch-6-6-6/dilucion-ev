alertas:
- 'La proporción amoxicilina:clavulánico cambia entre presentaciones (4:1, 7:1 y 8:1): elegir la presentación exacta. Todas
  las dosis y presentaciones de esta ficha se expresan en mg de amoxicilina (Pediamécum: "La dosificación se realiza en base
  a la amoxicilina").'
- 'Clavulánico: máximo 15 mg/kg/día sin superar 375 mg/día (Pediamécum). Las pautas 7:1 (25-45 y 70 mg/kg/día) NO se deben
  calcular con las suspensiones 4:1 (las del arsenal: 500 + 125 y 250 + 62,5 mg/5 ml): con 4:1, 70 mg/kg/día de amoxicilina
  aportarían 17,5 mg/kg/día de clavulánico, por encima del máximo. Con la suspensión 4:1 usar solo las pautas 4:1 (35-40 mg/kg/día
  en 3 dosis). Cada pauta queda vinculada a sus presentaciones: las 7:1 de adultos y niños ≥40 kg, al comprimido y al sobre
  875/125; las 7:1 de niños <40 kg, solo al comprimido 875/125 (la ficha del sobre, CIMA 59518, solo da posología para ≥40
  kg); las 4:1, a las suspensiones 4:1.'
- 'Niños de menos de 25 kg: no hay ninguna presentación 7:1 cargada que les sirva. Los comprimidos 875/125 no se pueden partir
  y no se deben usar con menos de 25 kg (CIMA 59515: "los niños que pesen menos de 25 kg no deben ser tratados con Augmentine
  comprimidos"; "deben ser tratados preferiblemente con Augmentine suspensión o sobres pediátricos"), y esas presentaciones
  pediátricas 7:1 no están cargadas. Las pautas 7:1 (25-45 y 70 mg/kg/día) no se pueden calcular con ninguna presentación
  de esta ficha en ese peso: no sustituirlas por la suspensión 4:1 ni por la 8:1.'
- 'Dos suspensiones tienen 100 mg/ml de amoxicilina pero distinto clavulánico: 8:1 (12,5 mg/ml) y la 4:1 del arsenal (500
  + 125 mg/5 ml, 25 mg/ml). Confirmar el frasco.'
- 'Los comprimidos 875/125 no se deben partir: no usar en niños de menos de 25 kg (CIMA 59515). Entre 25 y 40 kg, un comprimido
  aporta 35,0 mg/kg (25 kg), 29,2 (30 kg), 25,0 (35 kg) o 21,9 mg/kg (40 kg) de amoxicilina por dosis, frente a la dosis única
  recomendada de 12,5-22,5 mg/kg (hasta 35) (tabla de CIMA 59515, 4.2.1).'
- Las presentaciones 7:1 no se recomiendan con aclaramiento de creatinina <30 ml/min ni en menores de 2 meses (sin datos)
  (CIMA 59515).
- Contraindicado con antecedente de ictericia o insuficiencia hepática por amoxicilina/clavulánico; evitar en sospecha de
  mononucleosis (CIMA, 4.3 y 4.4).
- Esta presentación 7:1 no debe usarse para S. pneumoniae resistente a penicilina (CIMA 59515, 4.4).
