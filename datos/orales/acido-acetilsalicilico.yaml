  hepatico: Contraindicado en insuficiencia hepática grave.
  fuente:
    ref: CIMA-ACIDO-ACETILSALICILICO
    detalle: 4.3 Contraindicaciones
alertas:
- No usar en menores de 16 años (síndrome de Reye), sobre todo con fiebre, gripe o varicela (CIMA, 4.3 y 4.4).
- Contraindicado en úlcera gastroduodenal, antecedente de hemorragia digestiva por AINE, diátesis hemorrágica, asma inducida
  por salicilatos, insuficiencia renal, hepática o cardíaca grave, metotrexato ≥15 mg/semana y tercer trimestre del embarazo
  (CIMA, 4.3).
- El comprimido de 100 mg del arsenal (antiagregante) no sirve para la dosis analgésica de 500 mg.
