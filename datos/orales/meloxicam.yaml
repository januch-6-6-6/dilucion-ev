alertas:
- Contraindicado en menores de 16 años, tercer trimestre de embarazo, antecedente de hemorragia o perforación digestiva por
  AINE, insuficiencia hepática grave e insuficiencia renal grave no dializada (CIMA, 4.3).
- Con riesgo aumentado de reacciones adversas (antecedente digestivo o factores de riesgo cardiovascular), iniciar con 7,5
  mg/día (CIMA, 4.2).
