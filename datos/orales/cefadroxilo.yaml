ajusteRenalHepatico:
  renal: 'Adultos, según aclaramiento de creatinina: 50-25 ml/min, dosis inicial 1000 mg y continuación 500-1000 mg cada 12
    h; 25-10 ml/min, cada 24 h; 10-0 ml/min, cada 36 h. Hemodiálisis: dosis adicional de 500-1000 mg al final de la sesión.'
  hepatico: No es necesario ajustar la dosis.
  fuente:
    ref: CIMA-CEFADROXILO-55730
    detalle: 4.2 Insuficiencia renal (tabla), pacientes en hemodiálisis, insuficiencia hepática
alertas:
- 'Con la cápsula de 500 mg no se consigue una dosis adecuada en niños ≥6 años de menos de 40 kg, y no está recomendada en
  menores de 6 años: usar la suspensión de 250 mg/5 ml (CIMA 55730).'
- La suspensión no está recomendada en lactantes y niños de menos de 6 kg (CIMA 55731).
- Contraindicado en niños ≥6 años de menos de 40 kg con insuficiencia renal o en hemodiálisis (CIMA 55730, 4.3).
- 'Duración: 2-3 días tras desaparecer los síntomas; en infecciones por Streptococcus pyogenes, hasta 10 días (CIMA).'
- CIMA 55731 trae además una tabla de amigdalitis con 30 mg/kg/día en una sola toma; no se carga como pauta aparte.
