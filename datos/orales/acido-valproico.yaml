ajusteRenalHepatico:
  renal: En pacientes con insuficiencia renal debe tenerse en cuenta la elevación de valproico libre en plasma y reducir la
    dosis adecuadamente.
  hepatico: Contraindicado en enfermedad o insuficiencia hepática grave (riesgo de hepatotoxicidad mortal).
  fuente:
    ref: CIMA-ACIDO-VALPROICO-48827
    detalle: 4.2 Insuficiencia renal y 4.3 Contraindicaciones
alertas:
- 'Teratogénico mayor: contraindicado en mujeres con capacidad de gestación salvo estricto cumplimiento del Plan de Prevención
