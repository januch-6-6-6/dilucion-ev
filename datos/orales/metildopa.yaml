alertas:
- La dosis de 125 mg de los mayores de 65 años no se puede obtener con los comprimidos cargados (250 y 500 mg, sin ranura
  declarada).
- Contraindicado en enfermedad hepática activa, depresión, tratamiento con IMAO, feocromocitoma o paraganglioma y porfiria
  (CIMA, 4.3).
- 'Somnolencia al inicio y al subir la dosis: aumentar primero la dosis de la noche (CIMA).'
