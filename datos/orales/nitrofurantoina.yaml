alertas:
- Contraindicada con aclaramiento de creatinina <45 ml/min (entre 30 y 44 ml/min solo ante microorganismos multirresistentes,
  valorando beneficio/riesgo), en menores de 3 meses, tratamientos >7 días, déficit de G6PD, porfiria aguda y en las dos últimas
  semanas de embarazo (CIMA, 4.3).
- No indicada en infecciones urinarias en varones, infecciones urinarias altas ni bacteriemia (CIMA, 4.4).
- 'Tratamientos prolongados: reacciones pulmonares y hepáticas graves y neuropatía periférica; no usar como profilaxis de
  infecciones urinarias recurrentes (CIMA, 4.4).'
- 'El comprimido de 50 mg no se puede partir: las dosis por kg se redondean a múltiplos de 50 mg o se usa la suspensión.'
- La orina puede teñirse de amarillo o marrón (CIMA).
