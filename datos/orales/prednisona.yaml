alertas:
- La dosis depende de la indicación y de la gravedad; ver la fuente para cada enfermedad (CIMA da pautas de 5 a 300 mg/día
  según indicación).
- 'Tratamientos prolongados: no suspender bruscamente; reducir gradualmente según el esquema de la ficha técnica (CIMA, 4.2).'
- En niños en fase de crecimiento, el tratamiento debería ser alternante o intermitente (CIMA, 4.2).
- Pediamécum agrega pautas de asma para ≥12 años (40-80 mg/día en exacerbaciones) y por edad; no se cargan.
- 'La dosis intermedia de 1 mg/kg/día no tiene tope pediátrico en la fuente; como referencia, la pauta de asma del adulto
  llega a 60 mg al día (CIMA 75649, «Asma bronquial: de 15 mg a 60 mg al día»).'
- 'Uso oftalmológico: en la neuritis óptica aguda, la prednisona oral sola (1 mg/kg/día por 14 días) resultó ineficaz y aumentó
  el riesgo de nuevos episodios en el ONTT; no es la pauta de la neuritis óptica (ONTT, NEJM 1992).'
- En arteritis de células gigantes con pérdida visual la guía británica usa pulsos de metilprednisolona intravenosa (500 mg
  a 1 g al día hasta 3 días); esa pauta no está cargada aquí.
- Los corticoides sistémicos pueden causar catarata, aumento de la presión intraocular y glaucoma; con más de 7,5 mg/día por
  más de 3 meses hay que considerar ahorradores de esteroides, y dar calcio y vitamina D (EyeWiki, tratamiento de uveítis).
