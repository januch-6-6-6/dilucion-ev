id: fosfato-de-potasio
nombre: Fosfato de potasio
comerciales: []
grupo: electrolito
ambitos:
- upc
- hospitalizacion
altoRiesgo: true
presentaciones:
- id: amp-10mmol-10ml
  forma: ampolla 1 M (10 ml)
  cantidad:
    valor: 10
    unidad: mmol
  volumenMl: 10
  fuente:
    ref: CIMA-FOSFATO-DE-POTASIO
    detalle: '2: 1 mmol de fosfato y 2 mEq de K por ml; ampollas de 10 ml'
reconstitucion: null
dilucion:
  sueros:
  - SF
  - SG5
  concentracionMax:
    valor: 0.02
    unidad: mmol
    fuente:
      ref: PUCON-2022
      detalle: 'Anexo 6, Cloruro de potasio: máximo periférico 40 mEq/L de K (0,02 mmol/ml de fosfato dipotásico = 40 mEq/L
        de K)'
  estandar: []
administracion:
  vias:
  - infusion_intermitente
  texto: 'Siempre diluido, en perfusión IV (p. ej., 0,08 mmol/kg en 6 h). Aporta potasio: 1 ml = 2 mEq de K. En cetoacidosis
    no superar 5 mEq/h.'
  requiereBomba: true
  fuente:
    ref: CIMA-FOSFATO-DE-POTASIO
    detalle: 4.2; 6.6
dosis:
- indicacion: Hipofosfatemia reciente no complicada (en 6 h)
  poblacion: adulto
  unidad: mmol/kg
  min: 0.08
  max: 0.16
  fuente:
    ref: CIMA-FOSFATO-DE-POTASIO
    detalle: '4.2.1: 0,08 mmol/kg; puede duplicarse'
- indicacion: Pauta alternativa según fósforo inicial
  poblacion: adulto
  unidad: mmol/kg
  min: 0.25
  max: 0.5
  fuente:
    ref: CIMA-FOSFATO-DE-POTASIO
    detalle: '4.2.1: 0,25 mmol/kg (P > 0,5 mg/dl) o 0,5 mmol/kg (P < 0,5)'
- indicacion: 'Niños: según requerimiento de potasio (2–3 mEq de K/kg/día)'
  poblacion: pediatrico
  unidad: mmol/kg/24 h
  min: 1
  max: 1.5
  fuente:
    ref: CIMA-FOSFATO-DE-POTASIO
    detalle: '4.2.1: 2–3 mEq de K/kg/día; 1 ml = 1 mmol de fosfato = 2 mEq de K, es decir 1–1,5 mmol/kg/día'
sinDosisPediatrica: false
estabilidad:
  fuente:
    ref: CIMA-FOSFATO-DE-POTASIO
    detalle: '6.6: compatible 24 h a 22 °C con nutrición parenteral'
