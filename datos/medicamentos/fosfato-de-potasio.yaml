id: fosfato-de-potasio
nombre: Fosfato de potasio
comerciales: []
grupo: electrolito
ambitos:
- upc
- hospitalizacion
altoRiesgo: true
presentaciones:
- id: amp-10mmol-10ml
  forma: ampolla 1 M (10 ml)
  cantidad:
    valor: 10
    unidad: mmol
  volumenMl: 10
  fuente:
    ref: CIMA-FOSFATO-DE-POTASIO
    detalle: '2: 1 mmol de fosfato y 2 mEq de K por ml; ampollas de 10 ml'
reconstitucion: null
dilucion:
  sueros:
  - SF
  - SG5
  concentracionMax:
    valor: 0.5
    unidad: mmol
    fuente:
      ref: CIMA-FOSFATO-DE-POTASIO
      detalle: '6.6: diluir como mínimo con igual cantidad de diluyente'
  estandar: []
administracion:
  vias:
  - infusion_intermitente
  texto: 'Siempre diluido, en perfusión IV (p. ej., 0,08 mmol/kg en 6 h). Aporta potasio: 1 ml = 2 mEq de K. En cetoacidosis
    no superar 5 mEq/h.'
  requiereBomba: true
  fuente:
    ref: CIMA-FOSFATO-DE-POTASIO
    detalle: 4.2; 6.6
dosis:
- indicacion: Hipofosfatemia reciente no complicada (en 6 h)
  poblacion: adulto
  unidad: mmol/kg
  min: 0.08
  max: 0.16
  fuente:
    ref: CIMA-FOSFATO-DE-POTASIO
    detalle: '4.2.1: 0,08 mmol/kg; puede duplicarse'
- indicacion: Pauta alternativa según fósforo inicial
  poblacion: adulto
  unidad: mmol/kg
  min: 0.25
  max: 0.5
  fuente:
    ref: CIMA-FOSFATO-DE-POTASIO
    detalle: '4.2.1: 0,25 mmol/kg (P > 0,5 mg/dl) o 0,5 mmol/kg (P < 0,5)'
- indicacion: 'Niños: según requerimiento de potasio'
  poblacion: pediatrico
  unidad: mEq/kg/24 h
  min: 2
  max: 3
  fuente:
    ref: CIMA-FOSFATO-DE-POTASIO
    detalle: '4.2.1: 2–3 mEq de K/kg/día'
sinDosisPediatrica: false
estabilidad:
  fuente:
    ref: CIMA-FOSFATO-DE-POTASIO
    detalle: '6.6: compatible 24 h a 22 °C con nutrición parenteral'
compatibilidad: []
interaccionesGraves:
- con: Digitálicos (con bloqueo cardíaco)
  efecto: Riesgo de hiperkalemia; no recomendado
  fuente:
    ref: CIMA-FOSFATO-DE-POTASIO
    detalle: '4.5'
efectosAdversos:
  frecuentes: []
  graves:
  - Hiperkalemia
  - Hipocalcemia
  - Arritmias con infusión rápida
  vigilar:
  - Fósforo, potasio y calcio
  - ECG
  fuente:
    ref: CIMA-FOSFATO-DE-POTASIO
    detalle: '4.8'
alertas:
- Medicamento de alto riesgo.
- NUNCA en bolo. Contiene potasio (2 mEq/ml).
meta:
  discrepancias:
  - campo: fuente chilena
    valores:
    - Protocolo Pucón 2022 no incluye fosfato de potasio
    decision: Ficha basada en CIMA (fosfato dipotásico 1 M); confirmar la sal disponible en Chile.
