interaccionesGraves:
- con: Digitálicos (con bloqueo cardíaco)
  efecto: Riesgo de hiperkalemia; no recomendado
  fuente:
    ref: CIMA-FOSFATO-DE-POTASIO
    detalle: '4.5'
efectosAdversos:
  frecuentes: []
  graves:
  - Hiperkalemia
  - Hipocalcemia
  - Arritmias con infusión rápida
  vigilar:
  - Fósforo, potasio y calcio
  - ECG
  fuente:
    ref: CIMA-FOSFATO-DE-POTASIO
    detalle: '4.8'
alertas:
- Medicamento de alto riesgo.
- NUNCA en bolo. Contiene potasio (2 mEq/ml).
meta:
  discrepancias:
  - campo: fuente chilena
    valores:
    - Protocolo Pucón 2022 no incluye fosfato de potasio
    decision: Ficha basada en CIMA (fosfato dipotásico 1 M); confirmar la sal disponible en Chile.
  - campo: concentración máxima
    valores:
    - 'CIMA: diluir al menos 1:1 (hasta 1000 mEq/L de K)'
    - 'Pucón (KCl): máximo periférico 40 mEq/L de K'
    decision: 'Se aplica el límite de potasio periférico de Pucón (0,02 mmol/ml), el más conservador. Revisión clínica (Héctor
      Salvo Agüero, TENS, 2026-10-02): criterio conservador aprobado.'
