administracion:
  vias:
  - infusion_intermitente
  texto: 'Infusión de al menos 60 minutos y no más de 10 mg/min (dosis > 1 g en 2 h): la infusión rápida causa reacciones
    (enrojecimiento, hipotensión).'
  fuente:
    ref: IQUIQUE-2020
    detalle: Tiempo y detalles de administración
  tiempoMinimoMin: 60
dosis:
- indicacion: '≥ 12 años: cada 8–12 h (máx. 2 g por dosis)'
  poblacion: adulto
  unidad: mg/kg
  min: 15
  max: 20
  fuente:
    ref: CIMA-VANCOMICINA
    detalle: '4.2: 15–20 mg/kg'
- indicacion: Dosis de carga en paciente grave
  poblacion: adulto
  unidad: mg/kg
  min: 25
  max: 30
  fuente:
    ref: CIMA-VANCOMICINA
    detalle: '4.2: 25–30 mg/kg'
- indicacion: Lactantes y niños 1 mes–12 años, cada 6 h
