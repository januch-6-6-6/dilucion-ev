interaccionesGraves:
- con: Anestésicos
  efecto: Eritema, enrojecimiento histaminoide y reacciones anafilactoides
  fuente:
    ref: CIMA-VANCOMICINA
    detalle: '4.5'
- con: Fármacos nefrotóxicos u ototóxicos (aminoglucósidos)
  efecto: Toxicidad aditiva
  fuente:
    ref: CIMA-VANCOMICINA
    detalle: '4.4'
efectosAdversos:
  frecuentes:
  - Flebitis
  - Exantema
  graves:
  - Reacción a la infusión rápida (enrojecimiento, hipotensión)
  - Nefrotoxicidad
  - Ototoxicidad
  vigilar:
  - Niveles plasmáticos
  - Función renal
  - Velocidad de infusión
  fuente:
    ref: CIMA-VANCOMICINA
    detalle: 4.8; 4.4
alertas:
- 'Incompatible en Y según la guía de Iquique con: albúmina, anfotericina B, aminofilina, ampicilina, cefazolina, cefepime,
  cefotaxima, ceftazidima, ceftriaxona, ciprofloxacino, heparina, omeprazol, piperacilina-tazobactam y propofol.'
meta:
  discrepancias:
  - campo: concentración
    valores:
    - 'CIMA: al menos 100 ml por 500 mg (5 mg/ml); 10 mg/ml solo con restricción de líquidos'
    - 'Iquique: ≤ 1 g en 100 ml (10 mg/ml)'
    decision: Máximo registrado 10 mg/ml; la dilución habitual de 5 mg/ml es la de CIMA.
