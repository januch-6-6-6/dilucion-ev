    detalle: '4.2: 50 mg/kg'
sinDosisPediatrica: false
estabilidad:
  refrigeradoH: 24
  fuente:
    ref: IQUIQUE-2020
    detalle: 'Cefepime: reconstituido 24 h en refrigeración'
compatibilidad: []
interaccionesGraves:
- con: Anticoagulantes cumarínicos
  efecto: Posible potenciación del efecto anticoagulante
  fuente:
    ref: CIMA-CEFEPIME
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Diarrea
  - Exantema
  - Flebitis en el sitio de infusión
  graves:
  - Anafilaxia
  - Colitis por Clostridioides difficile
  vigilar:
  - Signos de alergia en la primera dosis
  - Deposiciones
  fuente:
    ref: CIMA-CEFEPIME
    detalle: 4.8; 4.4
alertas:
- 'Incompatible en Y según la guía de Iquique con: aciclovir, anfotericina B, ciprofloxacino, diazepam, dobutamina, dopamina,
  fenitoína, haloperidol, sulfato de magnesio, metoclopramida, midazolam, morfina, ondansetrón, propofol y vancomicina.'
meta:
