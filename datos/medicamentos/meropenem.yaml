interaccionesGraves:
- con: Probenecid
  efecto: Aumenta la concentración de meropenem
  fuente:
    ref: CIMA-MEROPENEM
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Diarrea
  - Exantema
  - Flebitis en el sitio de infusión
  graves:
  - Anafilaxia
  - Colitis por Clostridioides difficile
  vigilar:
  - Signos de alergia en la primera dosis
  - Deposiciones
  fuente:
    ref: CIMA-MEROPENEM
    detalle: 4.8; 4.4
alertas:
- 'Incompatible en Y según la guía de Iquique con: aciclovir, anfotericina B, cloruro de potasio, gluconato de calcio, diazepam,
  metronidazol y ondansetrón.'
meta:
  discrepancias:
  - campo: reconstitución
    valores:
    - 'Iquique: 500 mg en 10 ml y 1 g en 20 ml (ambos 50 mg/ml)'
    decision: 'Ambas presentaciones a 50 mg/ml; la ficha registra 20 ml (frasco de 1 g) como volumen de reconstitución. Revisión
      clínica (Héctor Salvo Agüero, TENS, 2026-10-02): aprobado; revisar con el protocolo local.'
