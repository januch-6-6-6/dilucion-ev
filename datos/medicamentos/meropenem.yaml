id: meropenem
nombre: Meropenem
comerciales: []
grupo: antiinfeccioso
ambitos:
- urgencia
- upc
- hospitalizacion
altoRiesgo: false
presentaciones:
- id: fa-1g
  forma: frasco ampolla (polvo)
  cantidad:
    valor: 1
    unidad: g
  volumenMl: 20
  fuente:
    ref: IQUIQUE-2020
    detalle: 'Meropenem: FA 1 g en 20 ml de SF'
- id: fa-500mg
  forma: frasco ampolla (polvo)
  cantidad:
    valor: 500
    unidad: mg
  volumenMl: 10
  fuente:
    ref: IQUIQUE-2020
    detalle: 'Meropenem: FA 500 mg en 10 ml de SF'
reconstitucion:
  diluyente: suero fisiológico
  volumenMl: 20
  fuente:
    ref: IQUIQUE-2020
    detalle: 'Reconstitución: 20 ml de suero fisiológico'
dilucion:
  sueros:
  - SF
  estandar:
  - descripcion: Hasta 2 g en 100 ml
    cantidad:
      valor: 2
      unidad: g
    volumenFinalMl: 100
    fuente:
      ref: IQUIQUE-2020
      detalle: 'Meropenem: ≤ 2 g en 100 ml'
administracion:
  vias:
  - bolo
  - infusion_intermitente
  - infusion_continua
  texto: 'Infusión prolongada de 4 horas (Iquique); CIMA: perfusión de 15–30 min o bolo de hasta 1 g en 5 min. Diluir solo
    en SF.'
  fuente:
    ref: IQUIQUE-2020
    detalle: Tiempo y detalles de administración
dosis:
- indicacion: Cada 8 h (2 g en meningitis)
  poblacion: adulto
  unidad: g
  min: 0.5
  max: 2
  fuente:
    ref: CIMA-MEROPENEM
    detalle: '4.2: 500 mg–2 g cada 8 h'
- indicacion: Niños 3 meses–11 años (≤ 50 kg), cada 8 h (mayoría de infecciones)
  poblacion: pediatrico
  unidad: mg/kg
  min: 10
  max: 20
  topeAdulto:
    valor: 1
    unidad: g
  fuente:
    ref: PEDIAMECUM-MEROPENEM
    detalle: 10–20 mg/kg cada 8 h
- indicacion: Meningitis bacteriana o fibrosis quística (niños), cada 8 h
  poblacion: pediatrico
  unidad: mg/kg
  min: 40
  max: 40
  topeAdulto:
    valor: 2
    unidad: g
  fuente:
    ref: PEDIAMECUM-MEROPENEM
    detalle: 40 mg/kg cada 8 h
sinDosisPediatrica: false
estabilidad:
  refrigeradoH: 24
  fuente:
    ref: IQUIQUE-2020
    detalle: 'Meropenem: reconstituido 24 h en refrigeración'
