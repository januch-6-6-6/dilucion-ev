  cantidad:
    valor: 200
    unidad: mg
  volumenMl: 5
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Dopamina: 200 mg/5 ml'
reconstitucion: null
dilucion:
  sueros:
  - SF
  - SG5
  concentracionMax:
    valor: 4
    unidad: mg
    fuente:
      ref: PUCON-2022
      detalle: 'Anexo 6, Dopamina: 4 mg/ml (habitual 400 mg/100 ml)'
