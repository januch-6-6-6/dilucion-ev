interaccionesGraves:
- con: Glucósidos cardíacos
  efecto: Alteración de la digoxinemia por cambios de potasio
  fuente:
    ref: CIMA-MANITOL
    detalle: '4.5'
- con: Diuréticos
  efecto: Ajustar la dosis
  fuente:
    ref: CIMA-MANITOL
    detalle: '4.5'
efectosAdversos:
  frecuentes: []
  graves:
  - Sobrecarga de volumen y edema pulmonar
  - Alteraciones electrolíticas
  - Insuficiencia renal
  vigilar:
  - Diuresis
  - Electrolitos y osmolaridad
  fuente:
    ref: CIMA-MANITOL
    detalle: '4.8'
alertas:
- 'Presentación del 20 %: puede cristalizar con frío.'
meta:
  discrepancias:
  - campo: tope pediátrico y presentación
    valores:
    - Tope 100 g = 1,5 g/kg × 70 kg (aprox.)
    - Volumen de frasco de 250 ml no confirmado en la ficha (Osmofundina)
    decision: 'Confirmar presentación local (250 o 500 ml). Revisión clínica (Héctor Salvo Agüero, TENS, 2026-10-02): tope
      = dosis de adulto en 70 kg aceptado; la app lo muestra como «calculado, no de fuente». Revisión clínica (Héctor Salvo
      Agüero, TENS, 2026-10-02): se usan ambos frascos, 250 ml (50 g) y 500 ml (100 g).'
