  fuente:
    ref: CIMA-MANITOL
    detalle: '4.2'
dosis:
- indicacion: Hipertensión intracraneal (en 30–60 min)
  poblacion: adulto
  unidad: g/kg
  min: 1.5
  max: 2
  fuente:
    ref: CIMA-MANITOL
    detalle: '4.2: 1,5–2 g/kg'
- indicacion: Test de infusión en oliguria (bolo)
  poblacion: adulto
  unidad: g/kg
  min: 0.2
  max: 0.2
  fuente:
    ref: CIMA-MANITOL
    detalle: '4.2: 0,2 g/kg'
- indicacion: Hipertensión intracraneal (niños), en 20–30 min
  poblacion: pediatrico
  unidad: g/kg
  min: 0.5
  max: 1
  topeAdulto:
    valor: 100
    unidad: g
  topeEstimado: true
  fuente:
    ref: PEDIAMECUM-MANITOL
    detalle: 0,5–1 g/kg (máx. 1,5 g/kg/día)
