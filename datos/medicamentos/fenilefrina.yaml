interaccionesGraves:
- con: IMAO no selectivos
  efecto: Hipertensión paroxística e hipertermia posiblemente mortal (contraindicado)
  fuente:
    ref: CIMA-FENILEFRINA
    detalle: '4.5'
- con: Antidepresivos tricíclicos
  efecto: Hipertensión paroxística con posible arritmia
  fuente:
    ref: CIMA-FENILEFRINA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Náuseas y vómitos
  - Cefalea
  graves:
  - Bradicardia refleja
  - Hipertensión
  - Arritmias
  - Necrosis por extravasación
  vigilar:
  - PA y FC frecuentes
  - Sitio de infusión
  fuente:
    ref: CIMA-FENILEFRINA
    detalle: '4.8'
alertas:
- Medicamento de alto riesgo.
- La ampolla de 10 mg/ml debe diluirse; no confundir con la presentación de 100 mcg/ml.
meta:
  discrepancias:
  - campo: dosis pediátrica
    valores:
    - 'CIMA: sin datos en niños'
    - 'Pediamécum: bolo 5–20 mcg/kg; infusión 0,1–0,5 mcg/kg/min'
    decision: Se registra la pauta de Pediamécum con tope de bolo adulto de 100 mcg.
