interaccionesGraves:
- con: Dipiridamol
  efecto: Potencia la adenosina; reducir considerablemente la dosis
  fuente:
    ref: CIMA-ADENOSINA
    detalle: '4.5'
- con: Teofilina, aminofilina, cafeína (xantinas)
  efecto: Antagonizan la adenosina; evitar 24 h antes
  fuente:
    ref: CIMA-ADENOSINA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Sofoco
  - Náuseas
  - Mareos
  - Cefalea
  - Sabor metálico
  graves:
  - Dolor torácico
  vigilar:
  - Monitorización ECG continua
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Adenosina: RAM y precauciones'
alertas:
- Tener equipo de reanimación disponible durante la administración.
meta:
  discrepancias:
  - campo: dosis adulto
    valores:
    - 'CIMA: primera dosis 3 mg, luego 6 mg y 12 mg'
    - 'FDA y práctica chilena: 6 mg, luego 12 mg'
    decision: 'Revisión clínica (Héctor Salvo Agüero, TENS, 2026-10-01): se usa 6 → 12 mg, respaldado por la etiqueta FDA.'
