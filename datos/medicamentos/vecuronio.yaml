      ref: FDA-VECURONIO
      detalle: 'Infusión: 0,1 mg/ml (10 mg en 100 ml)'
administracion:
  vias:
  - bolo
  - infusion_continua
  texto: Solo IV, por o bajo supervisión de clínicos expertos. Monitorizar la respuesta al estimulador de nervio periférico.
    Iniciar la infusión solo tras evidencia de recuperación espontánea del bolo.
  requiereBomba: true
  fuente:
    ref: FDA-VECURONIO
    detalle: Dosage and administration
dosis:
- indicacion: Intubación (dosis inicial)
  poblacion: adulto
  unidad: mg/kg
  min: 0.08
  max: 0.1
  fuente:
    ref: FDA-VECURONIO
