    detalle: 0,08–0,1 mg/kg en bolo
- indicacion: Mantención (bolos)
  poblacion: adulto
  unidad: mg/kg
  min: 0.01
  max: 0.015
  fuente:
    ref: FDA-VECURONIO
    detalle: 0,01–0,015 mg/kg
- indicacion: Perfusión continua
  poblacion: adulto
  unidad: mcg/kg/min
  min: 1
  max: 1
  fuente:
    ref: FDA-VECURONIO
    detalle: 1 mcg/kg/min
- indicacion: Lactantes > 7 semanas–1 año (repetible cada hora)
  poblacion: pediatrico
  unidad: mg/kg
  min: 0.1
  max: 0.1
  topeAdulto:
    valor: 7
    unidad: mg
  topeEstimado: true
  fuente:
    ref: PEDIAMECUM-VECURONIO
    detalle: 0,1 mg/kg/dosis
sinDosisPediatrica: false
