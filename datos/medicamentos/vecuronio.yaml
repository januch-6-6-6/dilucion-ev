  cantidad:
    valor: 10
    unidad: mg
  volumenMl: 10
  fuente:
    ref: FDA-VECURONIO
    detalle: Vial de 10 mg
reconstitucion:
  diluyente: Agua para inyectables
  volumenMl: 10
  fuente:
    ref: FDA-VECURONIO
    detalle: Reconstituir con agua estéril (volumen no indicado en la etiqueta; se asumen 10 ml = 1 mg/ml)
dilucion:
  sueros:
  - SF
  - SG5
  estandar:
  - descripcion: 10 mg en 100 ml (0,1 mg/ml) para perfusión
