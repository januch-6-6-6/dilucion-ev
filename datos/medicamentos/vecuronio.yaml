interaccionesGraves:
- con: Anestésicos inhalatorios y succinilcolina previa
  efecto: Potencian el bloqueo
  fuente:
    ref: FDA-VECURONIO
    detalle: Dosage and administration
efectosAdversos:
  frecuentes: []
  graves:
  - Bloqueo prolongado
  - Debilidad o parálisis persistente
  vigilar:
  - Ventilación
  - Tren de cuatro
  fuente:
    ref: FDA-VECURONIO
    detalle: Adverse reactions
alertas:
- Medicamento de alto riesgo.
- 'Paraliza la respiración: solo con vía aérea y ventilación aseguradas.'
meta:
  discrepancias:
  - campo: fuente y reconstitución
    valores:
    - No hay vecuronio en CIMA ni en Pucón
    - FDA no indica el volumen de reconstitución en el extracto revisado
    decision: 'Fuente FDA; se asumen 10 ml (1 mg/ml), práctica habitual: confirmar. Tope pediátrico 7 mg (0,1 mg/kg × 70 kg).
      Revisión clínica (Héctor Salvo Agüero, TENS, 2026-10-02): reconstitución con 10 ml (1 mg/ml) confirmada por experiencia
      clínica; tope = dosis de adulto en 70 kg aceptado; la app lo muestra como «calculado, no de fuente».'
