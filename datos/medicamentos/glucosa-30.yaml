interaccionesGraves:
- con: Insulina y antidiabéticos
  efecto: Antagonismo del efecto hipoglicemiante
  fuente:
    ref: CIMA-GLUCOSA-30
    detalle: '4.5'
- con: Digoxina
  efecto: Aumento de la actividad digitálica (hipokalemia)
  fuente:
    ref: CIMA-GLUCOSA-30
    detalle: '4.5'
efectosAdversos:
  frecuentes: []
  graves:
  - Hiperglicemia
  - Síndrome hiperosmolar con administración rápida
  - Flebitis y trombosis venosa
  vigilar:
  - Glicemia
  - Potasio, magnesio y fósforo
  - Sitio de punción
  fuente:
    ref: CIMA-GLUCOSA-30
    detalle: '4.8'
alertas:
- 'Solución hipertónica: riesgo de flebitis por vía periférica.'
meta:
  discrepancias:
  - campo: presentación
    valores:
    - 'CIMA: frasco de 500 ml al 30 %'
    - En Chile es habitual la ampolla de 20 ml al 30 % (6 g), no confirmada en fuente chilena
    decision: Se registra la de CIMA; confirmar la presentación local. «Volumen a cargar» usa 300 mg/ml en ambos casos.
