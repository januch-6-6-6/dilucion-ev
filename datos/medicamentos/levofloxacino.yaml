interaccionesGraves:
- con: AINE y teofilina
  efecto: Disminución marcada del umbral convulsivo
  fuente:
    ref: CIMA-LEVOFLOXACINO
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Náuseas
  - Diarrea
  graves:
  - Tendinitis y rotura tendinosa
  - Prolongación del QT
  - Convulsiones
  vigilar:
  - ECG si hay riesgo de QT largo
  fuente:
    ref: CIMA-LEVOFLOXACINO
    detalle: 4.8; 4.4
alertas:
- Contraindicado en niños y adolescentes en crecimiento.
meta:
  discrepancias:
  - campo: fuente chilena / pediatría
    valores:
    - La guía de Iquique no incluye levofloxacino
    - 'CIMA: contraindicado en niños'
    - 'Pediamécum: 10 mg/kg cada 12–24 h'
    decision: Sin dosis pediátrica (se respeta la contraindicación de la ficha técnica).
