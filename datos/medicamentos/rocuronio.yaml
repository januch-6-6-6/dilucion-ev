interaccionesGraves:
- con: Anestésicos volátiles halogenados
  efecto: Potencian el bloqueo neuromuscular
  fuente:
    ref: CIMA-ROCURONIO
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Dolor en el sitio de inyección
  graves:
  - Anafilaxia
  - Bloqueo neuromuscular prolongado
  vigilar:
  - Ventilación asegurada
  - Tren de cuatro
  fuente:
    ref: CIMA-ROCURONIO
    detalle: '4.8'
alertas:
- Medicamento de alto riesgo.
- 'Paraliza la respiración: solo con vía aérea y ventilación aseguradas.'
- Incompatible en Y con varios fármacos (p. ej., cefazolina, dexametasona, diazepam, furosemida).
meta:
  discrepancias:
  - campo: tope pediátrico
    valores:
    - 'Urgencia UC: 1–1,2 mg/kg (≈ 84 mg con 1,2 mg/kg × 70 kg)'
    decision: 'Tope adulto de 84 mg fijado para el cálculo; confirmar. Revisión clínica (Héctor Salvo Agüero, TENS, 2026-10-02):
      tope = dosis de adulto en 70 kg aceptado; la app lo muestra como «calculado, no de fuente».'
