      detalle: 'Anexo 6, Ketoprofeno: 1 a 2 mg/ml'
  concentracionMax:
    valor: 2
    unidad: mg
    fuente:
      ref: PUCON-2022
      detalle: 'Anexo 6, Ketoprofeno: 1 a 2 mg/ml'
