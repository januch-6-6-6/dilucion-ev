    cantidad:
      valor: 100
      unidad: mg
    volumenFinalMl: 100
    fuente:
      ref: PUCON-2022
      detalle: 'Anexo 6, Ketoprofeno: habitual 100 mg/100 ml'
  - descripcion: 300 mg en 250 ml (1,2 mg/ml), infusión continua
    cantidad:
      valor: 300
      unidad: mg
    volumenFinalMl: 250
    fuente:
      ref: PUCON-2022
      detalle: 'Anexo 6, Ketoprofeno: 300 mg/250 ml'
administracion:
  vias:
  - infusion_intermitente
  - infusion_continua
  texto: 'Solo en infusión diluida: en bolo es muy venoirritante (flebitis y dolor).'
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Ketoprofeno: la administración directa en bolo puede provocar flebitis'
dosis:
- indicacion: Dosis diaria (en 2 dosis, intervalo mínimo 6 h)
  poblacion: adulto
  unidad: mg/24 h
  min: 100
  max: 200
  fuente:
    ref: CIMA-KETOPROFENO
    detalle: '4.2: 100–200 mg al día; máx. 200 mg/día'
sinDosisPediatrica: true
