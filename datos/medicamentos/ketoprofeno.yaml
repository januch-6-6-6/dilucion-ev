  cantidad:
    valor: 100
    unidad: mg
  volumenMl: 2
  fuente:
    ref: CIMA-KETOPROFENO
    detalle: 'Orudis 100 mg (ampolla de 2 ml; Pucón: ketoprofeno 100 mg FA)'
