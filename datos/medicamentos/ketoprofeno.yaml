    ref: CIMA-KETOPROFENO
    detalle: '4.2: 100–200 mg al día; máx. 200 mg/día'
sinDosisPediatrica: true
estabilidad:
  fuente:
    ref: PUCON-2022
    detalle: Anexo 6, Ketoprofeno (no informa estabilidad)
compatibilidad: []
interaccionesGraves:
- con: Otros AINE y salicilatos en dosis altas
  efecto: Mayor riesgo de úlcera y hemorragia digestiva
  fuente:
    ref: CIMA-KETOPROFENO
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Náuseas
  - Irritación gastrointestinal
  - Cefalea
  graves:
  - Hemorragia digestiva (melena, hematemesis)
  - Hematuria
  vigilar:
  - Signos de sangrado
  - Función renal
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Ketoprofeno: RAM'
alertas:
- 'En la ficha técnica española la ampolla de 100 mg es solo para uso intramuscular: verificar que la presentación local esté
  autorizada para vía EV.'
meta:
  discrepancias:
  - campo: vía
    valores:
    - 'Pucón: infusión EV intermitente y continua'
    - 'CIMA (Orudis): no debe administrarse por vía intravenosa'
    decision: Se registra la preparación EV de Pucón con alerta; la dosis diaria se cita de CIMA. REVISAR PRIMERO.
  - campo: dosis pediátrica
    valores:
    - 'CIMA: no usar en menores de 3 años; sin dosis pediátrica'
    decision: Sin dosis pediátrica.
