interaccionesGraves:
- con: Inhibidores del CYP2C9/2C19
  efecto: 'Aumento importante de la concentración de fenitoína: toxicidad'
  fuente:
    ref: CIMA-FENITOINA
    detalle: '4.5'
- con: Fármacos metabolizados por enzimas hepáticas
  efecto: 'Fenitoína es inductor potente: reduce sus niveles'
  fuente:
    ref: CIMA-FENITOINA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Mareo
  - Nistagmo
  - Cefalea
  graves:
  - Colapso cardiovascular y arritmias con administración rápida
  - Depresión del SNC
  - Necrosis por extravasación (síndrome del guante púrpura)
  vigilar:
  - ECG y PA durante la infusión
  - Sitio de punción
  fuente:
    ref: CIMA-FENITOINA
    detalle: '4.8'
alertas:
- Medicamento de alto riesgo.
- Diluir solo en SF. No superar 50 mg/min.
meta:
  discrepancias:
  - campo: tope pediátrico
    valores:
    - 'CIMA adulto: 18 mg/kg (≈1260 mg en 70 kg)'
    decision: 'Tope adulto de la carga pediátrica fijado en 1260 mg (18 mg/kg × 70 kg); confirmar en revisión. Revisión clínica
      (Héctor Salvo Agüero, TENS, 2026-10-02): tope = dosis de adulto en 70 kg aceptado; la app lo muestra como «calculado,
      no de fuente».'
