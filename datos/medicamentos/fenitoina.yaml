administracion:
  vias:
  - bolo
  - infusion_intermitente
  texto: Diluir solo en suero fisiológico (precipita con glucosa). Velocidad máxima 50 mg/min en adultos (25 mg/min o menos
    en adultos mayores) y 1–3 mg/kg/min en niños, con ECG y PA. Lavar con SF antes y después.
  fuente:
    ref: CIMA-FENITOINA
    detalle: 4.2 Forma de administración; 6.2
dosis:
- indicacion: 'Status epiléptico: carga (a ≤ 50 mg/min)'
  poblacion: adulto
  unidad: mg/kg
  min: 18
  max: 18
  fuente:
