interaccionesGraves:
- con: Anfotericina B
  efecto: Hipokalemia con riesgo de toxicidad
  fuente:
    ref: CIMA-METILPREDNISOLONA
    detalle: '4.5'
- con: Anticolinesterásicos (neostigmina)
  efecto: Antagonismo con depresión muscular; algunos casos requirieron ventilación
  fuente:
    ref: CIMA-METILPREDNISOLONA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Hiperglicemia
  - Retención de líquidos
  graves:
  - Hipokalemia
  - Úlcera digestiva
  - Arritmias con bolos rápidos de dosis altas
  vigilar:
  - Glicemia
  - Potasio
  - PA
  fuente:
    ref: CIMA-METILPREDNISOLONA
    detalle: '4.8'
alertas: []
meta:
  discrepancias:
  - campo: fuente chilena
    valores:
    - Protocolo Pucón 2022 no incluye metilprednisolona
    decision: 'Ficha basada en CIMA y Pediamécum; en Chile son habituales viales de 40, 125, 500 y 1000 mg: confirmar. Revisión
      clínica (Héctor Salvo Agüero, TENS, 2026-10-02): viales de 40, 125, 500 y 1000 mg confirmados; solo se registran 20
      y 40 mg porque no hay fuente para el volumen de reconstitución de los demás.'
