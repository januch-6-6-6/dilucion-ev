    reconstituida de inmediato.
  fuente:
    ref: CIMA-METILPREDNISOLONA
    detalle: 6.2; 6.3
dosis:
- indicacion: Situación con riesgo vital (shock anafiláctico, status asmático, edema cerebral)
  poblacion: adulto
  unidad: mg
  min: 250
  max: 500
  maximaAbsoluta: 1000
  fuente:
    ref: CIMA-METILPREDNISOLONA
    detalle: '4.2.1: 250–500 mg; riesgo vital 250–1000 mg'
- indicacion: Exacerbación aguda de asma
  poblacion: adulto
  unidad: mg/24 h
  min: 30
  max: 90
  fuente:
    ref: CIMA-METILPREDNISOLONA
    detalle: '4.2.1: 30–90 mg al día'
- indicacion: Situación con riesgo vital (niños)
  poblacion: pediatrico
  unidad: mg/kg
  min: 4
  max: 20
  topeAdulto:
    valor: 1
    unidad: g
  fuente:
    ref: CIMA-METILPREDNISOLONA
    detalle: '4.2.1: 4–20 mg/kg'
- indicacion: 'Status asmático (niños): dosis inicial'
  poblacion: pediatrico
  unidad: mg/kg
  min: 2
  max: 2
  topeAdulto:
    valor: 500
    unidad: mg
  fuente:
    ref: PEDIAMECUM-METILPREDNISOLONA
    detalle: IV 2 mg/kg/dosis; luego 0,5–1 mg/kg cada 6 h
