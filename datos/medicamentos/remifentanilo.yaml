interaccionesGraves:
- con: Benzodiazepinas y otros depresores del SNC
  efecto: Depresión respiratoria aditiva
  fuente:
    ref: CIMA-REMIFENTANILO
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Náuseas
  - Hipotensión
  - Bradicardia
  graves:
  - Depresión respiratoria y apnea
  - Rigidez muscular
  vigilar:
  - Ventilación
  - FC y PA
  fuente:
    ref: CIMA-REMIFENTANILO
    detalle: '4.8'
alertas:
- Medicamento de alto riesgo.
- 'Efecto muy corto: planificar la analgesia antes de suspender.'
meta:
  discrepancias:
  - campo: dosis pediátrica y presentación
    valores:
    - 'CIMA: vial de 1 mg; en Chile existen viales de 2 y 5 mg'
    - 'Pediamécum: pauta pediátrica según ficha técnica (1–12 años)'
    decision: Sin dosis pediátrica en esta versión; confirmar presentación local.
