  unidad: g/24 h
  min: 1
  max: 2
  maximaAbsoluta: 4
  fuente:
    ref: CIMA-CEFTRIAXONA
    detalle: '4.2.1: 1–2 g una vez al día; hasta 4 g'
- indicacion: Niños de 15 días a 12 años (< 50 kg), una vez al día
  poblacion: pediatrico
  unidad: mg/kg/24 h
  min: 50
  max: 100
  fuente:
    ref: CIMA-CEFTRIAXONA
    detalle: '4.2.1: 50–80 mg/kg; 80–100 mg/kg en meningitis (máx. 4 g)'
