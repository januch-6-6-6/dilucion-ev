interaccionesGraves:
- con: Soluciones con calcio (Ringer, Hartmann, gluconato de calcio)
  efecto: Precipitado de ceftriaxona-calcio; contraindicado en neonatos
  fuente:
    ref: CIMA-CEFTRIAXONA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Diarrea
  - Exantema
  - Flebitis en el sitio de infusión
  graves:
  - Anafilaxia
  - Colitis por Clostridioides difficile
  vigilar:
  - Signos de alergia en la primera dosis
  - Deposiciones
  fuente:
    ref: CIMA-CEFTRIAXONA
    detalle: 4.8; 4.4
alertas:
- 'Incompatible en Y según la guía de Iquique con: anfotericina B, aciclovir, amiodarona, fluconazol, gluconato de calcio,
  heparina, labetalol, linezolid, morfina, propofol, remifentanilo y vancomicina.'
- No administrar con soluciones que contengan calcio.
meta:
  discrepancias:
  - campo: concentración
    valores:
    - 'Iquique: bolo de 1 g en 10 ml (100 mg/ml)'
    - 'Pucón: reconstituir a 100 mg/ml y diluir a 10–40 mg/ml'
    decision: Se registra el bolo de Iquique; la concentración de infusión depende del protocolo local.
