    Preferir sin diluir; el PVC adsorbe diazepam.'
  fuente:
    ref: CIMA-DIAZEPAM
    detalle: 4.2; 6.2
dosis:
- indicacion: Estatus epiléptico (repetible cada 10–15 min)
