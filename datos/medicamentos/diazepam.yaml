  min: 0.15
  max: 0.25
  fuente:
    ref: CIMA-DIAZEPAM
    detalle: '4.2: 0,15–0,25 mg/kg; máx. 3 mg/kg en 24 h'
- indicacion: Ansiedad media/grave
  poblacion: adulto
  unidad: mg
  min: 2
  max: 10
  fuente:
    ref: CIMA-DIAZEPAM
    detalle: '4.2: 2–10 mg, repetible a las 3–4 h'
- indicacion: Crisis o estatus epiléptico, lactantes > 30 días y niños
