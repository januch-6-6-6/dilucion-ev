interaccionesGraves:
- con: Opioides y otros depresores del SNC
  efecto: Sedación profunda, depresión respiratoria, coma y muerte
  fuente:
    ref: CIMA-DIAZEPAM
    detalle: '4.4'
- con: Inhibidores del CYP3A4 y CYP2C19
  efecto: Aumentan el efecto del diazepam
  fuente:
    ref: CIMA-DIAZEPAM
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Somnolencia
  - Fatiga
  - Debilidad muscular
  graves:
  - Apnea con inyección rápida
  - Hipotensión
  - Depresión respiratoria
  vigilar:
  - Frecuencia respiratoria y SatO2
  - Nivel de conciencia
  fuente:
    ref: CIMA-DIAZEPAM
    detalle: '4.8'
alertas:
- Medicamento de alto riesgo.
- Tener flumazenilo y apoyo ventilatorio disponibles.
meta:
  discrepancias:
  - campo: fuente chilena
    valores:
    - Protocolo Pucón 2022 no incluye diazepam
    decision: Ficha basada en CIMA y Pediamécum.
