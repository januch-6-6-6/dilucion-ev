    detalle: '4.2.1: 0,3–4 mg/kg/h; no superar 4 mg/kg/h'
- indicacion: Inducción anestésica (> 8 años; 1 mes–3 años hasta 4 mg/kg)
  poblacion: pediatrico
  unidad: mg/kg
  min: 2.5
  max: 4
  topeAdulto:
    valor: 200
    unidad: mg
  fuente:
    ref: CIMA-PROPOFOL
    detalle: '4.2.1 Población pediátrica: 2,5 mg/kg (2,5–4 en menores)'
