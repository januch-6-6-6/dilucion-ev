interaccionesGraves:
- con: Depresores del SNC (opioides, benzodiazepinas)
  efecto: Depresión respiratoria y circulatoria aditiva
  fuente:
    ref: CIMA-PROPOFOL
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Hipotensión
  - Dolor en el sitio de inyección
  - Apnea transitoria
  graves:
  - Bradicardia
  - Síndrome de perfusión por propofol (> 4 mg/kg/h por más de 48 h)
  - Anafilaxia
  vigilar:
  - PA, FC, SatO2 y ventilación
  - Triglicéridos en uso prolongado
  fuente:
    ref: CIMA-PROPOFOL
    detalle: 4.8; 4.4
alertas:
- Medicamento de alto riesgo.
- Contraindicado para sedación en UCI en menores de 16 años.
- Desechar la emulsión sobrante.
meta:
  discrepancias:
  - campo: tope pediátrico
    valores:
    - 'CIMA adulto: 1,5–2,5 mg/kg (≈ 175 mg en 70 kg)'
    decision: Tope adulto de 200 mg fijado para el cálculo; confirmar.
