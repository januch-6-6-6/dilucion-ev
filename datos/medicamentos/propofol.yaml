administracion:
  vias:
  - bolo
  - infusion_continua
  texto: Agitar antes de usar. Inducción en bolo lento (≈ 40 mg cada 10 s) o perfusión; mantención por bomba. Preferir vena
    gruesa o CVC y máxima asepsia (emulsión lipídica). Solo la presentación al 1 % puede diluirse, y únicamente en SG5 %.
  requiereBomba: true
  fuente:
    ref: CIMA-PROPOFOL
    detalle: 4.2.1; 6.2
