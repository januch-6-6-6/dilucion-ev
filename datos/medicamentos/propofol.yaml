    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Hipotensión
  - Dolor en el sitio de inyección
  - Apnea transitoria
  graves:
  - Bradicardia
  - Síndrome de perfusión por propofol (> 4 mg/kg/h por más de 48 h)
  - Anafilaxia
  vigilar:
