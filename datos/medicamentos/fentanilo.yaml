interaccionesGraves:
- con: Benzodiacepinas, barbitúricos y otros depresores del SNC
  efecto: Depresión respiratoria, sedación profunda, coma
  fuente:
    ref: CIMA-FENTANILO
    detalle: '4.5'
- con: Fármacos serotoninérgicos (ISRS, IRSN, IMAO)
  efecto: Síndrome serotoninérgico
  fuente:
    ref: CIMA-FENTANILO
    detalle: '4.5'
- con: Inhibidores potentes del CYP3A4
  efecto: Aumentan el efecto y la depresión respiratoria
  fuente:
    ref: CIMA-FENTANILO
    detalle: '4.5'
efectosAdversos:
