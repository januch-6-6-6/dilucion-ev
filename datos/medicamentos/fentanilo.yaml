interaccionesGraves:
- con: Benzodiacepinas, barbitúricos y otros depresores del SNC
  efecto: Depresión respiratoria, sedación profunda, coma
  fuente:
    ref: CIMA-FENTANILO
    detalle: '4.5'
- con: Fármacos serotoninérgicos (ISRS, IRSN, IMAO)
  efecto: Síndrome serotoninérgico
  fuente:
    ref: CIMA-FENTANILO
    detalle: '4.5'
- con: Inhibidores potentes del CYP3A4
  efecto: Aumentan el efecto y la depresión respiratoria
  fuente:
    ref: CIMA-FENTANILO
    detalle: '4.5'
efectosAdversos:
  frecuentes: []
  graves:
  - Depresión respiratoria
  - Hipotensión
  - Bradicardia
  - Rigidez muscular
  vigilar:
  - Frecuencia respiratoria y SatO2
  - Presión arterial y frecuencia cardíaca
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Fentanilo: RAM'
alertas:
- Medicamento de alto riesgo.
- 'Antagonista: naloxona.'
- 'Cuidado con mcg y mg: 0,1 mg = 100 mcg.'
meta:
  discrepancias:
  - campo: dosis adulto en urgencia
    valores:
    - CIMA solo informa dosis en anestesia
    - 'Urgencia UC (2015): 2–3 µg/kg como premedicación en secuencia rápida de intubación'
    decision: 'Revisión clínica (Héctor Salvo Agüero, TENS, 2026-10-01): usar protocolos de Medicina de Urgencia UC o U. de
      Chile. Se agrega la dosis de intubación de Urgencia UC; la dosis de analgesia en adultos se toma, por decisión de Héctor,
      de una fuente extranjera (Hospital Universitario San Pedro, España, 2024: 0,5–1 mcg/kg) hasta obtener la serie «Sedación
      y analgesia en la unidad de emergencia» (Urgencia UC, 2013), que no está disponible en línea.'
