interaccionesGraves:
- con: Teofilina o aminofilina
  efecto: Disminución del umbral convulsivo
  fuente:
    ref: CIMA-KETAMINA
    detalle: '4.5'
- con: Hormonas tiroideas (terapia de reemplazo)
  efecto: Riesgo aumentado de hipertensión y taquicardia
  fuente:
    ref: CIMA-KETAMINA
    detalle: '4.4'
efectosAdversos:
  frecuentes:
  - Hipertensión
  - Taquicardia
  graves:
  - Hipotensión
  - Bradicardia
  - Aumento de la presión intracraneana
  vigilar:
  - Presión arterial y frecuencia cardíaca
  - Vía aérea y respiración
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Ketamina: RAM'
alertas:
- Medicamento de alto riesgo.
- Incompatible en Y con Ringer lactato.
meta:
  discrepancias:
  - campo: estabilidad de la dilución
    valores:
    - 'CIMA 6.3: usar inmediatamente'
    - 'CIMA 6.6: la solución 1 mg/ml es estable 24 h'
    decision: 'Se registra «usar inmediatamente» (criterio conservador). Revisión clínica (Héctor Salvo Agüero, TENS, 2026-10-02):
      criterio conservador aprobado.'
