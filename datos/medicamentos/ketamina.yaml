administracion:
  vias:
  - bolo
  - infusion_continua
  texto: Bolo IV lento, en al menos 60 s (más rápido puede causar depresión respiratoria). No mezclar en la misma jeringa
    con barbitúricos ni diazepam.
  tiempoMinimoMin: 1
  fuente:
    ref: CIMA-KETAMINA
    detalle: 4.2 y 6.2
dosis:
- indicacion: Inducción de anestesia general (media 2 mg/kg)
  poblacion: adulto
  unidad: mg/kg
  min: 1
  max: 4.5
  fuente:
    ref: CIMA-KETAMINA
    detalle: 4.2 Vía intravenosa
- indicacion: Inducción de anestesia (bolo)
  poblacion: pediatrico
  unidad: mg/kg
  min: 1
  max: 2
  fuente:
    ref: PEDIAMECUM-KETAMINA
    detalle: 'Inducción: bolo 1–2 mg/kg IV'
- indicacion: 'Sedación: infusión'
