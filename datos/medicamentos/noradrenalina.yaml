    detalle: '2.2: inicial 8–12 mcg/min; mantención 2–4 mcg/min'
- indicacion: Shock séptico
  poblacion: adulto
  unidad: mcg/kg/min
  max: 1
  fuente:
    ref: CIMA-NORADRENALINA
    detalle: '4.2: alrededor de 0,5 hasta un máximo de 1 mcg/kg/min'
- indicacion: Infusión pediátrica
