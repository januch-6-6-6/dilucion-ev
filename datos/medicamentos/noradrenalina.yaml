    cantidad:
      valor: 8
      unidad: mg
    volumenFinalMl: 200
    fuente:
      ref: PUCON-2022
      detalle: 'Anexo 6, Norepinefrina: 8 mg/200 ml'
  - descripcion: 16 mg en 100 ml (160 mcg/ml), restricción de volumen
    cantidad:
      valor: 16
      unidad: mg
    volumenFinalMl: 100
    fuente:
      ref: PUCON-2022
      detalle: 'Anexo 6, Norepinefrina: 16 mg/100 ml'
  - descripcion: 4 mg en 1.000 ml de SG5 % (4 mcg/ml)
    cantidad:
      valor: 4
      unidad: mg
    volumenFinalMl: 1000
    fuente:
      ref: FDA-NOREPINEFRINA
      detalle: 2.3 Preparation of diluted solution
administracion:
  vias:
  - infusion_continua
  texto: Infusión continua por bomba en vena de grueso calibre. Diluir en solución glucosada (la dextrosa reduce la oxidación);
    no se recomienda suero fisiológico solo. Controlar la PA cada 2 min hasta el efecto y luego cada 5 min. Retirar gradualmente.
  requiereBomba: true
  fuente:
    ref: FDA-NOREPINEFRINA
    detalle: 2.1–2.3
dosis:
- indicacion: Dosis inicial y mantención (adulto)
  poblacion: adulto
  unidad: mcg/min
  min: 2
  max: 12
  fuente:
