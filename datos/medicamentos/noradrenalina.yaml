- con: atropina
  estado: sin_datos
  fuente:
    ref: STABILIS-Y
    detalle: Sin datos de compatibilidad (casilla blanca)
- con: adrenalina
  estado: compatible
  fuente:
    ref: STABILIS-Y
    detalle: Compatibilidad física en Y (casilla verde)
- con: fentanilo
  estado: compatible
  fuente:
    ref: STABILIS-Y
    detalle: Compatibilidad física en Y (casilla verde)
- con: ketamina
  estado: compatible
  fuente:
    ref: STABILIS-Y
    detalle: Compatibilidad física en Y (casilla verde)
- con: sulfato-de-magnesio
  estado: incompatible
  fuente:
    ref: STABILIS-Y
    detalle: Incompatibilidad en Y (casilla roja)
- con: midazolam
  estado: compatible
  fuente:
    ref: STABILIS-Y
