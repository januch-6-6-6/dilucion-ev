interaccionesGraves:
- con: Anestésicos (ciclopropano, halotano)
  efecto: Arritmias; uso contraindicado
  fuente:
    ref: CIMA-NORADRENALINA
    detalle: '4.5'
- con: Antidepresivos tricíclicos o maprotilina
  efecto: Potenciación del efecto presor
  fuente:
    ref: CIMA-NORADRENALINA
    detalle: '4.5'
- con: Inhibidores de la monoaminooxidasa (IMAO)
  efecto: Riesgo de crisis hipertensiva
  fuente:
    ref: CIMA-NORADRENALINA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Cefalea
  - Ansiedad
  graves:
  - Hipertensión
  - Arritmia
  - Bradicardia o taquicardia
  - Dificultad respiratoria
  vigilar:
  - Presión arterial cada 2–5 min
  - Sitio de infusión
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Norepinefrina: RAM'
alertas:
- Medicamento de alto riesgo.
- Incompatible en Y con sulfato de magnesio.
meta:
  discrepancias:
  - campo: presentaciones / dosis
    valores:
    - CIMA expresa la dosis como noradrenalina base (1 mg de bitartrato = 0,5 mg de base)
    - 'FDA: ampolla 4 mg/4 ml = 4 mg de base'
    decision: Presentación 4 mg/4 ml confirmada en revisión clínica (Héctor Salvo Agüero, TENS, 2026-10-01). Se asume expresada
      como base; verificar el rotulado del producto local.
