id: noradrenalina
nombre: Noradrenalina (norepinefrina)
comerciales: []
grupo: vasoactivo
ambitos:
- samu
- urgencia
- upc
altoRiesgo: true
presentaciones:
- id: amp-4mg-4ml
  forma: ampolla
  cantidad:
    valor: 4
    unidad: mg
  volumenMl: 4
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Norepinefrina: 4 mg/4 ml'
reconstitucion: null
dilucion:
  sueros:
  - SG5
  concentracionMax:
    valor: 160
    unidad: mcg
    fuente:
      ref: PUCON-2022
      detalle: 'Anexo 6, Norepinefrina: en restricción de volumen hasta 160 mcg/ml'
  estandar:
  - descripcion: 4 mg en 100 ml (40 mcg/ml)
    cantidad:
      valor: 4
      unidad: mg
    volumenFinalMl: 100
    fuente:
      ref: PUCON-2022
      detalle: 'Anexo 6, Norepinefrina: habitual 4 mg/100 ml'
  - descripcion: 8 mg en 200 ml (40 mcg/ml)
    cantidad:
      valor: 8
      unidad: mg
    volumenFinalMl: 200
    fuente:
      ref: PUCON-2022
      detalle: 'Anexo 6, Norepinefrina: 8 mg/200 ml'
  - descripcion: 16 mg en 100 ml (160 mcg/ml), restricción de volumen
    cantidad:
      valor: 16
      unidad: mg
    volumenFinalMl: 100
    fuente:
      ref: PUCON-2022
      detalle: 'Anexo 6, Norepinefrina: 16 mg/100 ml'
  - descripcion: 4 mg en 1.000 ml de SG5 % (4 mcg/ml)
    cantidad:
      valor: 4
      unidad: mg
    volumenFinalMl: 1000
    fuente:
      ref: FDA-NOREPINEFRINA
      detalle: 2.3 Preparation of diluted solution
administracion:
  vias:
  - infusion_continua
  texto: Infusión continua por bomba en vena de grueso calibre. Diluir en solución glucosada (la dextrosa reduce la oxidación);
    no se recomienda suero fisiológico solo. Controlar la PA cada 2 min hasta el efecto y luego cada 5 min. Retirar gradualmente.
  requiereBomba: true
  fuente:
    ref: FDA-NOREPINEFRINA
    detalle: 2.1–2.3
dosis:
- indicacion: Dosis inicial y mantención (adulto)
  poblacion: adulto
  unidad: mcg/min
  min: 2
  max: 12
  fuente:
    ref: FDA-NOREPINEFRINA
    detalle: '2.2: inicial 8–12 mcg/min; mantención 2–4 mcg/min'
- indicacion: Shock séptico
  poblacion: adulto
  unidad: mcg/kg/min
  max: 1
  fuente:
    ref: CIMA-NORADRENALINA
    detalle: '4.2: alrededor de 0,5 hasta un máximo de 1 mcg/kg/min'
- indicacion: Infusión pediátrica
  poblacion: pediatrico
  unidad: mcg/kg/min
  min: 0.1
  max: 1
  fuente:
    ref: CIMA-NORADRENALINA
    detalle: 4.2 Población pediátrica
sinDosisPediatrica: false
estabilidad:
  fuente:
    ref: CIMA-NORADRENALINA
    detalle: '6.3: administrar inmediatamente tras la apertura'
