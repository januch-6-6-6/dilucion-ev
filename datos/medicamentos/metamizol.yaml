      unidad: g
    volumenFinalMl: 500
    fuente:
      ref: PUCON-2022
      detalle: 'Anexo 6, Metamizol: 1000 mg/500 ml'
administracion:
  vias:
  - infusion_intermitente
  - infusion_continua
  texto: 'Administrar muy lentamente: la causa más frecuente de hipotensión grave y shock es la velocidad de inyección excesiva.
    Tener disponible equipo para tratar el shock. No mezclar con otros fármacos en la misma jeringa.'
  fuente:
    ref: CIMA-METAMIZOL
    detalle: '4.2'
dosis:
- indicacion: Dolor o fiebre (≥ 15 años, > 53 kg), hasta 4 veces al día
  poblacion: adulto
  unidad: mg
  max: 1000
  maximaAbsoluta: 4000
  fuente:
    ref: CIMA-METAMIZOL
    detalle: '4.2: hasta 1000 mg por dosis; máx. 4000 mg/día'
- indicacion: Dolor o fiebre, niños hasta 14 años
  poblacion: pediatrico
  unidad: mg/kg
  min: 8
  max: 16
  topeAdulto:
    valor: 1
    unidad: g
  fuente:
    ref: CIMA-METAMIZOL
    detalle: '4.2: 8–16 mg/kg en dosis única'
