interaccionesGraves:
- con: Metotrexato y otros antineoplásicos
  efecto: Mayor toxicidad hematológica; evitar
  fuente:
    ref: CIMA-METAMIZOL
    detalle: '4.5'
- con: Clorpromazina
  efecto: Hipotermia grave
  fuente:
    ref: CIMA-METAMIZOL
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Hipotensión
  - Prurito
  - Sudoración
  graves:
  - Agranulocitosis
  - Shock anafiláctico
  - Hipotensión grave con inyección rápida
  vigilar:
  - PA durante la administración
  - Fiebre o dolor de garganta (agranulocitosis)
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Metamizol: RAM'
alertas:
- 'Administrar lento: riesgo de hipotensión grave.'
meta:
  discrepancias:
  - campo: presentación
    valores:
    - 'Pucón: ampolla de 1 g (sin volumen indicado)'
    - 'CIMA: 0,4 g/ml (ampolla de 2 g/5 ml)'
    decision: Se registra la de CIMA; verificar la ampolla disponible en Chile.
