alertas: []
meta:
  discrepancias:
  - campo: dilución
    valores:
    - 'Pucón: «dilución 0,04 mg/ml» y «40 mg/100 ml» (0,4 mg/ml)'
    - 'CIMA: 40 mg en 100 ml'
    decision: Se registra 40 mg en 100 ml; el «0,04 mg/ml» de Pucón parece un error de tipeo.
  - campo: dosis pediátrica
    valores:
    - 'CIMA: sin datos IV en niños'
    decision: Sin dosis pediátrica.
