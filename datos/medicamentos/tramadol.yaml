interaccionesGraves:
- con: IMAO
  efecto: Interacciones con riesgo vital (SNC, respiratorio, cardiovascular); contraindicado
  fuente:
    ref: CIMA-TRAMADOL
    detalle: '4.5'
- con: Depresores del SNC (benzodiazepinas, alcohol, otros opioides)
  efecto: Sedación y depresión respiratoria
  fuente:
    ref: CIMA-TRAMADOL
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Náuseas
  - Mareos
  - Somnolencia
  - Sudoración
  graves:
  - Depresión respiratoria
  - Convulsiones
  - Síndrome serotoninérgico
  vigilar:
  - Frecuencia respiratoria y sedación
  fuente:
    ref: CIMA-TRAMADOL
    detalle: '4.8'
alertas:
- Medicamento de alto riesgo.
- Contraindicado en menores de 3 años.
- Incompatible en la misma solución con diazepam, midazolam, diclofenaco y nitroglicerina.
