  texto: Diluir en 100 a 500 ml de suero. La perfusión debe mantenerse en general bajo 2 g/h, salvo torsade de pointes o eclampsia.
    La administración rápida puede causar hipotensión y asistolia.
  fuente:
    ref: CIMA-SULFATO-DE-MAGNESIO
    detalle: '4.2'
