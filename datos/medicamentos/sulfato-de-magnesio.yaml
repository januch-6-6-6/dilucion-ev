interaccionesGraves:
- con: Bloqueantes neuromusculares (suxametonio, vecuronio)
  efecto: Potencia y prolonga el bloqueo; riesgo de depresión respiratoria
  fuente:
    ref: CIMA-SULFATO-DE-MAGNESIO
    detalle: '4.5'
- con: Sales de calcio
  efecto: Efecto antagonista; no administrar juntas
  fuente:
    ref: CIMA-SULFATO-DE-MAGNESIO
    detalle: 4.4 y 4.5
efectosAdversos:
  frecuentes:
  - Rubor
  - Somnolencia
  - Diarrea
  graves:
  - Hipotensión y asistolia con administración rápida
  - Depresión del SNC
  vigilar:
  - Presión arterial
  - Reflejos osteotendíneos y frecuencia respiratoria
  - ECG en dosis altas
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Sulfato de magnesio: RAM'
alertas:
- La ampolla chilena es al 25 % (250 mg/ml); otras presentaciones son al 15 % o al 50 %.
- Incompatible en Y con noradrenalina.
