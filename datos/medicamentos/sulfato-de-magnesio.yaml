interaccionesGraves:
- con: Bloqueantes neuromusculares (suxametonio, vecuronio)
  efecto: Potencia y prolonga el bloqueo; riesgo de depresión respiratoria
  fuente:
    ref: CIMA-SULFATO-DE-MAGNESIO
    detalle: '4.5'
- con: Sales de calcio
  efecto: Efecto antagonista; no administrar juntas
  fuente:
