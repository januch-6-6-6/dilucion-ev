interaccionesGraves:
- con: Anticoagulantes, antiagregantes, fibrinolíticos, AINE
  efecto: 'Potencian el efecto: riesgo de hemorragia'
  fuente:
    ref: CIMA-HEPARINA
    detalle: '4.5'
efectosAdversos:
  frecuentes: []
  graves:
  - Hemorragias
  - Trombocitopenia inducida por heparina
  vigilar:
  - TTPA
  - Plaquetas
  - Signos de sangrado
  fuente:
    ref: CIMA-HEPARINA
    detalle: '4.8'
alertas:
- Medicamento de alto riesgo.
- 'Existen frascos de 1.000 y 5.000 UI/ml: verificar la concentración antes de cargar.'
meta:
  discrepancias:
  - campo: tope pediátrico y dilución
    valores:
    - 'CIMA: 80 UI/kg en bolo sin tope explícito'
    - 'Pediamécum (otras fuentes): 75 UI/kg y 20 UI/kg/h'
    - Dilución 25.000 UI/250 ml no está en las fuentes; es un ejemplo de 100 UI/ml
    decision: Tope del bolo pediátrico = bolo adulto fijo de 5.000 UI; confirmar dilución con el protocolo local.
