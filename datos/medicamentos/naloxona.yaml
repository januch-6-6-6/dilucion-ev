administracion:
  vias:
  - bolo
  - infusion_continua
  texto: 'Bolos IV repetibles cada 2 minutos hasta respiración y conciencia satisfactorias; perfusión si el opioide es de
    acción prolongada. Su efecto puede durar menos que el del opioide: vigilar la resedación.'
  fuente:
    ref: CIMA-NALOXONA
    detalle: 4.2.1
dosis:
- indicacion: 'Depresión respiratoria por opioides: bolo inicial (repetir 0,1 mg c/2 min)'
