  unidad: mg/kg
  min: 0.01
  max: 0.02
  topeAdulto:
    valor: 0.2
    unidad: mg
  fuente:
    ref: CIMA-NALOXONA
    detalle: '4.2.1 Población pediátrica: 0,01–0,02 mg/kg'
- indicacion: Intoxicación por opioides / reversión total (niños, pauta PALS)
  poblacion: pediatrico
  unidad: mg/kg
  min: 0.1
  max: 0.1
  topeAdulto:
    valor: 2
    unidad: mg
  fuente:
    ref: PEDIAMECUM-NALOXONA
    detalle: 'PALS: 0,1 mg/kg hasta 2 mg en reversión total'
