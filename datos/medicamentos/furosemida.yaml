interaccionesGraves:
- con: Aminoglucósidos y otros ototóxicos
  efecto: Ototoxicidad que puede ser irreversible
  fuente:
    ref: CIMA-FUROSEMIDA
    detalle: '4.5'
- con: Hidrato de cloral
  efecto: Rubor, sudoración, hipertensión y taquicardia
  fuente:
    ref: CIMA-FUROSEMIDA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Alteraciones electrolíticas
  - Deshidratación
  - Hipotensión
  graves:
  - Hipokalemia grave
  - Ototoxicidad (administración rápida)
  - Pancreatitis
  vigilar:
  - Diuresis
  - Potasio y sodio
  - PA
  fuente:
    ref: CIMA-FUROSEMIDA
    detalle: '4.8'
alertas:
- Velocidad máxima 4 mg/min.
meta:
  discrepancias:
  - campo: dosis pediátrica
    valores:
    - 'CIMA: máx. 1 mg/kg/día parenteral hasta 20 mg/día'
    - 'Pediamécum: IV inicial 0,1–2 mg/kg (máx. 40 mg)'
    decision: Se registra la pauta más conservadora (CIMA).
  - campo: presentación
    valores:
    - 'Pucón: «20 mg/ml»'
    - 'CIMA: ampolla 20 mg/2 ml (10 mg/ml)'
    decision: 'Se registra 20 mg/2 ml; verificar el rotulado de la ampolla local. Revisión clínica (Héctor Salvo Agüero, TENS,
      2026-10-02): ampolla de 20 mg/2 ml (10 mg/ml) confirmada.'
  - campo: suero
    valores:
    - 'Pediamécum: SF o SG5 %'
    - 'Stabilis: SG5 % incompatible en Y (casilla roja); CIMA 6.2: precipita con pH < 7'
    decision: 'Solo SF por criterio conservador. Revisión clínica (Héctor Salvo Agüero, TENS, 2026-10-02): criterio conservador
      aprobado.'
