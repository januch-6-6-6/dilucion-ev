administracion:
  vias:
  - bolo
  - infusion_intermitente
  texto: Inyección IV lenta (no más de 1 ml/min, es decir 100 mg/min). La inyección rápida puede causar hipotensión. No añadir
    a sangre para transfusión ni a soluciones con penicilina.
  fuente:
    ref: CIMA-ACIDO-TRANEXAMICO
    detalle: 4.2.1; 6.2
dosis:
- indicacion: Fibrinólisis general, cada 6–8 h (≈15 mg/kg)
  poblacion: adulto
  unidad: g
  min: 1
  max: 1
  fuente:
    ref: CIMA-ACIDO-TRANEXAMICO
    detalle: '4.2.1: 1 g IV lenta'
- indicacion: Niños > 1 año (cada 6–8 h)
  poblacion: pediatrico
  unidad: mg/kg
  min: 10
  max: 15
  topeAdulto:
    valor: 1
    unidad: g
  fuente:
    ref: PEDIAMECUM-ACIDO-TRANEXAMICO
    detalle: IV 10–15 mg/kg/dosis cada 6–8 h
