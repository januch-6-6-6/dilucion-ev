administracion:
  vias:
  - infusion_intermitente
  texto: 'Cada dosis en infusión IV de 10 a 20 minutos. La carga se divide: la mitad primero y el resto cada 4–8 h según respuesta.
    Reducir la dosis al menos 33 % al pasar de oral a IV.'
  tiempoMinimoMin: 10
  fuente:
    ref: CIMA-DIGOXINA
    detalle: '4.2'
