interaccionesGraves:
- con: Amiodarona y otros (quinidina, propafenona, espironolactona)
  efecto: 'Aumentan la digoxinemia: toxicidad'
  fuente:
    ref: CIMA-DIGOXINA
    detalle: '4.5'
- con: Calcio IV
  efecto: Arritmias sinérgicas
  fuente:
    ref: FDA-GLUCONATO-CALCIO
    detalle: '7.1'
efectosAdversos:
  frecuentes:
  - Náuseas
  - Anorexia
  graves:
  - Arritmias por toxicidad digitálica
  - Bloqueo AV
  - Alteraciones visuales
  vigilar:
  - FC y ECG
  - Potasio
  - Digoxinemia
  - Función renal
  fuente:
    ref: CIMA-DIGOXINA
    detalle: '4.8'
alertas:
- Medicamento de alto riesgo.
- La hipokalemia aumenta la toxicidad.
