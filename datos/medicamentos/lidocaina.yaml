  - infusion_continua
  texto: Bolo IV de 1–1,5 mg/kg a 25–50 mg/min, seguido de infusión continua de 1–4 mg/min con bomba y ECG continuo. Reducir
    la velocidad a la mitad tras 24 h (acumulación).
