estabilidad:
  fuente:
    ref: CIMA-LIDOCAINA
    detalle: '6.3: tras la dilución, usar inmediatamente'
compatibilidad: []
interaccionesGraves:
- con: Inhibidores de su metabolismo (p. ej., cimetidina)
  efecto: Concentraciones tóxicas con dosis altas repetidas
  fuente:
    ref: CIMA-LIDOCAINA
    detalle: '4.5'
- con: Otros antiarrítmicos de clase I
  efecto: Riesgo de efectos adversos cardíacos graves; evitar
  fuente:
    ref: CIMA-LIDOCAINA
    detalle: '4.5'
- con: Adrenalina o noradrenalina
  efecto: Potencian los efectos adversos cardíacos
  fuente:
    ref: CIMA-LIDOCAINA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Mareo
  - Somnolencia
  - Parestesias
  - Visión borrosa
  graves:
  - Convulsiones
  - Depresión respiratoria
  - Bradicardia y paro cardíaco
  - Metahemoglobinemia
  vigilar:
  - ECG continuo
  - Nivel de conciencia (signos de toxicidad)
  fuente:
    ref: FDA-LIDOCAINA-SG5
    detalle: Adverse reactions
alertas:
- Medicamento de alto riesgo.
- Usar solo la presentación sin adrenalina para vía EV.
meta:
  discrepancias:
  - campo: tope pediátrico del bolo
    valores:
    - 'Pediamécum: 1 mg/kg sin tope explícito'
    - 'FDA adulto: 1–1,5 mg/kg (≈100 mg en 70 kg)'
    decision: Se usa 100 mg como tope adulto del bolo pediátrico; confirmar en revisión.
