interaccionesGraves:
- con: Ciclosporina
  efecto: Mayor nefrotoxicidad y menor nivel de ciclosporina
  fuente:
    ref: CIMA-COTRIMOXAZOL
    detalle: '4.5'
- con: Antiarrítmicos (procainamida y otros)
  efecto: Prolongación del QT
  fuente:
    ref: CIMA-COTRIMOXAZOL
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Náuseas
  - Exantema
  graves:
  - Reacciones cutáneas graves (Stevens-Johnson)
  - Hiperkalemia
  - Discrasias sanguíneas
  vigilar:
  - Piel
  - Potasio
  - Hemograma
  fuente:
    ref: CIMA-COTRIMOXAZOL
    detalle: 4.8; 4.4
alertas:
- 'Incompatible en Y según la guía de Iquique con: fluconazol, linezolid y midazolam.'
- Dosis expresadas en trimetoprim (1 ampolla = 80 mg de trimetoprim + 400 mg de sulfametoxazol).
meta:
  discrepancias:
  - campo: presentación
    valores:
    - 'Iquique: ampolla 400/80 mg en 5 ml'
    - 'CIMA (Soltrim): vial 800/160 mg'
    decision: 'Presentación de Iquique; dosis de CIMA en trimetoprim. Revisión clínica (Héctor Salvo Agüero, TENS, 2026-10-02):
      ampolla de 400/80 mg en 5 ml confirmada.'
