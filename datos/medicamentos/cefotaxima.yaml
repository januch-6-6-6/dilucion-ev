  fuente:
    ref: IQUIQUE-2020
    detalle: Tiempo y detalles de administración
  tiempoMinimoMin: 3
dosis:
- indicacion: Por dosis, cada 12 h (cada 6–8 h en infecciones graves; máx. 12 g/día)
  poblacion: adulto
  unidad: g
  min: 1
  max: 2
  fuente:
    ref: CIMA-CEFOTAXIMA
    detalle: '4.2: 1–2 g cada 12 h; hasta 12 g/día'
- indicacion: Lactantes y niños < 12 años (en dosis cada 6–12 h)
  poblacion: pediatrico
  unidad: mg/kg/24 h
  min: 50
  max: 100
  maximaAbsoluta: 200
  fuente:
    ref: CIMA-CEFOTAXIMA
    detalle: '4.2: 50–100 mg/kg/día (hasta 150; 200 en riesgo vital)'
