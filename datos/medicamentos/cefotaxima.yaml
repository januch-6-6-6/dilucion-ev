interaccionesGraves:
- con: Antibióticos bacteriostáticos
  efecto: Antagonismo in vitro; no combinar
  fuente:
    ref: CIMA-CEFOTAXIMA
    detalle: '4.5'
- con: Probenecid
  efecto: Duplica aproximadamente la exposición a cefotaxima
  fuente:
    ref: CIMA-CEFOTAXIMA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Diarrea
  - Exantema
  - Flebitis en el sitio de infusión
  graves:
  - Anafilaxia
  - Colitis por Clostridioides difficile
  vigilar:
  - Signos de alergia en la primera dosis
  - Deposiciones
  fuente:
    ref: CIMA-CEFOTAXIMA
    detalle: 4.8; 4.4
alertas:
- 'Incompatible en Y según la guía de Iquique con: filgrastim, fluconazol, midazolam y vancomicina.'
