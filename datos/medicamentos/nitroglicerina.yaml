interaccionesGraves:
- con: Inhibidores de la fosfodiesterasa 5 (sildenafilo, tadalafilo, vardenafilo)
  efecto: Hipotensión grave; contraindicado
  fuente:
    ref: CIMA-NITROGLICERINA
    detalle: '4.5'
- con: Riociguat
  efecto: Potenciación del efecto hipotensor; contraindicado
  fuente:
    ref: CIMA-NITROGLICERINA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Cefalea
  - Rubor
  - Mareo
  graves:
  - Hipotensión
  - Taquicardia refleja
  - Metahemoglobinemia (dosis altas)
  vigilar:
  - PA y FC continuas
  fuente:
    ref: CIMA-NITROGLICERINA
    detalle: '4.8'
alertas:
- Usar envase de vidrio o polietileno y equipo sin PVC.
- Contraindicada con sildenafilo y similares.
meta:
  discrepancias:
  - campo: fuente chilena
    valores:
    - Protocolo Pucón 2022 no incluye nitroglicerina
    decision: Ficha basada en CIMA (y Pediamécum para niños); confirmar presentación disponible en Chile.
