administracion:
  vias:
  - bolo
  - infusion_intermitente
  texto: Bolo IV lento de al menos 3 minutos. Intervalo mínimo de 6 h entre dosis, aunque haya vómito. Precaución en niños
    y adultos mayores por reacciones extrapiramidales.
  tiempoMinimoMin: 3
  fuente:
    ref: CIMA-METOCLOPRAMIDA
    detalle: 4.2 Forma de administración
dosis:
- indicacion: Náuseas y vómitos (hasta 3 veces al día)
  poblacion: adulto
  unidad: mg
  min: 10
  max: 10
