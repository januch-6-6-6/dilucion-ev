  fuente:
    ref: CIMA-METOCLOPRAMIDA
    detalle: '4.2: 10 mg; máx. 30 mg/día'
- indicacion: Náuseas y vómitos, 1–18 años (hasta 3 veces al día)
  poblacion: pediatrico
  unidad: mg/kg
  min: 0.1
  max: 0.15
