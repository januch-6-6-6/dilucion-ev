interaccionesGraves:
- con: Levodopa y agonistas dopaminérgicos
  efecto: Antagonismo mutuo (contraindicado)
  fuente:
    ref: CIMA-METOCLOPRAMIDA
    detalle: '4.5'
- con: Depresores del SNC y alcohol
  efecto: Potenciación de la sedación
  fuente:
    ref: CIMA-METOCLOPRAMIDA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Somnolencia
  - Astenia
  graves:
  - Reacciones extrapiramidales
  - Síndrome neuroléptico maligno
  - Bradicardia o hipotensión con bolo rápido
  vigilar:
  - Movimientos anormales
  - PA
  fuente:
    ref: CIMA-METOCLOPRAMIDA
    detalle: '4.8'
alertas:
- Contraindicada en menores de 1 año.
- Incompatible con bicarbonato de sodio.
