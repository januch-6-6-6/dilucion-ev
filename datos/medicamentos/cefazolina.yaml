interaccionesGraves:
- con: Antibióticos bacteriostáticos (tetraciclinas, eritromicina, cloranfenicol)
  efecto: Posible antagonismo
  fuente:
    ref: CIMA-CEFAZOLINA
    detalle: '4.5'
- con: Probenecid
  efecto: Reduce el aclaramiento renal de cefazolina
  fuente:
    ref: CIMA-CEFAZOLINA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Diarrea
  - Exantema
  - Flebitis en el sitio de infusión
  graves:
  - Anafilaxia
  - Colitis por Clostridioides difficile
  vigilar:
  - Signos de alergia en la primera dosis
  - Deposiciones
  fuente:
    ref: CIMA-CEFAZOLINA
    detalle: 4.8; 4.4
alertas:
- 'Incompatible en Y según la guía de Iquique con: amiodarona, anfotericina B y vancomicina.'
