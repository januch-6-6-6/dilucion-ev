interaccionesGraves: []
efectosAdversos:
  frecuentes:
  - Exantema
  - Diarrea
  graves:
  - Anafilaxia
  - Colitis por Clostridioides difficile
  vigilar:
  - Signos de alergia
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Ampicilina: RAM'
alertas:
- 'Incompatible en Y según la guía de Iquique con: clindamicina, anfotericina B, ciprofloxacino, epinefrina, fluconazol, midazolam,
  ondansetrón, gluconato de calcio, vancomicina y aminoglucósidos.'
meta:
  discrepancias:
  - campo: fuente de dosis
    valores:
    - CIMA no tiene ficha técnica de ampicilina IV disponible
    - 'Pucón: bolo a 100 mg/ml'
    - 'Iquique: infusión de 10–15 min'
    decision: 'Dosis desde FDA; las dosis de adulto de FDA son bajas para infecciones graves: revisar con protocolo local.'
