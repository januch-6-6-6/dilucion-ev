    valor: 500
    unidad: mg
  volumenMl: 10
  fuente:
    ref: IQUIQUE-2020
    detalle: 'Ampicilina: FA 500 mg'
reconstitucion:
  diluyente: suero fisiológico
  volumenMl: 10
  fuente:
    ref: IQUIQUE-2020
    detalle: 'Reconstitución: 10 ml de suero fisiológico'
dilucion:
  sueros:
  - SF
  estandar:
  - descripcion: Hasta 1 g en 50 ml
    cantidad:
      valor: 1
      unidad: g
    volumenFinalMl: 50
    fuente:
      ref: IQUIQUE-2020
      detalle: 'Ampicilina: ≤ 1 g en 50 ml; > 1 g en 100 ml'
administracion:
  vias:
  - bolo
  - infusion_intermitente
  texto: Infusión intermitente de 10 a 15 minutos.
  fuente:
    ref: IQUIQUE-2020
    detalle: Tiempo y detalles de administración
dosis:
- indicacion: Infecciones respiratorias y de partes blandas (≥ 40 kg), cada 6 h
  poblacion: adulto
  unidad: mg
  min: 250
  max: 500
  fuente:
    ref: FDA-AMPICILINA
    detalle: 250–500 mg cada 6 h
- indicacion: Meningitis bacteriana (adultos y niños), en dosis cada 3–4 h
  poblacion: adulto
  unidad: mg/kg/24 h
  min: 150
  max: 200
  fuente:
    ref: FDA-AMPICILINA
    detalle: 150–200 mg/kg/día
- indicacion: Niños < 40 kg (cada 6–8 h)
  poblacion: pediatrico
  unidad: mg/kg/24 h
  min: 25
  max: 50
  fuente:
    ref: FDA-AMPICILINA
    detalle: 25–50 mg/kg/día
- indicacion: Meningitis bacteriana (niños), en dosis cada 3–4 h
  poblacion: pediatrico
  unidad: mg/kg/24 h
  min: 150
  max: 200
  fuente:
    ref: FDA-AMPICILINA
    detalle: 150–200 mg/kg/día
