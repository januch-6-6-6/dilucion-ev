  fuente:
    ref: CIMA-MORFINA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Constipación
  - Retención urinaria
  - Somnolencia
  - Náuseas y vómitos
  - Sudoración
  graves:
  - Depresión del SNC y respiratoria
  - Hipotensión
  vigilar:
  - Frecuencia respiratoria y SatO2
  - Nivel de sedación
  - Presión arterial
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Morfina: RAM e intoxicación'
alertas:
- Medicamento de alto riesgo.
- 'Antagonista: naloxona.'
