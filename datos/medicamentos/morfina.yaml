- con: Benzodiacepinas y otros sedantes
  efecto: Sedación profunda, depresión respiratoria, coma
  fuente:
    ref: CIMA-MORFINA
    detalle: '4.5'
- con: Alcohol
  efecto: Potenciación de la depresión del SNC
  fuente:
    ref: CIMA-MORFINA
    detalle: '4.5'
