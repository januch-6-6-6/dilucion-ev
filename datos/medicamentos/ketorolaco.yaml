interaccionesGraves:
- con: Otros AINE, incluida aspirina
  efecto: Mayor riesgo de úlcera y hemorragia digestiva; evitar
  fuente:
    ref: CIMA-KETOROLACO
    detalle: '4.5'
- con: Anticoagulantes
  efecto: Potencian el riesgo de sangrado
  fuente:
    ref: CIMA-KETOROLACO
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Náuseas
  - Dispepsia
  - Cefalea
  - Dolor en el sitio de inyección
  graves:
  - Úlcera, perforación o hemorragia digestiva
  - Insuficiencia renal aguda
  vigilar:
  - Signos de sangrado
  - Diuresis y función renal
  fuente:
    ref: CIMA-KETOROLACO
    detalle: '4.8'
alertas:
- Máximo 2 días por vía parenteral.
meta:
  discrepancias:
  - campo: dosis pediátrica
    valores:
    - 'CIMA: no recomendado en menores de 16 años'
    - 'Pediamécum: 0,5 mg/kg/dosis (máx. 30 mg), uso fuera de ficha técnica'
    decision: Se registra la pauta de Pediamécum indicada como fuera de ficha técnica; revisar si se mantiene.
