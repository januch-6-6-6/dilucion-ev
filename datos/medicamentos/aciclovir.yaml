    ref: IQUIQUE-2020
    detalle: Tiempo y detalles de administración
  tiempoMinimoMin: 60
dosis:
- indicacion: Herpes simple o varicela-zóster (inmunocompetente), cada 8 h
  poblacion: adulto
  unidad: mg/kg
  min: 5
  max: 5
  fuente:
    ref: CIMA-ACICLOVIR
    detalle: '4.2: 5 mg/kg cada 8 h'
- indicacion: Encefalitis herpética o zóster en inmunodeprimido, cada 8 h
