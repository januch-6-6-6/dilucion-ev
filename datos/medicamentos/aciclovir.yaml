    ref: CIMA-ACICLOVIR
    detalle: '4.2: 10 mg/kg cada 8 h'
- indicacion: Encefalitis herpética (3 meses–12 años), cada 8 h
  poblacion: pediatrico
  unidad: mg/kg
  min: 20
  max: 20
