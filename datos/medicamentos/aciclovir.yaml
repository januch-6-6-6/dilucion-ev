    detalle: '4.2: 10 mg/kg cada 8 h'
- indicacion: 'Niños < 12 años: herpes simple o varicela (inmunocompetente), cada 8 h'
  poblacion: pediatrico
  unidad: mg/kg
  min: 10
  max: 10
