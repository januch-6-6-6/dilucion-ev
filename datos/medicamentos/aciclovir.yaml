  - Hidratación y diuresis
  - Creatinina
  fuente:
    ref: CIMA-ACICLOVIR
    detalle: 4.8; 4.4
alertas:
- 'Incompatible en Y según la guía de Iquique con: cefepime, ceftriaxona, dobutamina, dopamina, gentamicina, meropenem, metoclopramida,
  morfina, ondansetrón y piperacilina-tazobactam.'
