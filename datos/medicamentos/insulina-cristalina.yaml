id: insulina-cristalina
nombre: Insulina cristalina (regular)
comerciales: []
grupo: metabolico
ambitos:
- samu
- urgencia
- upc
- hospitalizacion
altoRiesgo: true
presentaciones:
- id: fa-1000ui-10ml
  forma: frasco ampolla
  cantidad:
    valor: 1000
    unidad: UI
  volumenMl: 10
  fuente:
    ref: CIMA-INSULINA-CRISTALINA
    detalle: '2: vial de 10 ml con 100 UI/ml (Pucón Anexo 4: insulina cristalina 100 UI/ml FA)'
reconstitucion: null
dilucion:
  sueros:
  - SF
  - SG5
  concentracionMin:
    valor: 0.05
    unidad: UI
    fuente:
      ref: CIMA-INSULINA-CRISTALINA
      detalle: '4.2: 0,05 a 1,0 UI/ml'
  concentracionMax:
    valor: 1
    unidad: UI
    fuente:
      ref: CIMA-INSULINA-CRISTALINA
      detalle: '4.2: 0,05 a 1,0 UI/ml'
  estandar:
  - descripcion: 100 UI en 100 ml de SF (1 UI/ml)
    cantidad:
      valor: 100
      unidad: UI
    volumenFinalMl: 100
    fuente:
      ref: CIMA-INSULINA-CRISTALINA
      detalle: '4.2: concentraciones de 0,05 a 1,0 UI/ml en SF o SG'
administracion:
  vias:
  - bolo
  - infusion_continua
  texto: Vía IV solo por profesionales, con vial (no plumas), en bolsa de polipropileno y bomba de infusión, con control frecuente
    de glicemia y potasio. Antes de usar purgar el equipo (la insulina se adsorbe al plástico).
  requiereBomba: true
  fuente:
    ref: CIMA-INSULINA-CRISTALINA
    detalle: 4.2 Administración intravenosa
dosis:
- indicacion: Requerimiento total diario habitual (vía SC; referencia)
  poblacion: adulto
  unidad: UI/kg/24 h
  min: 0.3
  max: 1
  fuente:
    ref: CIMA-INSULINA-CRISTALINA
    detalle: '4.2: 0,3–1,0 UI/kg/día'
- indicacion: 'Cetoacidosis diabética: infusión de tasa fija'
  poblacion: adulto
  unidad: UI/kg/h
  min: 0.1
  max: 0.1
  fuente:
    ref: ADA-CRISIS-HIPERGLICEMICAS-2024
    detalle: 'Insulin therapy: fixed-rate intravenous insulin infusion started at 0.1 units/kg/h'
- indicacion: 'Cetoacidosis: al bajar la glicemia de 250 mg/dl (agregar dextrosa 5–10 %)'
  poblacion: adulto
  unidad: UI/kg/h
  min: 0.05
  max: 0.05
  fuente:
    ref: ADA-CRISIS-HIPERGLICEMICAS-2024
    detalle: reduce the insulin infusion rate to 0.05 units/kg/h
- indicacion: 'Hiperkalemia: 10 UI en 25 g de glucosa EV en 15–30 min (controlar glicemia)'
  poblacion: adulto
  unidad: UI
  min: 10
  max: 10
  fuente:
    ref: UKKA-HIPERKALEMIA-2026
    detalle: 10 units soluble insulin in 25 g glucose by intravenous infusion over 15–30 min
sinDosisPediatrica: true
estabilidad:
  ambienteH: 24
  fuente:
    ref: CIMA-INSULINA-CRISTALINA
    detalle: '4.2: diluida 0,05–1 UI/ml estable 24 h a temperatura ambiente'
