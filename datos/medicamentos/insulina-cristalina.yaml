interaccionesGraves:
- con: Betabloqueadores
  efecto: Pueden enmascarar los síntomas de hipoglicemia
  fuente:
    ref: CIMA-INSULINA-CRISTALINA
    detalle: '4.5'
- con: Glucocorticoides y tiazidas
  efecto: Aumentan las necesidades de insulina
  fuente:
    ref: CIMA-INSULINA-CRISTALINA
    detalle: '4.5'
efectosAdversos:
  frecuentes: []
  graves:
  - Hipoglicemia
  - Hipokalemia (vía IV)
  vigilar:
  - Glicemia capilar frecuente
  - Potasio
  fuente:
    ref: CIMA-INSULINA-CRISTALINA
    detalle: '4.8'
alertas:
- Medicamento de alto riesgo.
- Solo insulina cristalina (regular) por vía EV.
- Rotular siempre UI/ml de la dilución.
meta:
  discrepancias:
  - campo: dosis EV
    valores:
    - CIMA no indica dosis EV por indicación (cetoacidosis, hiperkalemia)
    decision: 'Sin dosis EV por indicación: seguir el protocolo local de la institución. Revisión clínica (Héctor Salvo Agüero,
      TENS, 2026-10-02): se agregan las dosis EV de cetoacidosis (ADA 2024) e hiperkalemia (UKKA 2026); fuentes extranjeras.'
