interaccionesGraves:
- con: Fármacos que pueden inducir torsade de pointes
  efecto: Prolongación del QT y torsade de pointes (contraindicado)
  fuente:
    ref: CIMA-AMIODARONA
    detalle: 4.3 y 4.5
- con: Digoxina
  efecto: Bradicardia y trastornos de conducción; aumenta digoxinemia
  fuente:
    ref: CIMA-AMIODARONA
    detalle: '4.5'
- con: Warfarina
  efecto: Potencia el efecto anticoagulante
  fuente:
    ref: CIMA-AMIODARONA
    detalle: '4.5'
- con: Betabloqueantes, verapamilo, diltiazem
  efecto: Bradicardia y trastornos de conducción
  fuente:
    ref: CIMA-AMIODARONA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Cefalea
  - Temblores
  - Fatiga
  graves:
  - Neuropatía periférica
  - Ataxia
  vigilar:
  - ECG y frecuencia cardíaca
  - Presión arterial
  - Sitio de infusión (extravasación)
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Amiodarona: RAM'
alertas:
- 'Diluir solo en SG5 %: incompatible con SF 0,9 % en Y.'
- Usar preferentemente equipos sin DEHP.
meta:
  discrepancias:
  - campo: dosis pediátrica
    valores:
    - 'CIMA: seguridad y eficacia no establecidas en pediatría'
    - 'Pediamécum: 5 mg/kg (máx. 300 mg) en TV sin pulso/FV'
    decision: Se registra la dosis de Pediamécum con la advertencia de CIMA.
