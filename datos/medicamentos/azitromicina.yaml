interaccionesGraves:
- con: Fármacos que prolongan el QT
  efecto: Prolongación del QT y torsade de pointes
  fuente:
    ref: CIMA-AZITROMICINA
    detalle: '4.4'
efectosAdversos:
  frecuentes:
  - Diarrea
  - Náuseas
  - Dolor en el sitio de infusión
  graves:
  - Prolongación del QT
  - Hepatotoxicidad
  vigilar:
  - ECG si hay riesgo de QT largo
  fuente:
    ref: CIMA-AZITROMICINA
    detalle: 4.8; 4.4
alertas:
- 'Incompatible en Y según la guía de Iquique con: amikacina, cefotaxima, ceftazidima, ceftriaxona, ciprofloxacino, clindamicina,
  cloxacilina, gentamicina, fentanilo, furosemida, imipenem, ketorolaco, morfina, piperacilina-tazobactam y potasio.'
meta:
  discrepancias:
  - campo: dosis pediátrica
    valores:
