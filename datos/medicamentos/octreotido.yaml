  fuente:
    ref: CIMA-OCTREOTIDO
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Dolor abdominal
  - Náuseas
  - Diarrea
  graves:
  - Bradicardia
  - Colelitiasis
  - Hiper o hipoglicemia
  vigilar:
  - FC
  - Glicemia
  fuente:
    ref: CIMA-OCTREOTIDO
    detalle: 4.8; 4.4
alertas: []
meta:
  discrepancias:
  - campo: indicación y fuente
    valores:
    - CIMA menciona la perfusión en varices solo como dato de tolerancia (no como indicación aprobada)
    - Pucón 2022 no incluye octreótido
    decision: Se registra con esa salvedad; confirmar protocolo local de hemorragia variceal.
