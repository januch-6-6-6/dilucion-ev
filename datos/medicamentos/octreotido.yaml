    detalle: 4.2; 4.4
dosis:
- indicacion: 'Varices esofágicas sangrantes (cirróticos): perfusión IV hasta 5 días'
  poblacion: adulto
  unidad: mcg/h
  max: 50
  fuente:
    ref: CIMA-OCTREOTIDO
    detalle: '4.4: bolo de 50 mcg seguido de 50 mcg/h; no superar 50 mcg/h'
sinDosisPediatrica: true
estabilidad:
  fuente:
    ref: CIMA-OCTREOTIDO
    detalle: 6.3 (no informa estabilidad de la dilución en este extracto)
compatibilidad: []
interaccionesGraves:
- con: Betabloqueadores, antagonistas del calcio, fármacos del balance hidroelectrolítico
