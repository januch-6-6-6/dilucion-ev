- hospitalizacion
altoRiesgo: false
presentaciones:
- id: amp-0.1mg-1ml
  forma: ampolla
  cantidad:
    valor: 0.1
    unidad: mg
  volumenMl: 1
  fuente:
    ref: CIMA-OCTREOTIDO
    detalle: '2: 0,1 mg/1 ml'
reconstitucion: null
dilucion:
  sueros:
