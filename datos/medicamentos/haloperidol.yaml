interaccionesGraves:
- con: Fármacos que prolongan el QT (antiarrítmicos IA y III, otros)
  efecto: 'Contraindicado: riesgo de arritmia'
  fuente:
    ref: CIMA-HALOPERIDOL
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Sedación
  - Reacciones extrapiramidales (distonía)
  graves:
  - Prolongación del QT y torsade de pointes
  - Síndrome neuroléptico maligno
  - Hipotensión
  vigilar:
  - ECG
  - Movimientos anormales
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Haloperidol: RAM'
alertas:
- 'Uso EV fuera de ficha técnica (en CIMA solo IM): riesgo de QT largo y torsade de pointes; monitorizar ECG.'
meta:
  discrepancias:
  - campo: vía
    valores:
    - 'Pucón: EV directa, intermitente y continua'
    - 'CIMA: solo intramuscular'
    decision: 'Se registra la preparación EV de Pucón con alerta; dosis de CIMA (IM). Revisión clínica (Héctor Salvo Agüero,
      TENS, 2026-10-02): se mantiene la vía EV de Pucón, con alerta de QT largo y monitorización ECG.'
