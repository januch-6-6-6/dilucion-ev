  poblacion: pediatrico
  unidad: mg/kg
  max: 0.02
  topeAdulto:
    valor: 0.6
    unidad: mg
  fuente:
    ref: CIMA-ATROPINA
    detalle: '4.2: 0,02 mg/kg dosis única, máx. 0,6 mg'
