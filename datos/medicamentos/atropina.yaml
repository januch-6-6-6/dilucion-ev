dosis:
- indicacion: Bradicardia sinusal (cada 2–5 min)
  poblacion: adulto
  unidad: mg
  min: 0.5
  max: 0.5
  fuente:
    ref: CIMA-ATROPINA
    detalle: '4.2'
- indicacion: Bloqueo AV (cada 3–5 min, máx. 3 mg)
  poblacion: adulto
  unidad: mg
  min: 0.5
  max: 0.5
  maximaAbsoluta: 3
  fuente:
    ref: CIMA-ATROPINA
    detalle: '4.2'
- indicacion: Intoxicación por organofosforados (repetir según signos)
  poblacion: adulto
  unidad: mg
  min: 0.5
  max: 2
  fuente:
    ref: CIMA-ATROPINA
    detalle: '4.2'
