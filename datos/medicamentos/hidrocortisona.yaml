meta:
  discrepancias:
  - campo: presentación y dosis adulto
    valores:
    - 'Pucón: frasco liofilizado de 100 mg (succinato)'
    - 'CIMA: Actocortina, hidrocortisona fosfato 373 mg'
    decision: 'Presentación de Pucón; la dosis adulta se cita de CIMA (otra sal). Revisar dosis según protocolo local (p.
      ej., 100 mg en crisis suprarrenal). Revisión clínica (Héctor Salvo Agüero, TENS, 2026-10-02): se reemplaza la dosis
      de la otra sal (CIMA) por la de succinato de FDA (Solu-Cortef), 100 mg EV en crisis suprarrenal.'
