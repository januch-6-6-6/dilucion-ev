interaccionesGraves:
- con: Relajantes musculares no despolarizantes y anestésicos inhalatorios
  efecto: Potencia el bloqueo neuromuscular
  fuente:
    ref: CIMA-CLINDAMICINA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Diarrea
  - Tromboflebitis
  graves:
  - Colitis por Clostridioides difficile
  - Hipotensión o arritmia con infusión rápida
  vigilar:
  - Deposiciones
  - Velocidad de infusión
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Clindamicina: RAM'
alertas:
- 'Incompatible en Y según la guía de Iquique con: aminofilina, ampicilina, fenobarbital, fenitoína, fluconazol y gluconato
  de calcio.'
