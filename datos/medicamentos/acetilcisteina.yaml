  unidad: mg/kg
  min: 50
  max: 50
  fuente:
    ref: CIMA-ACETILCISTEINA
    detalle: '4.2: 50 mg/kg en 500 ml'
- indicacion: 3.ª perfusión (16 h)
  poblacion: adulto
  unidad: mg/kg
  min: 100
