administracion:
  vias:
  - infusion_intermitente
  texto: 'Tres perfusiones consecutivas sin descanso: 150 mg/kg en 200 ml en 1 h; 50 mg/kg en 500 ml en 4 h; 100 mg/kg en
    1 L en 16 h. Preferir SG5 %. Iniciar idealmente dentro de 8 h de la ingesta de paracetamol.'
  requiereBomba: true
  fuente:
    ref: CIMA-ACETILCISTEINA
    detalle: '4.2'
