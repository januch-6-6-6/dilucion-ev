interaccionesGraves:
- con: Nitroglicerina
  efecto: Hipotensión significativa y vasodilatación
  fuente:
    ref: CIMA-ACETILCISTEINA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Náuseas
  - Vómitos
  - Rubor
  graves:
  - Reacciones anafilactoides (sobre todo en la 1.ª perfusión)
  - Broncoespasmo
  vigilar:
  - Signos de reacción durante la 1.ª hora
  fuente:
    ref: CIMA-ACETILCISTEINA
    detalle: 4.8; 4.4
alertas: []
meta:
  discrepancias:
  - campo: pediatría
    valores:
    - CIMA indica las mismas dosis por kg en niños con volúmenes menores (tabla por peso)
    decision: 'Sin dosis pediátrica separada en esta versión: usar la tabla por peso de la ficha técnica.'
  - campo: fuente chilena
    valores:
    - Pucón 2022 no incluye acetilcisteína
    decision: Ficha basada en CIMA (Hidonac antídoto).
