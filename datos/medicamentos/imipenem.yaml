  unidad: mg
  min: 500
  max: 1000
  fuente:
    ref: CIMA-IMIPENEM
    detalle: '4.2'
- indicacion: Niños ≥ 1 año, cada 6 h
  poblacion: pediatrico
  unidad: mg/kg
  min: 15
  max: 25
  topeAdulto:
