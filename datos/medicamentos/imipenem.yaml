  fuente:
    ref: CIMA-IMIPENEM
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Diarrea
  - Exantema
  - Flebitis en el sitio de infusión
  graves:
  - Anafilaxia
  - Colitis por Clostridioides difficile
  vigilar:
  - Signos de alergia en la primera dosis
  - Deposiciones
  fuente:
    ref: CIMA-IMIPENEM
    detalle: 4.8; 4.4
alertas:
- 'Incompatible en Y según la guía de Iquique con: anfotericina B, amiodarona, bicarbonato de sodio, fluconazol, lorazepam,
  midazolam y milrinona.'
