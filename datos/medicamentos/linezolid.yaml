interaccionesGraves:
- con: IMAO y fármacos serotoninérgicos o adrenérgicos
  efecto: 'Linezolid es IMAO: síndrome serotoninérgico o crisis hipertensiva'
  fuente:
    ref: CIMA-LINEZOLID
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Diarrea
  - Cefalea
  - Náuseas
  graves:
  - Mielosupresión (uso > 2 semanas)
  - Neuropatía óptica y periférica
  - Acidosis láctica
  vigilar:
  - Hemograma semanal
  fuente:
    ref: CIMA-LINEZOLID
    detalle: 4.8; 4.4
alertas:
- 'Incompatible en Y según la guía de Iquique con: anfotericina B, clorpromazina, diazepam, fenitoína y cotrimoxazol.'
meta:
  discrepancias:
  - campo: dosis pediátrica
    valores:
    - 'CIMA: no establecida en menores de 18 años'
    - 'Pediamécum: 10 mg/kg cada 8 h'
    decision: 'Se registra la de Pediamécum. Revisión clínica (Héctor Salvo Agüero, TENS, 2026-10-02): se acepta la pauta
      de Pediamécum con la advertencia de la ficha técnica visible.'
