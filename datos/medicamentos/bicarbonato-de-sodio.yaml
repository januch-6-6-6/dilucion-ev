altoRiesgo: false
presentaciones:
- id: amp-10meq-10ml
  forma: ampolla 8,4 % (1 M)
  cantidad:
    valor: 10
    unidad: mEq
  volumenMl: 10
  fuente:
    ref: CIMA-BICARBONATO-DE-SODIO
    detalle: '2: 840 mg = 10 mmol (10 mEq) por ampolla de 10 ml'
reconstitucion: null
dilucion:
  sueros:
  - SG5
  - SF
