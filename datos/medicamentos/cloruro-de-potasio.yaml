interaccionesGraves:
- con: Digitálicos
  efecto: Guiar la terapia con ECG seriados
  fuente:
    ref: FDA-POTASIO
    detalle: Precautions
efectosAdversos:
  frecuentes:
  - Dolor o flebitis en el sitio de infusión
  graves:
  - Hiperkalemia
  - Arritmias y paro cardíaco con infusión rápida o sin diluir
  vigilar:
  - ECG
  - Potasio sérico
  - Diuresis
  - Sitio de infusión
  fuente:
    ref: FDA-POTASIO
    detalle: Adverse reactions
alertas:
- Medicamento de alto riesgo.
- NUNCA en bolo. Diluir siempre y agitar la mezcla.
- Máximo 40 mEq/L por vía periférica y 80 mEq/L por vía central.
meta:
  discrepancias:
  - campo: dosis pediátrica
    valores:
    - Pucón y FDA no indican dosis pediátrica
    decision: 'Sin dosis pediátrica: usar el protocolo pediátrico local. Revisión clínica (Héctor Salvo Agüero, TENS, 2026-10-02):
      la búsqueda no encontró fuente citable (FDA: no usar en niños); sigue «protocolo local».'
