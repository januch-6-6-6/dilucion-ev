interaccionesGraves:
- con: Antibióticos bacteriostáticos
  efecto: Antagonizan su acción bactericida
  fuente:
    ref: CIMA-CLOXACILINA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Diarrea
  - Exantema
  - Flebitis en el sitio de infusión
  graves:
  - Anafilaxia
  - Colitis por Clostridioides difficile
  vigilar:
  - Signos de alergia en la primera dosis
  - Deposiciones
  fuente:
    ref: CIMA-CLOXACILINA
    detalle: 4.8; 4.4
alertas:
- 'Incompatible en Y según la guía de Iquique con: gentamicina y amikacina.'
meta:
  discrepancias:
  - campo: reconstitución
    valores:
    - 'Iquique: 10 ml de SF (50 mg/ml)'
    - 'Pucón: 100 mg/ml'
    decision: Se registra la de Iquique.
