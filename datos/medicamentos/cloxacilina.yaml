    valor: 50
    unidad: mg
    fuente:
      ref: PUCON-2022
      detalle: 'Anexo 6, Cloxacilina: dilución 10–50 mg/ml'
administracion:
  vias:
  - bolo
  - infusion_intermitente
  texto: Infusión intermitente de 30 a 60 minutos (CIMA permite IV directa lenta de 3–4 min).
  fuente:
    ref: IQUIQUE-2020
    detalle: Tiempo y detalles de administración
dosis:
- indicacion: Cada 6–8 h
  poblacion: adulto
  unidad: mg
  min: 500
  max: 1000
  fuente:
    ref: CIMA-CLOXACILINA
    detalle: '4.2: 500 mg–1 g cada 6–8 h'
- indicacion: Niños > 2 años, cada 6–8 h
  poblacion: pediatrico
  unidad: mg/kg
  min: 12.5
  max: 25
  topeAdulto:
    valor: 1
    unidad: g
  fuente:
    ref: CIMA-CLOXACILINA
    detalle: '4.2: 12,5–25 mg/kg'
sinDosisPediatrica: false
estabilidad:
