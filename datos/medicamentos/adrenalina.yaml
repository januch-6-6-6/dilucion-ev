interaccionesGraves:
- con: Anestésicos halogenados volátiles
  efecto: Arritmia ventricular grave
  fuente:
    ref: CIMA-ADRENALINA
    detalle: '4.5'
- con: Antidepresivos tipo imipramina (tricíclicos)
  efecto: Hipertensión arterial paroxística
  fuente:
