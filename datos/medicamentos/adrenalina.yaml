administracion:
  vias:
  - bolo
  - infusion_continua
  texto: Bolo IV/IO en paro; infusión continua diluida en solución glucosada, en vena de grueso calibre. La FDA no recomienda
    diluir solo en suero fisiológico (pérdida de potencia por oxidación).
  fuente:
    ref: FDA-EPINEFRINA
    detalle: 2.2 Hypotension associated with septic shock
dosis:
