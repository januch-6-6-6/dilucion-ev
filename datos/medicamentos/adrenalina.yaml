    detalle: '4.5'
efectosAdversos:
  frecuentes: []
  graves:
  - Hemorragia cerebrovascular y arritmias con administración rápida
  - Necrosis por extravasación
  vigilar:
  - Monitorización continua
  - Sitio de infusión (extravasación)
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Adrenalina: precauciones y RAM'
alertas:
- Medicamento de alto riesgo.
- No confundir la ampolla 1 mg/ml (1:1.000) con la dilución 0,1 mg/ml (1:10.000).
meta:
  discrepancias: []
