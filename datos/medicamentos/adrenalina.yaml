  poblacion: adulto
  unidad: mcg
  min: 50
  max: 50
  fuente:
    ref: CIMA-ADRENALINA
    detalle: '4.2 Anafilaxia aguda: bolos de 0,05 mg'
- indicacion: Hipotensión en shock séptico (infusión)
  poblacion: adulto
  unidad: mcg/kg/min
  min: 0.05
  max: 2
  fuente:
    ref: FDA-EPINEFRINA
    detalle: '2.2: 0.05 to 2 mcg/kg/min'
- indicacion: Paro cardíaco (> 5 kg), cada 3–5 min
  poblacion: pediatrico
  unidad: mcg/kg
  max: 10
