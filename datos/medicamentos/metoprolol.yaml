interaccionesGraves:
- con: Verapamilo IV
  efecto: No administrar a pacientes con betabloqueadores
  fuente:
    ref: CIMA-METOPROLOL
    detalle: '4.4'
- con: Inhibidores del CYP2D6
  efecto: Aumentan el nivel de metoprolol
  fuente:
    ref: CIMA-METOPROLOL
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Fatiga
  - Mareo
  - Bradicardia
  graves:
  - Bradicardia grave y bloqueo AV
  - Hipotensión
  - Broncoespasmo
  vigilar:
  - FC y PA
  fuente:
    ref: CIMA-METOPROLOL
    detalle: '4.8'
alertas: []
meta:
  discrepancias:
  - campo: presentación y pediatría
    valores:
    - 'CIMA: 1 mg/ml (volumen de ampolla no confirmado en el extracto)'
    - Pediamécum solo tiene pautas orales
    decision: 'Se registra ampolla de 5 ml (5 mg); sin dosis pediátrica IV. Revisión clínica (Héctor Salvo Agüero, TENS, 2026-10-02):
      ampolla de 5 mg/5 ml NO confirmada: verificar el rotulado local.'
