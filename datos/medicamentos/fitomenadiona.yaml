interaccionesGraves:
- con: Anticoagulantes cumarínicos (acenocumarol, warfarina)
  efecto: Antagoniza su efecto
  fuente:
    ref: CIMA-FITOMENADIONA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Dolor en el sitio de inyección
  graves:
  - Reacciones anafilactoides con la vía IV
  - Hipotensión
  vigilar:
  - PA durante la administración
  fuente:
    ref: PUCON-2022
    detalle: 'Anexo 6, Fitomenadiona: RAM'
alertas:
- En neonatos y menores de 1 año usar la presentación pediátrica de 2 mg/0,2 ml.
