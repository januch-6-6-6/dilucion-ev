  fuente:
    ref: CIMA-FITOMENADIONA
    detalle: '4.2'
dosis:
- indicacion: Hemorragia grave con anticoagulante cumarínico (con PFC o CCP)
  poblacion: adulto
  unidad: mg
  min: 5
  max: 10
  fuente:
    ref: CIMA-FITOMENADIONA
    detalle: '4.2: 5–10 mg IV lenta'
- indicacion: INR 5–9 sin hemorragia grave (warfarina)
  poblacion: adulto
  unidad: mg
  min: 0.5
  max: 1
  fuente:
    ref: CIMA-FITOMENADIONA
    detalle: '4.2 tabla: 0,5–1 mg IV'
