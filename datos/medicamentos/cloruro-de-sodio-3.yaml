meta:
  discrepancias:
  - campo: fuente chilena y preparación
    valores:
    - No se encontró fuente chilena para NaCl 3 %
    - En Chile suele prepararse a partir de NaCl 10 %; no hay receta citable
    decision: 'Ficha con la presentación comercial de FDA; sin dosis ni receta de preparación. Revisión clínica (Héctor Salvo
      Agüero, TENS, 2026-10-02): la búsqueda no encontró una fuente chilena citable; sigue sin dosis.'
