interaccionesGraves:
- con: Fármacos que prolongan el QT
  efecto: Prolongación aditiva del QT
  fuente:
    ref: CIMA-CIPROFLOXACINO
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Náuseas
  - Diarrea
  graves:
  - Tendinitis y rotura tendinosa
  - Prolongación del QT
  - Convulsiones
  vigilar:
  - ECG si hay riesgo de QT largo
  fuente:
    ref: CIMA-CIPROFLOXACINO
    detalle: 4.8; 4.4
alertas:
- 'Incompatible en Y según la guía de Iquique con: aminofilina, ampicilina, bicarbonato de sodio, cefepime, dexametasona,
  fenitoína, furosemida, heparina, hidrocortisona, metilprednisolona, propofol, clindamicina, sulfato de magnesio y vancomicina.'
