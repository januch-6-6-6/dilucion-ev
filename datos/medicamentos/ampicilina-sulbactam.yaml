  diluyente: suero fisiológico
  volumenMl: 10
  fuente:
    ref: IQUIQUE-2020
    detalle: 'Reconstitución: 10 ml de suero fisiológico'
dilucion:
  sueros:
  - SF
  estandar:
  - descripcion: 1,5 g en 100 ml
    cantidad:
      valor: 1.5
      unidad: g
    volumenFinalMl: 100
    fuente:
      ref: IQUIQUE-2020
      detalle: 'Ampicilina/sulbactam: 1 g/0,5 g en 100 ml'
administracion:
  vias:
  - infusion_intermitente
  texto: Infusión intermitente de 15 a 30 minutos.
  fuente:
    ref: IQUIQUE-2020
    detalle: Tiempo y detalles de administración
dosis:
- indicacion: Cada 6 h (dosis total ampicilina + sulbactam; sulbactam máx. 4 g/día)
  poblacion: adulto
  unidad: g
  min: 1.5
  max: 3
  fuente:
    ref: FDA-UNASYN
    detalle: 1,5–3 g cada 6 h
- indicacion: Niños ≥ 1 año (en 4 dosis; total ampicilina + sulbactam)
  poblacion: pediatrico
  unidad: mg/kg/24 h
  min: 300
  max: 300
  fuente:
    ref: FDA-UNASYN
    detalle: 300 mg/kg/día
sinDosisPediatrica: false
estabilidad:
