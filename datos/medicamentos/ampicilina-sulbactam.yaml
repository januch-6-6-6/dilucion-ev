interaccionesGraves:
- con: Aminoglucósidos
  efecto: 'Inactivación in vitro: no reconstituir ni mezclar juntos'
  fuente:
    ref: FDA-UNASYN
    detalle: Drug interactions
- con: Alopurinol
  efecto: Aumenta la incidencia de exantema
  fuente:
    ref: FDA-UNASYN
    detalle: Drug interactions
efectosAdversos:
  frecuentes:
  - Dolor en el sitio de inyección
  - Diarrea
  - Exantema
  graves:
  - Anafilaxia
  - Colitis por Clostridioides difficile
  vigilar:
  - Signos de alergia
  fuente:
    ref: FDA-UNASYN
    detalle: Adverse reactions
alertas:
- 'Incompatible en Y según la guía de Iquique con: clindamicina, anfotericina B, ciprofloxacino, epinefrina, fluconazol, midazolam,
  ondansetrón, gluconato de calcio, vancomicina y aminoglucósidos.'
meta:
  discrepancias:
  - campo: fuente
    valores:
    - No hay ficha técnica en CIMA (no comercializado en España)
    decision: Dosis desde FDA (Unasyn).
