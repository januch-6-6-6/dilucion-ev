  unidad: g
  min: 1
  max: 2
  fuente:
    ref: CIMA-CEFTAZIDIMA
    detalle: '4.2 Tabla 1: 1–2 g cada 8 h'
- indicacion: Lactantes > 2 meses y niños < 40 kg (en 3 dosis)
  poblacion: pediatrico
  unidad: mg/kg/24 h
  min: 100
  max: 150
