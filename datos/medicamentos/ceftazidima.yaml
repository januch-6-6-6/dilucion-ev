interaccionesGraves:
- con: Medicamentos nefrotóxicos en dosis altas
  efecto: Puede empeorar la función renal
  fuente:
    ref: CIMA-CEFTAZIDIMA
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Diarrea
  - Exantema
  - Flebitis en el sitio de infusión
  graves:
  - Anafilaxia
  - Colitis por Clostridioides difficile
  vigilar:
  - Signos de alergia en la primera dosis
  - Deposiciones
  fuente:
    ref: CIMA-CEFTAZIDIMA
    detalle: 4.8; 4.4
alertas:
- 'Incompatible en Y según la guía de Iquique con: amiodarona, aminofilina, bicarbonato de sodio, anfotericina B, dobutamina,
  fluconazol, midazolam, propofol y vancomicina.'
