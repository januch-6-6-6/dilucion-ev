interaccionesGraves:
- con: Relajantes musculares no despolarizantes (vecuronio)
  efecto: Prolongación del bloqueo neuromuscular
  fuente:
    ref: CIMA-PIPERACILINA-TAZOBACTAM
    detalle: '4.5'
efectosAdversos:
  frecuentes:
  - Diarrea
  - Exantema
  - Flebitis en el sitio de infusión
  graves:
  - Anafilaxia
  - Colitis por Clostridioides difficile
  vigilar:
  - Signos de alergia en la primera dosis
  - Deposiciones
  fuente:
    ref: CIMA-PIPERACILINA-TAZOBACTAM
    detalle: 4.8; 4.4
alertas:
- 'Incompatible en Y según la guía de Iquique con: bicarbonato de sodio, amikacina, aciclovir, amiodarona, anfotericina B,
  dobutamina, fluconazol, gentamicina, haloperidol, ondansetrón y vancomicina.'
