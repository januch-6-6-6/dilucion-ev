dosis:
- indicacion: Cada 8 h (cada 6 h en neumonía grave o neutropenia febril)
  poblacion: adulto
  unidad: g
  min: 4.5
  max: 4.5
  fuente:
    ref: CIMA-PIPERACILINA-TAZOBACTAM
    detalle: '4.2: 4 g/0,5 g'
- indicacion: Niños 2–12 años, cada 8 h (dosis total 100 mg + 12,5 mg por kg)
  poblacion: pediatrico
  unidad: mg/kg
  min: 112.5
  max: 112.5
  topeAdulto:
    valor: 4.5
    unidad: g
  fuente:
    ref: CIMA-PIPERACILINA-TAZOBACTAM
    detalle: '4.2 Población pediátrica: 100 mg de piperacilina/12,5 mg de tazobactam por kg'
