  estado: sin_datos
  motivo: Las fuentes consultadas no traen una pauta pediátrica de bloqueos oculares.
conservacion: []
contraindicaciones:
- Hipersensibilidad a la bupivacaína o a otros anestésicos locales de tipo amida (CIMA 4.3).
alertas:
- 'La administración retrobulbar puede alcanzar de forma ocasional el espacio subaracnoideo y causar ceguera temporal, colapso
  cardiovascular, apnea y convulsiones: hay que diagnosticarlo y tratarlo rápido (CIMA 4.4).'
- 'Anestesia del tronco cerebral con bloqueos retrobulbar, peribulbar y subtenoniano: los síntomas aparecen dentro de 10 minutos
  (RCoA/RCOphth 2012).'
- 'Todos los anestésicos locales son miotóxicos: evitar inyectarlos dentro de un músculo (RCoA/RCOphth 2012).'
- Agujas finas y cortas, no más de 25 G ni de 25 mm (RCoA/RCOphth 2012). La guía RCoA/RCOphth 2012 no trae dosis.
discrepancias:
- campo: Concentración de la bupivacaína en la mezcla con lidocaína
  valores:
  - fuente: WEB-OFT-BLOQUEOS-EYEWIKI.ORG/RETROBULBAR
    valor: 0,75 % (retrobulbar)
  - fuente: WEB-OFT-BLOQUEOS-EYEWIKI.ORG/SUB-TENON
    valor: 0,5 o 0,75 % (subtenoniana)
  mostrado: 0,5 o 0,75 % según la técnica
  motivo: EyeWiki da 0,75 % para el bloqueo retrobulbar y 0,5 o 0,75 % para el subtenoniano; la ficha técnica usa la de 5
    mg/ml (0,5 %).
