alertas:
- La dosis y el tiempo de aplicación los define el cirujano; esta ficha solo muestra lo que publican las fuentes.
- 'ALTO RIESGO: una concentración o un tiempo de aplicación mal calculados dañan el tejido ocular. No hay una guía de sociedad
  que fije la concentración oficial (nota de la búsqueda).'
- En trabeculectomía reduce el riesgo relativo de fracaso (RR 0,32 en ojos de alto riesgo; 0,29 en primera cirugía) sin aumento
  significativo de complicaciones permanentes que amenacen la visión (Cochrane).
discrepancias:
- campo: Concentración de mitomicina C en esponja para trabeculectomía
  valores:
  - fuente: WEB-OFT-ANTIFIBROTICOS-PMC13627763
    valor: 0,1 a 0,5 mg/ml durante 1 a 5 minutos
  - fuente: WEB-OFT-ANTIFIBROTICOS-PMC12989694
    valor: mínimo 0,4 mg/ml durante 3 minutos; hasta 1,0 mg/ml en casos difíciles
  - fuente: WEB-OFT-ANTIFIBROTICOS-EYEWIKI.ORG/TRABECULECTOMY
    valor: 30 segundos a 5 minutos
  mostrado: 0,1 a 0,5 mg/ml
  motivo: Cada autor fija su propia concentración y tiempo según el riesgo del paciente; se muestra el rango de la fuente
    principal (0,1 a 0,5 mg/ml), que incluye todo lo que otros usan salvo los casos difíciles, y la dosis la define el cirujano.
