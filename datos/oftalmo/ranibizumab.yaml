conservacion:
- texto: Conservar en nevera (2–8 °C), sin congelar. Antes de usar, el vial sin abrir puede estar hasta 24 horas a 25 °C.
  horas: 24
  fuente:
    ref: CIMA-OFT-RANIBIZUMAB-106374004
    detalle: 6.3 Periodo de validez
- texto: 'Alícuotas de farmacia (jeringas de 0,5 ml): 9 días refrigeradas según el PNT; el consenso da 28 días de estabilidad
    fisicoquímica a 2–8 °C.'
  horas: 216
  fuente:
    ref: SEFH-PNT-RANIBIZUMAB-05MG-005ML-INYECCIN-INTRAVTREA-PNT
    detalle: 'Conservación y plazo de validez: 9 días'
contraindicaciones:
- Hipersensibilidad al ranibizumab o a alguno de los excipientes; infección ocular o periocular activa o sospechada; inflamación
  intraocular activa grave (CIMA 4.3).
alertas:
- 'La presentación trae más volumen que la dosis: elimina el exceso hasta la marca de 0,05 ml antes de inyectar. Inyectar
  todo el contenido puede causar una sobredosis (CIMA 4.2 y 6.6).'
- El PNT de la SEFH describe un fraccionamiento en alícuotas de 0,065 ml en jeringas de 0,5 ml sin espacio muerto; es una
  preparación de farmacia y no tiene verificador porque no hay dilución.
