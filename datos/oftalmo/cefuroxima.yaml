contraindicaciones:
- Hipersensibilidad a la cefuroxima o a las cefalosporinas (CIMA 4.3).
alertas:
- NO INYECTAR MÁS DE LA DOSIS RECOMENDADA. Un error de dilución que dio 40 a 50 veces la dosis causó inflamación grave del
  segmento anterior y mala agudeza visual en 6 pacientes (CIMA 4.9).
- 'Reacción anafiláctica: muy rara, menos de 1 en 10.000 (CIMA 4.8).'
- Pegar la etiqueta desprendible del vial en la historia clínica del paciente (CIMA 6.6).
