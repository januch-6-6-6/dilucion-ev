alertas:
- La guía ESCRS recomienda un antibiótico intracameral (p. ej. cefuroxima 1 mg/0,1 ml) al final de la cirugía de catarata;
  los antibióticos subconjuntivales adicionales los respalda una sola guía (Surawatsatien 2025).
- 'Con cefuroxima subconjuntival se describió toxicidad retinal por sobredosis y por penetración escleral accidental (Ku 2022;
  Raharja 2022): el mismo riesgo vale para cualquier antibiótico subconjuntivo si hay error de dilución.'
- 'Ninguna guía de sociedad fija la dosis subconjuntival de antibióticos: las cifras salen de estudios aislados. Verifica
  el protocolo de tu pabellón.'
