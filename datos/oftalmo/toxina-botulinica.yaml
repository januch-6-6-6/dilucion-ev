pediatria:
  estado: no_establecida
  motivo: La indicación de la etiqueta FDA para estrabismo y blefaroespasmo es para pacientes de 12 años o más; no hay pauta
    en menores.
conservacion:
- texto: 'Usar dentro de las 24 horas posteriores a la reconstitución; mientras tanto, guardar el sobrante en refrigerador
    (2–8 °C). El vial es de una sola dosis: descartar lo que no se use.'
  horas: 24
  fuente:
    ref: WEB-OFT-TOXINA-BOTULINICA-SETID=33D066A9
    detalle: 'Conservación: administrar dentro de 24 horas tras reconstituir, 2–8 °C, vial de una sola dosis'
contraindicaciones: []
alertas:
- La dosis y el tiempo de aplicación los define el cirujano; esta ficha solo muestra lo que publican las fuentes.
- 'El verificador compara solo con las diluciones de la etiqueta (1,25; 2,5 y 5 U por 0,1 ml). La dosis en U por sitio y el
  volumen por músculo no se verifican: los define el cirujano.'
- 'ALTO RIESGO: las unidades de Botox NO son intercambiables con las de otras toxinas botulínicas (Dysport, Xeomin y otras);
  no conviertas unidades entre marcas.'
- Reconstituir SOLO con cloruro de sodio al 0,9 % inyectable sin conservantes (etiqueta FDA).
- En el tratamiento del estrabismo se han producido hemorragias retrobulbares capaces de comprometer la circulación de la
  retina; hay que tener a mano instrumentos para descomprimir la órbita (etiqueta FDA).
- En el blefaroespasmo puede haber ptosis (evitar el elevador del párpado), diplopía (evitar inyecciones mediales en el párpado
  inferior) y exposición corneal por disminución del parpadeo (etiqueta FDA).
