alertas:
- La anfotericina B puede causar toxicidad retiniana (EyeWiki).
- 'Un error de unidades es posible: 5 µg/0,1 ml no es 0,5 mg/0,1 ml (Leung 2019 cita ambas cifras). Esta ficha no trae pasos
  de preparación: se descartaron las recetas de fuentes con errores de unidades.'
- Con aceite de silicona no se recuperó la anfotericina B a las concentraciones intravítreas (Leung 2019, estudio in vitro).
