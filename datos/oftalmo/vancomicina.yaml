contraindicaciones:
- Hipersensibilidad al principio activo o a algún excipiente (ficha técnica de uso intravenoso, CIMA 4.3).
- La ficha de uso intravenoso prohíbe la vía intramuscular por riesgo de necrosis (CIMA 4.3).
alertas:
- 'ALERTA ROJA — La vancomicina intraocular se ha asociado a vasculitis retiniana oclusiva hemorrágica (HORV): en la serie
  de 36 ojos, 33 recibieron vancomicina por bolo intracameral, 22 (61 %) terminaron con visión de 20/200 o peor y 8 (22 %)
  sin percepción de luz (Witkin 2017). No uses esta ficha para la vía intracameral.'
- Reducir la dosis de los antibióticos intravítreos si se usó gas o aceite de silicona (PNT SEFH).
