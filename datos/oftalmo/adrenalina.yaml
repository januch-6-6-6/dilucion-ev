alertas:
- 'Las concentraciones publicadas NO son equivalentes: 0,025 % (≈1:4000, epi-Shugarcaine), 1:3000 (≈0,033 %, Nuzzi), 0,015
  % (Jun) y 0,001 % (1:100.000, Yu). No se encontró una guía de AAO, ESCRS o RCOphth con una receta propia.'
- 'Usar adrenalina sin bisulfito: el bisulfito es tóxico para el endotelio corneal (Jun 2018, Myers 2009).'
- El uso de adrenalina en la irrigación es off-label (Kaur 2023).
- La receta epi-Shugarcaine pide lidocaína al 4 % sin conservantes; en el ISP solo aparecen ampollas de lidocaína al 1 % y
  2 %.
- Shugar midió un pH de 3,13 para la adrenalina sola y de 6,90 para la mezcla con BSS Plus; el BSS simple sirve de diluyente
  si no hay BSS Plus.
