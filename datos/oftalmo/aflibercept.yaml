contraindicaciones:
- Hipersensibilidad al aflibercept; infección ocular o periocular activa o sospechada; inflamación intraocular activa grave
  (CIMA 4.3).
alertas:
- 'La presentación trae más volumen que la dosis: elimina el exceso hasta la marca de 0,05 ml antes de inyectar. Inyectar
  todo el contenido puede causar una sobredosis (CIMA 4.2 y 6.6).'
- 'Cada vial o jeringa es para un solo ojo: extraer varias dosis de un mismo envase aumenta el riesgo de contaminación e infección
  (CIMA 4.2).'
- En Chile también está registrado Eylia 8 mg/0,07 mL (ISP B-3222/26). Su posología no se carga porque no se consultó su ficha
  técnica.
