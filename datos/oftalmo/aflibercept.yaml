conservacion:
- texto: Conservar en nevera (2–8 °C). Las alícuotas de farmacia duran 9 días refrigeradas según el PNT; el consenso da 28
    días de estabilidad fisicoquímica a 2–8 °C.
  horas: 216
  fuente:
