  - fuente: WEB-OFT-AMIKACINA-IV-PMC13405202
    valor: 2,25 mg/0,1 ml (Fenniri 2026)
  - fuente: WEB-OFT-AMIKACINA-IV-PMC13421665
    valor: 2,25 mg/0,1 ml (ensayo EVIAN)
  mostrado: 2 mg/0,1 ml
  motivo: Las fuentes españolas (PNT y consenso) dan 2 mg; las publicaciones de EE. UU. y del ensayo EVIAN dan 2,25 mg. Se
    muestra la cifra que trae el protocolo de preparación verificable.
