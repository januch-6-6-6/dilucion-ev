  motivo: La ficha técnica no establece la seguridad ni la eficacia en menores de 18 años (CIMA).
conservacion:
- texto: Una vez abierto el vial, usar la suspensión de inmediato. No congelar y proteger de la luz.
  fuente:
    ref: CIMA-OFT-TRIAMCINOLONA-74673
    detalle: 6.3 y 6.4
contraindicaciones: []
alertas:
- Control de la presión intraocular tras la inyección; el riesgo de alza es mayor en pacientes predispuestos, como los diabéticos
  (CIMA 4.4).
- La presión intraocular elevada, la endoftalmitis y las cataratas son más frecuentes cuando se usa con fines terapéuticos
  que para visualizar (CIMA 4.8).
- Inyectar en el vítreo cuanto antes tras extraerla para que no se deposite en la jeringa; una congelación puede aglomerarla
  y entonces no debe usarse (CIMA 4.2).
- La preparación inyectable corriente lleva alcohol bencílico y no debe usarse en recién nacidos ni prematuros (Pediamécum).
