    detalle: 'Tabla 4: alteplasa intravítrea, 365 días a −70 °C'
contraindicaciones: []
alertas:
- 'El riesgo principal es el sangrado intraocular (hipema o resangrado), que depende de la dosis: sobre todo con más de 25
  µg o en los primeros 5 a 9 días (EyeWiki).'
- 'Toxicidad retiniana a dosis altas: evitar más de 50 µg por vía intravítrea (EyeWiki).'
- Toxicidad endotelial dependiente de la dosis in vitro; el efecto clínico es mínimo con 25 µg/0,1 ml (EyeWiki).
- 'Preparación según EyeWiki: reconstituir a 1 mg/ml y diluir con suero sin conservantes hasta la concentración deseada, con
  técnica estéril estricta. La fuente no da los volúmenes de la dilución final (solo el valor deseado); el vial de 50 mg se
  reconstituye con los 50 ml de agua que trae (CIMA 6.6).'
