dosis:
- indicacion: Fibrina en cámara anterior, obstrucción de un dispositivo de drenaje
  via: intracameral
  poblacion: adulto
  final:
    cantidad:
      min: 6
      max: 25
      unidad: mcg
    volumenMl: 0.1
  texto: '6 a 25 µg en 0,1 ml. Fibrina ya establecida: 10 a 25 µg (empezar con menos para reducir el riesgo de sangrado).
    Administrar después de 5 a 9 días del posoperatorio se asocia con menos complicaciones.'
  estatus: off_label
  fuente:
    ref: WEB-OFT-EYEWIKI-TPA-EYEWIKI.ORG/TISSUE
    detalle: 'Intracameral: «Dose: 6-25 µg in 0.1 mL»; fibrina establecida 10-25 µg'
- indicacion: Endoftalmitis o TASS con fibrina
  via: intravitrea
  poblacion: adulto
  final:
    cantidad:
      valor: 25
      unidad: mcg
    volumenMl: 0.1
  texto: Unos 25 µg en 0,05 a 0,1 ml. En endoftalmitis mejora la visualización (la fibrina se despeja en 2 a 14 horas); en
    TASS, cerca del 80 % de la fibrina se resuelve en 24 horas.
  estatus: off_label
  fuente:
    ref: WEB-OFT-EYEWIKI-TPA-EYEWIKI.ORG/TISSUE
    detalle: 'Intravítrea/intracameral: «Dose: ~25 µg in 0.05-0.1 mL»'
  tambien:
  - ref: CONSENSO-SEFH-SEO-SERV-2025
    detalle: 'Tabla 4: alteplasa intravítrea 25 µg/0,1 ml'
- indicacion: Hemorragia submacular
  via: intravitrea
  poblacion: adulto
  final:
    cantidad:
      min: 12.5
      max: 25
      unidad: mcg
    volumenMl: 0.1
  texto: 12,5 a 25 µg en 0,1 ml inyectados en el vítreo.
  estatus: off_label
  fuente:
    ref: WEB-OFT-EYEWIKI-TPA-EYEWIKI.ORG/TISSUE
    detalle: 'Subretiniana: «12.5-25 µg in 0.1 mL injected intravitreally»'
- indicacion: Hemorragia submacular
  via: subretiniana
  poblacion: adulto
  texto: 25 a 50 µg en 0,1 a 0,2 ml directamente al espacio subretiniano con una cánula de 41 G.
  estatus: off_label
  fuente:
    ref: WEB-OFT-EYEWIKI-TPA-EYEWIKI.ORG/TISSUE
    detalle: 'Subretiniana: «25-50 µg in 0.1-0.2 mL injected directly into the subretinal space through a 41-gauge cannula»'
- indicacion: Profilaxis de fibrina en cirugía pediátrica
