sinPauta: null
pediatria:
  estado: no_establecida
  motivo: 'Pediamécum: en retinopatía del prematuro hay datos limitados (0,625 mg en dosis única; rango 0,37 a 1,25 mg) y
    la dosis óptima no está establecida; la fuente no da el volumen de inyección, por eso no se carga como dosis.'
conservacion:
- texto: 'Jeringa preparada según el PNT: 9 días en refrigerador (2–8 °C), protegida de la luz. Hay datos de 3 meses; para
    eso o para lotes de más de 25 unidades hay que hacer control de esterilidad.'
  horas: 216
  fuente:
    ref: SEFH-PNT-BEVACIZUMAB-25MG-ML-INYECCIN-INTRAVTREA-PNT
    detalle: 'Conservación y plazo de validez: 9 días'
- texto: 'Consenso SEFH-SEO-SERV: 180 días de estabilidad fisicoquímica a 2–8 °C en jeringas de policarbonato o polipropileno
    (grado A+); el plazo real lo limitan los controles microbiológicos.'
  horas: 4320
  fuente:
    ref: CONSENSO-SEFH-SEO-SERV-2025
    detalle: 'Tabla 4: bevacizumab 25 mg/ml, 180 días a 2–8 °C'
contraindicaciones:
- No hay contraindicaciones propias de la vía intravítrea en las fuentes consultadas; el frasco no está autorizado para esta
  vía.
alertas:
- 'No agitar el vial y trasvasar con cuidado: la agitación y las burbujas agregan la proteína. Descartar la jeringa si hay
  turbidez (PNT SEFH).'
- Se han notificado casos individuales y brotes de acontecimientos adversos oculares graves tras el uso intravítreo fuera
  de indicación de bevacizumab (Pediamécum).
- 'La jeringa se prepara con 0,15 ml para inyectar 0,05 ml: el resto es espacio muerto de la aguja. Inyectar solo hasta la
  marca de 0,05 ml (PNT SEFH).'
