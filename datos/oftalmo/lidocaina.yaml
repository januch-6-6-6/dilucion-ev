alertas:
- 'Para uso intracameral debe ser lidocaína SIN conservantes; el ISP no informa si las ampollas de Chile los llevan: confírmalo
  en el rótulo.'
- 'No repetir la lidocaína intracameral si hubo ruptura de la cápsula posterior: riesgo de toxicidad retiniana (Eshraghi 2015).'
- Se han descrito pérdida visual completa y transitoria tras la lidocaína intracameral, y edema macular quístico después (Eshraghi
  2015; Mohammadpour 2018).
- 'Agujas finas y cortas, no más de 25 G ni de 25 mm. Perforación del globo: 1 de cada 874 a más de 16.000 bloqueos con aguja
  afilada; el riesgo sube en ojos miopes con longitud axial sobre 26 mm (RCoA/RCOphth 2012).'
- 'Todos los anestésicos locales son miotóxicos: evitar inyectarlos dentro de un músculo (RCoA/RCOphth 2012).'
- 'Anestesia del tronco cerebral con bloqueos retrobulbar, peribulbar y subtenoniano: los síntomas aparecen dentro de 10 minutos
  (RCoA/RCOphth 2012).'
