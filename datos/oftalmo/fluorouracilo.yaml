alertas:
- La dosis y el tiempo de aplicación los define el cirujano; esta ficha solo muestra lo que publican las fuentes.
- 'ALTO RIESGO: con 5-FU hay una alta incidencia de toxicidad corneal (EyeWiki).'
- Una dosis total baja se define como menos de 19 mg; las demás complicaciones son más frecuentes tras las inyecciones de
  5-FU, sin aumento de las que amenazan la visión (Cochrane 2014).
- Hoy se usa de forma ad hoc y casi no como esquema rutinario posoperatorio (Cochrane 2014).
